 bounded vs unbounded input, and the line is blurring (Spark = streaming on a batch engine via microbatches; Flink = batch on a stream engine). Microbatching may do poorly on hopping/sliding windows.\n- **Functional flavor**: deterministic pure functions, immutable inputs, append-only outputs; stream adds managed fault-tolerant state.\n- Async maintenance is what makes log-based systems robust. Cross-partition secondary indexes are also most reliable and scalable when maintained asynchronously.\n- **Reprocessing for evolution**: stream gives low delay; batch re-derives new views from history. Without reprocessing, schema changes are limited to adding an optional field or record type.\n\n> [!tip] Railway gauge analogy\n> 19th-century England standardized gauge in 1846 by adding a third rail (dual gauge), so both train types ran during migration. Likewise, keep old and new derived views side by side, shift users gradually, then drop the old view. Every step is reversible.\n\n**Lambda architecture** (batch plus stream in parallel): stream gives a fast approximate view, batch later gives a corrected one, both from the same immutable event log.\n\n| Strength | Practical problems |\n|---|---|\n| popularized immutable events plus derived views and reprocessing | same logic maintained in two frameworks (Summingbird abstracts it but ops stay hard) |\n| batch seen as simpler, stream as approximate | two outputs need merging; hard for joins, sessionization, non-time-series |\n| | frequent full reprocessing is costly, so batch becomes incremental, adding stream-like complexity |\n\n**Unifying batch and stream** (needs): replay of history through the same engine, exactly-once semantics, windowing by **event time** (Apache Beam API running on Flink or Cloud Dataflow).\n\n## 2. Unbundling databases\n\nDatabases, Hadoop and operating systems all store and process data. Unix gives thin low-level abstractions (files, pipes); relational DBs give high-level ones (SQL, transactions). NoSQL is read as the Unix-like approach for distributed OLTP.\n\n### Databases already derive data\n\nSecondary indexes, materialized views, replication logs and full-text indexes are built-in derivations. `CREATE INDEX` scans a consistent snapshot, sorts and writes the index, processes the write backlog, then keeps it updated. That is the same as setting up a follower or bootstrapping CDC (snapshot plus changes).\n\n**Meta-database of everything:** org-wide dataflow looks like one huge database; batch/stream/ETL jobs act like trigger and materialized-view maintenance, and derived systems are like different index types, just run by different teams on different machines.\n\n### Two ways to compose\n\n| | Federated databases (unify **reads**) | Unbundled databases (unify **writes**) |\n|---|---|---|\n| Idea | one query interface over many stores (polystore); PostgreSQL foreign data wrapper | CDC and event logs keep writes in sync across systems |\n| Tradition | relational: one system, high-level language | Unix: small tools, uniform low-level API (pipes), composed by a higher-level language |\n| Difficulty | mapping data models (manageable) | keeping writes in sync (the harder problem) |\n\n### Making unbundling work\n\n- Cross-technology distributed transactions are the wrong tool. Use an **asynchronous event log with idempotent consumers**: simpler and feasible across systems written by different teams.\n- Benefit is **loose coupling**: (1) system level: a slow/failed consumer is buffered by the log, fault contained, unlike synchronous transactions that spread failure; (2) human level: independent teams own components with well-defined interfaces.\n\n```mermaid\nflowchart LR\n    App[\"Application writes\"] --> Log[\"Ordered event log\"]\n    Log --> Idx[(\"Search index\")]\n    Log --> Cache[(\"Cache\")]\n    Log --> ML[\"ML model / analytics\"]\n    Log --> DW[(\"Warehouse\")]\n```\n\n### Unbundled vs integrated\n\n- Unbundling will not replace databases (still needed for stream state and for serving outputs; MPP warehouses are great for exploration).\n- Fewer moving parts is better; one integrated product can be more predictable. If one technology does everything you need, use it. The goal of unbundling is **breadth, not depth**; it matters only when no single product fits.\n- **Missing piece:** a declarative \"Unix shell\" for composing stores, e.g. `mysql | elasticsearch` as the unbundled `CREATE INDEX`. Early research: differential dataflow.\n\n## 3. Designing applications around dataflow\n\n\"Database inside-out\" is a design pattern, not a new architecture. It overlaps with dataflow languages, functional reactive programming (Elm), logic programming (Bloom), and spreadsheets (VisiCalc, 1979), where changing a cell recalculates its dependents. Data systems should do this while being fault-tolerant, scalable and durable.\n\n### Application code as derivation function\n\n| Derived dataset | Function |\n|---|---|\n| secondary index | pick indexed fields, sort |\n| full-text index | language detection, stemming, spell-fix, synonyms, inverted index |\n| ML model | feature extraction plus statistics on training data |\n| cache | aggregation shaped for the UI (UI change means rebuild) |\n\nStandard ones are built in (`CREATE INDEX`); custom code is where databases are weak (triggers and stored procedures are afterthoughts).\n\n### Separation of code and state\n\nDatabases are poor deployment environments (dependency management, rolling upgrades, monitoring, version control). Use Kubernetes, YARN, Mesos for code, databases for state: \"separation of Church and state\". Weakness: the DB is a passive mutable variable you can only poll, not subscribe to.\n\n### Dataflow: state changes and code\n\nApplication code reacts to changes in one place by causing changes elsewhere. Maintaining derived data is **not** the same as async job execution:\n\n- **Order matters**: views from one log must apply events in the same order; redelivery reordering and dual writes are ruled out.\n- **Reliability matters**: one lost message means permanent divergence; in-memory actor state is not enough.\n\nStream operators compose like Unix pipes, each taking state-change streams and producing others.\n\n**Stream processors vs microservices**. Same loose-coupling benefits, but streams are one-way async instead of synchronous request/response. Currency example: the microservice calls an exchange-rate service; the dataflow version subscribes to rate updates and keeps a **local** table, so a purchase does a local lookup. \"The fastest and most reliable network request is no network request.\" It is a stream-table join, so time-dependence applies: reprocessing needs the historical rate.\n\n### Observing derived state\n\n- **Write path**: eagerly precomputed work as data arrives (like eager evaluation). **Read path**: work done on request (lazy evaluation). The derived dataset is where they meet.\n- Index, cache and materialized view just **shift the boundary**: more write work to save read work.\n\n| Option (search example) | Write path | Read path |\n|---|---|---|\n| no index, scan like `grep` | none | very expensive |\n| inverted index | update terms | lookup and Boolean logic |\n| precompute all queries | infinite | trivial (impossible) |\n| cache of common queries | small extra | fast for common, index for rest |\n\nTwitter timelines (Ch. 1) are the same trade-off, drawn differently for celebrities.\n\n- **Stateful, offline-first clients:** on-device state is a **cache of server state**; screen pixels are a materialized view over model objects.\n- **Push to clients:** server-sent events and WebSockets extend the write path to the end user. Offline devices catch up like consumers resuming from an offset. Elm and React/Flux/Redux already use event-sourcing-like client state. Obstacle: most datastores and frameworks assume request/response, not subscriptions. Chat and games already work this way.\n- **Reads are events too:** route read requests through the stream processor as events; serving a read is a stream-table join (a subscribe is a persistent join). Logging reads aids causal tracking and provenance (what the user saw before buying: shipping date, stock), at extra storage and I/O cost.\n- **Multi-partition processing:** queries touching many partitions can use stream routing and joins. Examples: Storm distributed RPC (people who saw a URL on Twitter = union of followers' sets) and fraud scoring across partitioned reputation DBs (IP, email, billing, shipping address). An MPP database is simpler if it suffices.\n\n## 4. Aiming for correctness\n\nStateful systems remember mistakes forever, so correctness needs care. ACID transactions are weaker than they seem (weak isolation confusion; Jepsen found gaps between claims and behaviour). Serializability and atomic commit work, but typically in a single datacenter and limit scale.\n\n### End-to-end argument\n\nA strong DB does not protect against app bugs or retries.\n\n**Exactly-once = idempotence.** Problem: a client sends COMMIT, the connection drops, and it does not know the outcome. Retrying the non-idempotent transfer from Example 12-1 could move **$22 instead of $11**. TCP dedup works only inside one connection; 2PC breaks the 1:1 transaction-connection link but does not fix the user-to-server hop (browser POST retry).\n\n**Fix: operation ID end to end.** Generate a UUID (hidden form field, or hash of fields), pass it all the way to the DB, add `UNIQUE(request_id)` on a `requests` table. A second insert fails and the transaction aborts. Uniqueness constraints hold even at weak isolation, unlike check-then-insert. The `requests` table acts as an event log; balance updates can be derived downstream, exactly once.\n\n**End-to-end argument** (Saltzer, Reed, Clark, 1984): a function can be fully implemented only with the endpoints' help; lower-level versions are performance enhancements. Applies to dedup, integrity (Ethernet/TCP/TLS checksums do not catch software or disk corruption), and encryption (WiFi or TLS do not equal end-to-end). Low-level features still help by reducing high-level faults.\n\nTransactions collapse many failures into commit/abort, but are costly across heterogeneous stores; the right abstraction for app-level fault tolerance is not found yet.\n\n### Enforcing constraints\n\n- **Uniqueness needs consensus** (usernames, seat booking, non-negative balance, stock, room overlap). Usual way: one leader; scale by partitioning on the unique value (hash of username). Async multi-master is ruled out; rejecting violations immediately needs synchronous coordination.\n- **Via log**: append requests to a partition by hash of the value; one single-threaded stream processor with a local table decides first-come, emits success/rejection on an output stream; the client waits for its result. Scales by adding partitions (any conflict-prone writes go to the same partition).\n\n```mermaid\nflowchart LR\n    R[\"Request: transfer A to B, request ID\"] --> L1[\"Log partition by request ID\"]\n    L1 --> SP[\"Stream processor (deterministic)\"]\n    SP -->|\"debit A, with request ID\"| DA[\"Partition by payer A\"]\n    SP -->|\"credit B, with request ID\"| CB[\"Partition by payee B\"]\n    DA --> P1[\"Dedupe by request ID, apply\"]\n    CB --> P2[\"Dedupe by request ID, apply\"]\n```\n\n- **Multi-partition without atomic commit**: log the request as a single message (single-object writes are atomic), derive debit and credit instructions, dedupe by request ID. After a processor crash it replays from a checkpoint and produces the same duplicates, which step 3 discards. An extra processor partitioned by payer can validate balances before requests enter the log.\n\n### Timeliness vs integrity\n\n| | Timeliness | Integrity |\n|---|---|---|\n| Meaning | users see an up-to-date state | no corruption: no loss, no contradiction, derivations correct |\n| Violation | temporary, fixed by waiting (\"eventual consistency\") | permanent (\"perpetual inconsistency\"), needs repair |\n| Importance | annoying | **catastrophic** (usually more important) |\n\nExamples: a recent card transaction not yet shown is fine; statement balance not equal to the sum of transactions, or money charged but not paid, is an integrity failure. ACID gives both; dataflow systems **decouple** them. Integrity via: single-message atomic writes, deterministic derivation, end-to-end request IDs, immutable messages with reprocessing.\n\n### Loosely interpreted constraints\n\nMany businesses tolerate temporary violation plus **compensating transactions** (apology): duplicate username, oversold stock (reorder, discount), overbooked flights/hotels, overdrafts (fee, daily limits). Whether the cost of an apology is acceptable is a business decision.\n\nWrite optimistically and check after, but validate before irreversible actions. These apps need integrity, not timely enforcement.\n\n**Coordination-avoiding systems:** strong integrity without atomic commit, linearizability or cross-partition coordination; can run multi-leader across datacenters asynchronously. Serializable transactions only in small scope; no XA. Coordination reduces apologies for inconsistency but increases apologies for outages: find the sweet spot.\n\n### Trust, but verify\n\n- System models assume some faults never happen, but it is probabilities, not binary. Bit flips happen (crash reports only explained by memory corruption; rowhammer), disks corrupt silently, TCP checksums can miss errors. Even MySQL and PostgreSQL had bugs (uniqueness constraint, serializable write skew). App code is buggier and often misuses constraints.\n- **Auditing**: verify data, restore backups to test them. HDFS and S3 continually read back files and compare replicas. Want **self-validating** systems; ACID culture bred blind trust.\n- **Designing for auditability**: event sourcing keeps one immutable input event with deterministic derivation; hashes check event storage; rerun derivations (or run redundant ones) to compare; supports time-travel debugging and data provenance. End-to-end checks cover disks, networks, services, algorithms, and let you change systems with confidence.\n- **Tools**: audit tables and HSM-signed logs are not enough. Blockchains and distributed ledgers (Bitcoin, Ethereum) are distributed DBs across mutually untrusting replicas; author is skeptical of Byzantine tolerance and proof of work, but finds integrity checking interesting. **Merkle trees** (hash trees) prove records exist; used in **certificate transparency**.\n\n## 5. Doing the right thing\n\nEngineers are responsible for consequences; datasets are about people and deserve dignity. A technology is neither good nor bad in itself.\n\n| Topic | Key points |\n|---|---|\n| **Predictive analytics** | high-stakes uses (recidivism, loans, insurance) can create an \"algorithmic prison\": systematic exclusion with no proof of guilt and little appeal |\n| **Bias** | models learn and amplify bias; correlated features (postal code, IP) proxy for protected traits; \"machine learning is like money laundering for bias\"; need moral imagination |\n| **Accountability** | who is responsible for algorithmic errors? Credit scores reflect your past, ML asks \"who is similar to you\"; statistical output is wrong for individuals; need transparency and recourse |\n| **Feedback loops** | echo chambers; credit-score-for-hiring spiral; use **systems thinking** |\n| **Tracking and surveillance** | tracking as a side effect shifts users from customers to product when ads fund the service; replace \"data\" with \"surveillance\" as a thought experiment; microphones everywhere; insurance tied to trackers |\n| **Consent** | users cannot understand what is collected or derived; the exchange is one-sided; opting out is not free when a service is socially essential or has network effects |\n| **Privacy** | a decision right over what to reveal to whom; surveillance **transfers** that right to the company; privacy settings do not limit the service itself |\n| **Data as power** | \"data exhaust\" is really the core asset; data brokers; governments want it; breaches happen; data is \"toxic\" or \"hazardous\"; consider all possible future governments |\n| **Industrial Revolution analogy** | pollution needed regulation; Schneier: data is the pollution problem of the information age |\n| **Legislation** | 1995 EU Data Protection Directive: specified, explicit, legitimate purposes, no excess; conflicts with Big Data exploration; regulation also risks blocking benefits like medical analytics |\n| **Self-regulation** | culture shift: users are humans, not metrics; do not retain forever, **purge** when not needed (tension with immutability); enforce access with **cryptographic protocols** not only policy |\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Rely on TCP/DB transactions for retry safety | duplicate operation across hops ($22 transfer) | end-to-end request ID, unique constraint |\n| Dual-write DB and index | permanent divergence | single ordered log, derive the rest |\n| Demand linearizable constraints everywhere | unnecessary coordination, lower availability | apologize and compensate where cost is acceptable |\n| Treat all \"consistency\" the same | wrong trade-offs | separate timeliness from integrity |\n| Maintain lambda in two codebases | double the bugs and ops | unified engine, event-time windows |\n| Assume hardware, DB and backups are perfect | silent corruption found too late | continuous end-to-end auditing, test restores |\n\n## Check yourself\n\n> [!question] Q1 · Why is the write path / read path boundary useful?\n>\n> > [!success] Answer\n> > Indexes, caches and materialized views move work from reads to writes (precompute). Choosing the boundary is the core trade-off, e.g., Twitter timelines or caching only common search queries.\n\n> [!question] Q2 · How can you transfer money across two partitions without atomic commit?\n>\n> > [!success] Answer\n> > Log one request message with a unique ID (single atomic append), derive a debit and a credit message from it, and have consumers dedupe by request ID. Replays reproduce the same messages deterministically.\n\n> [!question] Q3 · Which matters more, timeliness or integrity, and why?\n>\n> > [!success] Answer\n> > Usually integrity. Timeliness violations are temporary and fix themselves; integrity violations are permanent corruption needing repair.\n\n## Quick recall\n\n- No single tool fits all; compose via **derived data** from one system of record and an **ordered log**.\n- Log-based async integration beats XA: loose coupling contains faults; trade-off is weaker timing guarantees.\n- Total order has limits (scale, multi-DC, microservices, offline clients); causality is an open problem.\n- Lambda architecture duplicates logic; prefer one engine with replay, exactly-once and event-time windows.\n- Unbundling: federated reads plus log-based writes; goal is breadth, not outperforming one DB.\n- Dataflow apps: code as derivation functions, stream joins instead of RPC, push changes to clients.\n- Correctness is end to end: request IDs, idempotence, unique constraints, single-message writes.\n- Timeliness is not integrity; keep integrity, relax timeliness, compensate with apologies.\n- Trust but verify: audit, test restores, immutable events, Merkle-style checks.\n- Ethics: bias, accountability, feedback loops, surveillance, consent, privacy as decision right, purge data.\n"},{"id":"chapter_13_glossary","num":13,"title":"Glossary","part":"Reference","tagline":"A themed cheat sheet of the book's key terms.","notes":"---\ntags:\n  - ddia/glossary\n  - cheat-sheet\ndate: 2026-11-21\n---\n\n# Chapter 13: Glossary (cheat sheet)\n\n> [!abstract] Summary\n> The book's glossary gives short definitions of recurring terms. This sheet regroups them by theme, with a one-line meaning and the main chapter to revisit. The book itself warns the definitions are simplified, so follow the references for subtleties.\n\n## Data models and storage\n\n| Term | Meaning | Revisit |\n|---|---|---|\n| **schema** | structure of data (fields, types); can be checked at write or read time and can evolve | Ch. 2, 4 |\n| **graph** | vertices (nodes, entities) plus edges (relationships, arcs) | Ch. 2 |\n| **index** | structure for finding all records with a given field value | Ch. 3 |\n| **secondary index** | extra structure beside primary storage for other conditions | Ch. 3, 6 |\n| **full-text search** | arbitrary keyword search, fuzzy matching, synonyms; a kind of secondary index | Ch. 3 |\n| **primary key** | unique record identifier, usually system generated | Ch. 3 |\n| **normalized** | no duplication; change in one place | Ch. 2 |\n| **denormalize** | add redundancy (cache, index, precomputed result) to speed reads, like a materialized view | Ch. 2, 11 |\n| **cache** | remembers recent data for fast reads; incomplete, falls back to slower storage | Ch. 1 |\n| **locality** | keep data used together in the same place | Ch. 2 |\n| **hash** | function giving a random-looking, deterministic number; collisions possible | Ch. 6 |\n| **log** | append-only file: write-ahead log, log-structured engine, replication log, event log | Ch. 3, 5, 11 |\n\n## Analytics and derived data\n\n| Term | Meaning | Revisit |\n|---|---|---|\n| **OLTP** | fast queries reading or writing few records by key | Ch. 3 |\n| **OLAP** | aggregates (count, sum, average) over many records | Ch. 3 |\n| **data warehouse** | combined, prepared data from several OLTP systems for analytics | Ch. 3 |\n| **ETL** | extract, transform, load into a warehouse or batch system | Ch. 3, 10 |\n| **derived data** | produced from other data by a repeatable process (indexes, caches, materialized views) | Part III |\n| **system of record** | authoritative source of truth; others are derived from it | Part III |\n| **materialize** | compute eagerly and store, instead of on demand | Ch. 3, 10 |\n| **batch process** | fixed input, produces output, does not modify the input | Ch. 10 |\n| **stream process** | continuous computation over a never-ending event stream | Ch. 11 |\n| **join** | bring together records sharing something, e.g., via foreign key | Ch. 2, 10 |\n| **declarative** | state wanted properties, not steps; optimizer picks the plan | Ch. 2 |\n| **stored procedure** | transaction logic executed entirely on the DB server | Ch. 7 |\n\n## Scaling and replication\n\n| Term | Meaning | Revisit |\n|---|---|---|\n| **replication** | same data on several nodes (replicas) | Ch. 5 |\n| **leader** | replica allowed to accept writes (primary, master) | Ch. 5 |\n| **follower** | replica that only applies the leader's changes (secondary, slave, read replica, hot standby) | Ch. 5 |\n| **failover** | moving leadership to another node | Ch. 5 |\n| **split brain** | two nodes both believe they are leader; breaks guarantees | Ch. 5, 8 |\n| **partitioning** | splitting data or work across machines (sharding) | Ch. 6 |\n| **rebalance** | moving data or services between nodes to even out load | Ch. 6 |\n| **skew** | (1) uneven load across partitions (hot spots); (2) timing anomaly: read skew, write skew, clock skew | Ch. 6, 7, 8 |\n| **shared-nothing** | independent nodes with own CPU, memory and disk over a normal network | Part II |\n| **quorum** | minimum number of votes for an operation to count | Ch. 5 |\n| **percentile** | value below which a given share of observations fall (p95 = 95% faster) | Ch. 1 |\n\n## Transactions and concurrency\n\n| Term | Meaning | Revisit |\n|---|---|---|\n| **transaction** | group of reads and writes as one logical unit | Ch. 7 |\n| **atomic** | (1) concurrent: appears to happen at one instant; (2) transactional: all writes commit or all roll back | Ch. 7 |\n| **isolation** | degree concurrent transactions can interfere | Ch. 7 |\n| **serializable** | behaves as if transactions ran one at a time | Ch. 7 |\n| **durable** | believed not to be lost despite faults | Ch. 7 |\n| **lock** | mutual exclusion: others wait until released | Ch. 7, 8 |\n| **two-phase locking (2PL)** | lock everything read or written, hold until transaction end; gives serializability | Ch. 7 |\n| **two-phase commit (2PC)** | all nodes commit or all abort | Ch. 9 |\n| **idempotent** | safe to retry; repeated execution has the same effect as once | Ch. 11 |\n| **deterministic** | same input always gives the same output (no randomness, clock, network) | Ch. 11, 12 |\n\n## Distributed systems and faults\n\n| Term | Meaning | Revisit |\n|---|---|---|\n| **distributed** | multiple nodes over a network; partial failures, unclear what is broken | Ch. 8 |\n| **node** | an instance of software on a computer communicating over a network | Ch. 8 |\n| **fault-tolerant** | recovers automatically from machine or link failures | Ch. 1 |\n| **timeout** | simplest fault detector; cannot tell node failure from network problem | Ch. 8 |\n| **Byzantine fault** | node behaves arbitrarily wrong or maliciously | Ch. 8 |\n| **synchronous / asynchronous** | waiting for completion vs not waiting and assuming nothing about duration | Ch. 5, 8 |\n| **bounded / unbounded** | known upper limit on size or delay, or none | Ch. 8, 11 |\n| **backpressure** | slowing the sender because the receiver cannot keep up (flow control) | Ch. 11 |\n\n## Consistency and ordering\n\n| Term | Meaning | Revisit |\n|---|---|---|\n| **linearizable** | behaves as if one copy updated atomically | Ch. 9 |\n| **causality** | dependency from \"happens before\": responses, builds-upon | Ch. 5, 9 |\n| **total order** | any two items comparable; a *partial order* leaves some incomparable | Ch. 9 |\n| **consensus** | getting nodes to agree (e.g., on a leader); harder than it looks | Ch. 9 |\n| **CAP theorem** | the book calls it widely misunderstood and not useful in practice | Ch. 9 |\n\n## Quick recall\n\n- Many terms come in pairs: OLTP/OLAP, normalized/denormalized, leader/follower, bounded/unbounded, synchronous/asynchronous.\n- \"Derived data\" plus \"system of record\" frame Part III; \"log\" is the unifying structure across storage, replication and streams.\n- Idempotent and deterministic are the keys to safe retries and replay.\n- \"Skew\" and \"atomic\" each have two meanings; read context.\n"}],"readme":"# HLD\n\nhttps://github.com/prasadgujar/low-level-design-primer\nhttps://github.com/liquidslr/system-design-notes\nhttps://github.com/karanpratapsingh/system-design\nhttps://github.com/aasthas2022/SDE-Interview-and-Prep-Roadmap\n\n# Interview Handbook\n\nhttps://www.techinterviewhandbook.org/\nhttps://github.com/yangshun/tech-interview-handbook\n","tree":[{"n":".github","t":"d","k":[{"n":"workflows","t":"d","k":[{"n":"build-site.yml","t":"f","s":573,"h":".github/workflows/build-site.yml"}]}]},{"n":"chapter_01_reliable-scalable-maintainable","t":"d","k":[{"n":"notes.md","t":"f","s":13747,"r":"#/chapter_01_reliable-scalable-maintainable"}]},{"n":"chapter_02_data-models-query-languages","t":"d","k":[{"n":"notes.md","t":"f","s":16854,"r":"#/chapter_02_data-models-query-languages"}]},{"n":"chapter_03_storage-and-retrieval","t":"d","k":[{"n":"notes.md","t":"f","s":21561,"r":"#/chapter_03_storage-and-retrieval"}]},{"n":"chapter_04_encoding-and-evolution","t":"d","k":[{"n":"notes.md","t":"f","s":19829,"r":"#/chapter_04_encoding-and-evolution"}]},{"n":"chapter_05_replication","t":"d","k":[{"n":"notes.md","t":"f","s":19509,"r":"#/chapter_05_replication"}]},{"n":"chapter_06_partitioning","t":"d","k":[{"n":"notes.md","t":"f","s":12730,"r":"#/chapter_06_partitioning"}]},{"n":"chapter_07_transactions","t":"d","k":[{"n":"notes.md","t":"f","s":20937,"r":"#/chapter_07_transactions"}]},{"n":"chapter_08_trouble-with-distributed-systems","t":"d","k":[{"n":"notes.md","t":"f","s":19069,"r":"#/chapter_08_trouble-with-distributed-systems"}]},{"n":"chapter_09_consistency-and-consensus","t":"d","k":[{"n":"notes.md","t":"f","s":24304,"r":"#/chapter_09_consistency-and-consensus"}]},{"n":"chapter_10_batch-processing","t":"d","k":[{"n":"notes.md","t":"f","s":19995,"r":"#/chapter_10_batch-processing"}]},{"n":"chapter_11_stream-processing","t":"d","k":[{"n":"notes.md","t":"f","s":20693,"r":"#/chapter_11_stream-processing"}]},{"n":"chapter_12_future-of-data-systems","t":"d","k":[{"n":"notes.md","t":"f","s":23685,"r":"#/chapter_12_future-of-data-systems"}]},{"n":"chapter_13_glossary","t":"d","k":[{"n":"notes.md","t":"f","s":6550,"r":"#/chapter_13_glossary"}]},{"n":"designed-to-scale","t":"d","k":[],"h":"designed-to-scale/index.html","note":"844 files, separate sub page (own index.html)"},{"n":"site-src","t":"d","k":[{"n":"build_site.py","t":"f","s":5525,"h":"site-src/build_site.py"},{"n":"template.html","t":"f","s":39258,"h":"site-src/template.html"}]},{"n":".gitignore","t":"f","s":11,"h":".gitignore"},{"n":".nojekyll","t":"f","s":0,"h":".nojekyll"},{"n":"CNAME","t":"f","s":20,"h":"CNAME"},{"n":"index.html","t":"f","s":288400,"h":"index.html"},{"n":"Readme.md","t":"f","s":337,"r":"#/extras"}],"explorer":{"title":"Designed to Scale","href":"designed-to-scale/index.html"}}</script>

'use strict';

const D = JSON.parse(document.getElementById('site-data').textContent);
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const hasLib = n => typeof window[n] !== 'undefined';
const TITLE = 'HLD · High Level Design notes';

/* ---------- theme ---------- */
function theme() { return document.documentElement.dataset.theme || 'light'; }
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
}
$('#themeBtn').addEventListener('click', () => { setTheme(theme() === 'dark' ? 'light' : 'dark'); route(true); });

/* ---------- markdown ---------- */
function stripFront(md) {
  const m = md.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return { meta: { tags: [] }, body: md };
  const meta = { tags: [] };
  let inTags = false;
  m[1].split('\n').forEach(l => {
    if (/^tags:/.test(l)) { inTags = true; return; }
    if (inTags && /^\s+-\s+/.test(l)) { meta.tags.push(l.replace(/^\s+-\s+/, '').trim()); return; }
    inTags = false;
    const kv = l.match(/^(\w+):\s*(.*)$/);
    if (kv) meta[kv[1]] = kv[2].replace(/^"|"$/g, '');
  });
  return { meta, body: md.slice(m[0].length) };
}

function highlight(code, lang) {
  if (hasLib('hljs') && lang && hljs.getLanguage(lang)) {
    try { return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch (e) {}
  }
  return esc(code);
}

if (hasLib('marked')) {
  marked.use({
    gfm: true,
    renderer: {
      code(code, info) {
        const lang = (info || '').split(/\s+/)[0];
        if (lang === 'mermaid') return '<pre class="mermaid">' + esc(code) + '</pre>';
        const l = lang === 'text' || lang === 'txt' ? '' : lang;
        return '<pre><code class="hljs' + (l ? ' language-' + l : '') + '">' + highlight(code, l) + '</code></pre>';
      }
    }
  });
}

function slug(s) { return s.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-'); }

function transformCallouts(root) {
  [...root.querySelectorAll('blockquote')].reverse().forEach(bq => {
    const p = bq.firstElementChild;
    if (!p || p.tagName !== 'P') return;
    const m = p.innerHTML.match(/^\[!(\w+)\]([+-]?)[ \t]*([^\n]*)\n?([\s\S]*)$/);
    if (!m) return;
    const type = m[1].toLowerCase(), fold = m[2];
    const title = m[3] || type.charAt(0).toUpperCase() + type.slice(1);
    const rest = m[4].replace(/^<br\s*\/?>\s*/, '').trim();
    const box = document.createElement(fold ? 'details' : 'div');
    box.className = 'callout callout-' + type;
    if (fold === '+') box.open = true;
    const head = document.createElement(fold ? 'summary' : 'div');
    head.className = 'callout-title';
    head.innerHTML = title;
    const body = document.createElement('div');
    body.className = 'callout-body';
    if (rest) p.innerHTML = rest; else p.remove();
    while (bq.firstChild) body.appendChild(bq.firstChild);
    box.append(head, body);
    bq.replaceWith(box);
  });
}

// Wikilinks and relative links to chapter notes become site routes.
function chapterFromName(name) {
  const n = name.replace(/\.md$/, '').replace(/^\.\//, '');
  return D.chapters.find(c => c.id === n || c.id.replace(/^chapter_/, '') === n) || null;
}
function preprocess(md) {
  return md.split(/(```[\s\S]*?```)/g).map((part, i) => i % 2 ? part :
    part.replace(/\[\[([^\]|#]+)(#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, name, h, label) => {
      const c = chapterFromName(name.trim());
      const text = label || name.trim();
      return c ? '[' + text + '](#/' + c.id + ')' : text;
    })).join('');
}

function rewriteLinks(root) {
  root.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/^(https?:|mailto:)/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (h.charAt(0) === '#') return;
    const path = decodeURI(h.split('#')[0]).replace(/^\.\//, '').replace(/^\.\.\//, '');
    const m = path.match(/^(chapter_[\w-]+)(?:\/notes\.md)?\/?$/);
    if (m && byId[m[1]]) a.setAttribute('href', '#/' + m[1]);
    else if (/^readme\.md$/i.test(path)) a.setAttribute('href', '#/extras');
  });
}

function addIds(root) {
  const used = {}, list = [];
  root.querySelectorAll('h1,h2,h3').forEach(h => {
    let id = slug(h.textContent) || 'section';
    if (used[id]) id += '-' + (++used[id]); else used[id] = 1;
    h.id = id;
    list.push({ id, text: h.textContent, level: +h.tagName.charAt(1) });
  });
  return list;
}

function wrapTables(root) {
  root.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'table-wrap';
    t.replaceWith(w); w.appendChild(t);
  });
}

// Renders markdown into a fresh <div class="md">; returns { node, toc, meta }
function renderMd(src, opts) {
  opts = opts || {};
  const { meta, body } = stripFront(src);
  const node = document.createElement('div');
  node.className = 'md';
  if (hasLib('marked')) node.innerHTML = marked.parse(preprocess(body), { breaks: !!opts.breaks });
  else node.innerHTML = '<pre class="plain">' + esc(body) + '</pre>';
  transformCallouts(node);
  rewriteLinks(node);
  wrapTables(node);
  const first = node.firstElementChild;
  if (opts.dropTitle && first && first.tagName === 'H1') first.remove();
  return { node, toc: addIds(node), meta };
}

let mermaidSeq = 0;
async function runMermaid(root) {
  const blocks = [...root.querySelectorAll('pre.mermaid')];
  if (!blocks.length || !hasLib('mermaid')) return;
  mermaid.initialize({ startOnLoad: false, theme: theme() === 'dark' ? 'dark' : 'default', securityLevel: 'loose',
    fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' });
  for (const b of blocks) {
    const code = b.textContent;
    try {
      const { svg } = await mermaid.render('mmd' + (++mermaidSeq), code);
      b.innerHTML = svg;
      b.classList.add('rendered');
    } catch (e) {
      b.classList.remove('mermaid');
      b.innerHTML = '<code>' + esc(code) + '</code>';
      document.querySelectorAll('[id^="dmmd"]').forEach(n => n.remove());
    }
  }
}

function addCopyButtons(root) {
  root.querySelectorAll('.md pre:not(.mermaid)').forEach(pre => {
    pre.style.position = 'relative';
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = 'Copy';
    b.style.cssText = 'position:absolute;top:8px;right:8px';
    b.addEventListener('click', () => copy(pre.textContent, b));
    pre.appendChild(b);
  });
}
function copy(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {});
  else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) {} t.remove(); }
}

/* ---------- sidebar ---------- */
function renderNav(route) {
  let h = '<a class="item' + (route.kind === 'home' ? ' on' : '') + '" href="#/"><span class="num">&#8962;</span>Home</a>';
  h += '<a class="item' + (route.kind === 'extras' ? ' on' : '') + '" href="#/extras"><span class="num">+</span>Extras</a>';
  h += '<a class="item' + (route.kind === 'repo' ? ' on' : '') + '" href="#/repo"><span class="num">&#9776;</span>Browse the repo</a>';
  if (D.explorer) h += '<a class="item" href="' + D.explorer.href + '"><span class="num">&#8599;</span>' + esc(D.explorer.title) + '</a>';
  let part = null;
  D.chapters.forEach(c => {
    if (c.part !== part) { part = c.part; h += '<h5>' + esc(part) + '</h5>'; }
    h += '<a class="item' + (route.chapter === c.id ? ' on' : '') + '" href="#/' + c.id + '"><span class="num">' + c.num + '</span>' +
      esc(c.title) + '</a>';
  });
  $('#nav').innerHTML = h;
}

/* ---------- pages ---------- */
function setMain(contentNode, toc) {
  const main = $('#main');
  main.className = 'main' + (toc && toc.length > 2 ? '' : ' no-toc');
  main.innerHTML = '';
  const c = document.createElement('div'); c.className = 'content';
  c.appendChild(contentNode);
  main.appendChild(c);
  if (toc && toc.length > 2) {
    let items = toc.filter(t => t.level >= 2);
    if (items.length > 70) items = items.filter(t => t.level === 2);
    if (items.length > 2) {
      const t = document.createElement('aside'); t.className = 'toc';
      t.innerHTML = '<h4>On this page</h4>' + items.map(i =>
        '<a class="l' + i.level + '" href="#' + i.id + '" data-id="' + i.id + '">' + esc(i.text) + '</a>').join('');
      main.appendChild(t);
    } else main.classList.add('no-toc');
  }
  window.scrollTo(0, 0);
  setupSpy();
}

let spyHandler = null;
function setupSpy() {
  if (spyHandler) window.removeEventListener('scroll', spyHandler);
  const links = [...document.querySelectorAll('.toc a')];
  if (!links.length) { spyHandler = null; return; }
  const heads = links.map(a => document.getElementById(a.dataset.id)).filter(Boolean);
  spyHandler = () => {
    let cur = null;
    for (const h of heads) { if (h.getBoundingClientRect().top < 120) cur = h.id; else break; }
    links.forEach(a => a.classList.toggle('on', a.dataset.id === cur));
  };
  window.addEventListener('scroll', spyHandler, { passive: true });
  spyHandler();
}

function pageHome() {
  const root = document.createElement('div');
  let h = '<section class="hero"><h1>HLD · High Level Design</h1>' +
    '<p>Chapter-by-chapter revision notes on <i>Designing Data-Intensive Applications</i>: the big ideas behind reliable, scalable and maintainable data systems, ' +
    'with diagrams, for when there is no time to re-read the book.</p>' +
    '<p class="by">By <a href="https://www.subhajithait.com/" target="_blank" rel="noopener">subhajithait.com</a></p>' +
    '<div class="langs"><span class="pill">Storage</span><span class="pill">Replication</span><span class="pill">Transactions</span><span class="pill">Consensus</span><span class="pill">Batch &amp; Streams</span></div>' +
    '<div class="stats"><div><b>' + D.chapters.length + '</b>chapters</div><div><b>3</b>parts</div></div></section>';
  let part = null;
  D.chapters.forEach(c => {
    if (c.part !== part) {
      if (part !== null) h += '</div>';
      part = c.part; h += '<div class="section-h">' + esc(part) + '</div><div class="grid">';
    }
    h += '<a class="card cardlink" href="#/' + c.id + '"><div class="top"><span class="badge">' + c.num + '</span><h3>' + esc(c.title) + '</h3></div>' +
      '<p>' + esc(c.tagline) + '</p></a>';
  });
  h += '</div><div class="section-h">Also here</div><div class="grid">' +
    (D.explorer ? '<a class="card cardlink" href="' + D.explorer.href + '"><div class="top"><span class="badge">&#8599;</span><h3>' + esc(D.explorer.title) + '</h3></div><p>40 animated system design lessons: load balancing, caching, sharding, and full designs.</p></a>' : '') +
    '<a class="card cardlink" href="#/repo"><div class="top"><span class="badge">&#9776;</span><h3>Browse the repo</h3></div><p>Every folder and file in one tree.</p></a>' +
    '<a class="card cardlink" href="#/extras"><div class="top"><span class="badge">+</span><h3>Extras</h3></div><p>The repository README and the reference links behind these notes.</p></a></div>';
  root.innerHTML = h;
  setMain(root, null);
}

function pager(c) {
  const i = D.chapters.indexOf(c);
  const p = D.chapters[i - 1], n = D.chapters[i + 1];
  const d = document.createElement('div'); d.className = 'pager';
  d.innerHTML = (p ? '<a href="#/' + p.id + '"><small>&larr; Previous</small>' + esc(p.title) + '</a>' : '<span></span>') +
    (n ? '<a class="next" href="#/' + n.id + '"><small>Next &rarr;</small>' + esc(n.title) + '</a>' : '');
  return d;
}

async function pageChapter(c) {
  const box = document.createElement('div');
  box.innerHTML = '<div class="eyebrow">Chapter ' + c.num + ' · ' + esc(c.part) + '</div><h1 class="page-title">' + esc(c.title) + '</h1>' +
    '<p class="tagline">' + esc(c.tagline) + '</p>';
  const r = renderMd(c.notes, { dropTitle: true });
  box.appendChild(r.node);
  if (r.meta.tags.length) {
    const chips = document.createElement('div'); chips.className = 'chips'; chips.style.marginTop = '28px';
    chips.innerHTML = r.meta.tags.map(t => '<span class="chip">#' + esc(t) + '</span>').join('');
    box.appendChild(chips);
  }
  box.appendChild(pager(c));
  setMain(box, r.toc);
  addCopyButtons(box);
  await runMermaid(box);
}

function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }

async function pageExtras() {
  const box = document.createElement('div');
  box.innerHTML = '<div class="eyebrow">Repository README</div><h1 class="page-title">Extras</h1>' +
    '<p class="tagline">Reference links and everything else from the repository README.</p>';
  const r = renderMd(D.readme, { dropTitle: true, breaks: true });
  box.appendChild(r.node);
  setMain(box, r.toc);
  addCopyButtons(box);
}

function treeHtml(nodes, depth) {
  return nodes.map(n => {
    if (n.t === 'd') {
      const count = n.k.length;
      return '<details class="tdir"><summary><span class="tn">' + esc(n.n) + '/</span>' +
        '<span class="tc">' + count + ' item' + (count === 1 ? '' : 's') + '</span></summary>' +
        '<div class="tkids">' + treeHtml(n.k, depth + 1) + '</div></details>';
    }
    const href = n.r || (n.h ? encodeURI(n.h) : '');
    const ext = !n.r && n.h ? ' target="_blank" rel="noopener"' : '';
    return '<div class="tfile">' + (href ? '<a href="' + esc(href) + '"' + ext + '>' + esc(n.n) + '</a>' : '<span>' + esc(n.n) + '</span>') +
      '<span class="tc">' + fmtSize(n.s || 0) + '</span></div>';
  }).join('');
}

function pageRepo() {
  const box = document.createElement('div');
  box.innerHTML = '<div class="eyebrow">Repository</div><h1 class="page-title">Browse the repo</h1>' +
    '<p class="tagline">Every folder and file. Notes open in the viewer; other files open directly.</p>' +
    '<div class="tree">' + treeHtml(D.tree, 0) + '</div>';
  setMain(box, null);
}

/* ---------- router ---------- */
let routeSeq = 0;
function parse() {
  const h = decodeURI(location.hash.replace(/^#\/?/, ''));
  const parts = h.split('/').filter(Boolean);
  if (!parts.length) return { kind: 'home' };
  if (parts[0] === 'repo') return { kind: 'repo' };
  if (parts[0] === 'extras' || parts[0] === 'readme') return { kind: 'extras' };
  const c = byId[parts[0]];
  if (c) return { kind: 'chapter', chapter: c.id };
  return { kind: 'home' };
}

async function route(force) {
  const r = parse();
  const my = ++routeSeq; route.cur = my; route.token = my;
  closeNav();
  renderNav(r);
  if (r.kind === 'home') { document.title = TITLE; return pageHome(); }
  if (r.kind === 'repo') { document.title = 'Browse the repo · HLD'; return pageRepo(); }
  if (r.kind === 'extras') { document.title = 'Extras · HLD'; return pageExtras(); }
  const c = byId[r.chapter];
  document.title = 'Ch ' + c.num + ' ' + c.title + ' · HLD';
  return pageChapter(c);
}
window.addEventListener('hashchange', () => route());

// In-page anchors (#heading) must not trigger the hash router
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const h = a.getAttribute('href');
  if (h && h.charAt(0) === '#' && h.charAt(1) !== '/') {
    e.preventDefault();
    const t = document.getElementById(decodeURIComponent(h.slice(1)));
    if (t) t.scrollIntoView({ behavior: 'smooth' });
  }
});

/* ---------- nav drawer ---------- */
function closeNav() { document.body.classList.remove('nav-open'); }
$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.addEventListener('click', e => { if (document.body.classList.contains('nav-open') && !e.target.closest('.sidebar,#menuBtn')) closeNav(); });

/* ---------- search ---------- */
let index = null;
function buildIndex() {
  index = D.chapters.map(c => ({ t: 'Ch ' + c.num + ' · ' + c.title, s: c.part, r: '#/' + c.id, x: c.notes, w: 3 }));
  if (D.readme) index.push({ t: 'Extras', s: 'Repository README', r: '#/extras', x: D.readme, w: 1 });
  index.forEach(i => { i.lt = i.t.toLowerCase(); i.lx = i.x.toLowerCase(); });
}
function snippet(x, lx, q) {
  const p = lx.indexOf(q);
  if (p < 0) return '';
  const a = Math.max(0, p - 40), b = Math.min(x.length, p + q.length + 70);
  const raw = x.slice(a, b).replace(/\s+/g, ' ');
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
  return (a > 0 ? '…' : '') + esc(raw).replace(re, m => '<mark>' + m + '</mark>') + (b < x.length ? '…' : '');
}
function search(q) {
  q = q.trim().toLowerCase();
  const box = $('#results');
  if (q.length < 2) { box.classList.remove('open'); return; }
  if (!index) buildIndex();
  const hits = [];
  index.forEach(i => {
    let s = 0;
    if (i.lt.includes(q)) s += 20 * i.w;
    const p = i.lx.indexOf(q);
    if (p >= 0) { s += 4 * i.w; let n = 0, k = p; while (k >= 0 && n < 5) { n++; k = i.lx.indexOf(q, k + q.length); } s += n; }
    if (s) hits.push({ i, s });
  });
  hits.sort((a, b) => b.s - a.s);
  const top = hits.slice(0, 12);
  box.innerHTML = top.length ? top.map(h => '<a href="' + h.i.r + '"><div class="rt">' + esc(h.i.t) + '</div><div class="rs">' + esc(h.i.s) +
    '</div><div class="rx">' + snippet(h.i.x, h.i.lx, q) + '</div></a>').join('') : '<div class="none">No matches for “' + esc(q) + '”.</div>';
  box.classList.add('open');
}
const qi = $('#q');
let st = null;
qi.addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => search(qi.value), 120); });
qi.addEventListener('focus', () => { if (qi.value.trim().length >= 2) search(qi.value); });
qi.addEventListener('keydown', e => {
  const items = [...document.querySelectorAll('#results a')];
  let k = items.findIndex(a => a.classList.contains('sel'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    if (k >= 0) items[k].classList.remove('sel');
    k = e.key === 'ArrowDown' ? (k + 1) % items.length : (k <= 0 ? items.length - 1 : k - 1);
    items[k].classList.add('sel'); items[k].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    const t = items[k >= 0 ? k : 0];
    if (t) { location.hash = t.getAttribute('href'); $('#results').classList.remove('open'); qi.blur(); }
  } else if (e.key === 'Escape') { $('#results').classList.remove('open'); qi.blur(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').classList.remove('open'); });
$('#results').addEventListener('click', () => $('#results').classList.remove('open'));
document.addEventListener('keydown', e => {
  if ((e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
    e.preventDefault(); qi.focus(); qi.select();
  }
});

route();
})();
</script>
