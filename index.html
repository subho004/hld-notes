<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLD · High Level Design notes</title>
<meta name="description" content="HLD: High Level Design revision notes from Designing Data-Intensive Applications, chapter by chapter, with diagrams.">
<meta name="author" content="subhajithait.com">
<meta name="color-scheme" content="light dark">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='21' font-family='Arial,Helvetica,sans-serif' font-size='11.5' font-weight='800' fill='white' text-anchor='middle'%3EHLD%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfbfd; --panel:#ffffff; --panel-2:#f3f4f8; --text:#1c2030; --muted:#5d6479;
  --line:#e3e6ee; --accent:#4f46e5; --accent-2:#0ea5a4; --accent-soft:#eceafd;
  --code-bg:#f6f7fb; --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 20px rgba(20,24,40,.05);
  --tok-kw:#a626a4; --tok-str:#2f7d32; --tok-num:#b45309; --tok-com:#7b8394; --tok-fn:#1d4ed8; --tok-ty:#0f766e;
  --sidebar-w:296px; --top-h:56px;
}
:root[data-theme="dark"]{
  --bg:#0e1118; --panel:#151a24; --panel-2:#1b2130; --text:#e6e9f2; --muted:#98a0b6;
  --line:#262d3d; --accent:#8b8cf8; --accent-2:#2dd4bf; --accent-soft:#232345;
  --code-bg:#0b0f17; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  --tok-kw:#c792ea; --tok-str:#8bd49c; --tok-num:#f5a97f; --tok-com:#6c7690; --tok-fn:#82aaff; --tok-ty:#5eead4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--top-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
button{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top-h);z-index:40;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.logo{height:28px;padding:0 8px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.04em}
.brand small{font-weight:500;color:var(--muted);margin-left:2px}
.spacer{flex:1}
.author{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap}
.author span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.author:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;height:34px;min-width:34px;padding:0 10px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{background:var(--panel-2)}
#menuBtn{display:none}
.search{position:relative;width:min(420px,38vw)}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  border-radius:10px;padding:0 44px 0 34px;font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search .ico{position:absolute;left:11px;top:9px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:9px;top:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;padding:0 6px;background:var(--panel)}
.results{position:absolute;top:42px;left:0;right:0;max-height:70vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;z-index:60}
.results.open{display:block}
.results a{display:block;padding:10px 14px;color:var(--text);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--accent-soft);text-decoration:none}
.results .rt{font-weight:600;font-size:14px}
.results .rs{font-size:12px;color:var(--muted)}
.results .rx{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.results .none{padding:14px;color:var(--muted);font-size:14px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);padding-top:var(--top-h);min-height:100vh}
.sidebar{position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));overflow:auto;padding:18px 12px 40px;
  border-right:1px solid var(--line);background:var(--panel)}
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:36px;padding:34px 36px 80px;max-width:1240px;width:100%;margin:0 auto}
.main.no-toc{grid-template-columns:minmax(0,1fr);max-width:980px}
.content{min-width:0}
.toc{position:sticky;top:calc(var(--top-h) + 24px);align-self:start;max-height:calc(100vh - var(--top-h) - 48px);overflow:auto;
  font-size:13px;border-left:1px solid var(--line);padding-left:14px}
.toc h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.toc a{display:block;color:var(--muted);padding:3px 0;line-height:1.35}
.toc a.l3{padding-left:12px}
.toc a:hover,.toc a.on{color:var(--accent);text-decoration:none}

/* ---------- sidebar ---------- */
.nav h5{margin:18px 10px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav a.item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;color:var(--text);font-size:14px;line-height:1.35}
.nav a.item:hover{background:var(--panel-2);text-decoration:none}
.nav a.item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .num{flex:none;width:22px;height:22px;border-radius:6px;background:var(--panel-2);color:var(--muted);
  font-size:11px;font-weight:700;display:grid;place-items:center}
.nav a.item.on .num{background:var(--accent);color:#fff}
.nav .sub{margin:2px 0 6px 31px;border-left:1px solid var(--line);padding-left:6px}
.nav .sub a{display:block;padding:3px 8px;border-radius:6px;font-size:13px;color:var(--muted)}
.nav .sub a:hover{color:var(--text);text-decoration:none;background:var(--panel-2)}
.nav .sub a.on{color:var(--accent);font-weight:600}
.nav .ext{margin-left:auto;color:var(--muted);font-size:12px}

/* ---------- home ---------- */
.hero{padding:30px 32px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  background:radial-gradient(900px 260px at 100% 0%,var(--accent-soft),transparent 70%),var(--panel)}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;color:var(--muted);max-width:62ch;font-size:17px}
.hero p.by{margin-top:10px;font-size:14px}
.langs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text)}
.stats{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--text);letter-spacing:-.02em}
.section-h{margin:34px 0 14px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card .top{display:flex;align-items:center;gap:10px}
.card .badge{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:800;
  display:grid;place-items:center;font-size:14px;flex:none}
.card h3{margin:0;font-size:16px;line-height:1.25}
.card .pat{font-size:12.5px;color:var(--accent-2);font-weight:600}
.card p{margin:2px 0 6px;color:var(--muted);font-size:13.5px;line-height:1.5;flex:1}
.card .links{display:flex;gap:6px;flex-wrap:wrap}
.card .links a{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text)}
.card .links a:hover{background:var(--accent-soft);color:var(--accent);text-decoration:none;border-color:transparent}
.card.explorer{border-style:dashed}
a.cardlink{color:inherit}
a.cardlink:hover{text-decoration:none}

/* ---------- chapter header + tabs ---------- */
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.page-title{margin:4px 0 6px;font-size:clamp(26px,3.6vw,34px);line-height:1.2;letter-spacing:-.02em}
.tagline{color:var(--muted);margin:0 0 14px;max-width:70ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow:auto}
.tabs a{padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;font-size:14.5px;white-space:nowrap}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{flex:1;max-width:48%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--panel)}
.pager a:hover{text-decoration:none;border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .next{text-align:right;margin-left:auto}

/* ---------- code viewer ---------- */
.codebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg a{padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg a.on{background:var(--accent);color:#fff}
.seg a:hover{text-decoration:none}
.seg a.off{opacity:.4;pointer-events:none}
.runhint{font-size:12.5px;color:var(--muted)}
.runhint code{background:var(--code-bg);border:1px solid var(--line);padding:1px 7px;border-radius:6px;color:var(--text)}
.codegrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.files{position:sticky;top:calc(var(--top-h) + 16px);max-height:calc(100vh - var(--top-h) - 40px);overflow:auto;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:6px}
.files a{display:block;padding:4px 9px;border-radius:7px;font-size:12.8px;color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.files a:hover{background:var(--panel-2);text-decoration:none}
.files a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.viewer{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.viewer .vh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.viewer .vh b{color:var(--text);font-family:ui-monospace,Menlo,monospace;font-weight:600;word-break:break-all}
.viewer pre{margin:0;padding:14px 16px;overflow:auto;font-size:13.2px;line-height:1.55;counter-reset:ln}
.copy{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--text)}

/* ---------- markdown ---------- */
.md h1{font-size:30px;margin:0 0 14px;line-height:1.2;letter-spacing:-.02em}
.md h2{font-size:23px;margin:2.1em 0 .55em;padding-bottom:.3em;border-bottom:1px solid var(--line);letter-spacing:-.01em;line-height:1.25}
.md h3{font-size:18px;margin:1.7em 0 .4em}
.md h4{font-size:16px;margin:1.4em 0 .3em}
.md p{margin:.8em 0}
.md ul,.md ol{padding-left:1.4em}
.md li{margin:.25em 0}
.md li>p{margin:.3em 0}
.md blockquote{margin:1em 0;padding:.1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md img{max-width:100%}
.md :not(pre)>code{background:var(--code-bg);border:1px solid var(--line);padding:.08em .38em;border-radius:6px;font-size:.88em}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;font-size:13.2px;line-height:1.55;margin:1em 0}
.md pre code{background:none;border:0;padding:0;font-size:inherit}
.md .table-wrap{overflow:auto;margin:1em 0;border:1px solid var(--line);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14.5px}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{background:var(--panel-2);font-weight:700;font-size:13px}
.md tr:last-child td{border-bottom:0}
.md pre.mermaid{background:var(--panel);text-align:center;display:flex;justify-content:center;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.md pre.mermaid svg{max-width:100%;height:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.plain{white-space:pre-wrap;font:13.5px/1.6 ui-monospace,Menlo,monospace;background:var(--code-bg);border:1px solid var(--line);
  border-radius:12px;padding:16px;overflow:auto}
.loading{color:var(--muted);padding:40px 0}

/* callouts */
.callout{--c:var(--accent);margin:1.2em 0;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));
  background:color-mix(in srgb,var(--c) 7%,var(--panel));border-radius:12px;overflow:hidden}
.callout-title{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:700;font-size:14.5px;color:var(--c);cursor:default;list-style:none}
.callout-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
summary.callout-title{cursor:pointer}
summary.callout-title::-webkit-details-marker{display:none}
.callout-body{padding:0 14px 8px}
.callout-body>:first-child{margin-top:.2em}
.callout-body>:last-child{margin-bottom:.4em}
.callout .callout{margin:.6em 0}
.callout-abstract,.callout-summary,.callout-tldr{--c:#0ea5a4}
.callout-info,.callout-note{--c:#3b82f6}
.callout-tip,.callout-hint,.callout-success,.callout-check,.callout-done{--c:#16a34a}
.callout-warning,.callout-caution,.callout-attention{--c:#d97706}
.callout-danger,.callout-error,.callout-failure,.callout-bug{--c:#dc2626}
.callout-question,.callout-help,.callout-faq{--c:#8b5cf6}
.callout-example{--c:#7c3aed}
.callout-quote,.callout-cite{--c:#64748b}

.hljs{color:var(--text)}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-meta .hljs-keyword{color:var(--tok-kw)}
.hljs-string,.hljs-regexp,.hljs-template-variable{color:var(--tok-str)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--tok-num)}
.hljs-comment,.hljs-quote,.hljs-doctag{color:var(--tok-com);font-style:italic}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--tok-fn)}
.hljs-type,.hljs-built_in,.hljs-title.class_,.hljs-class .hljs-title{color:var(--tok-ty)}
.hljs-meta,.hljs-attr,.hljs-attribute,.hljs-variable{color:var(--tok-num)}


.tree{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 10px;font-size:14px}
.tdir>summary{cursor:pointer;padding:4px 6px;border-radius:7px;display:flex;gap:10px;align-items:baseline;list-style:none}
.tdir>summary::-webkit-details-marker{display:none}
.tdir>summary::before{content:"\25B8";color:var(--muted);font-size:11px;width:10px;transition:transform .1s}
.tdir[open]>summary::before{transform:rotate(90deg)}
.tdir>summary:hover{background:var(--panel-2)}
.tn{font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.tc{color:var(--muted);font-size:12px;margin-left:auto}
.tkids{margin-left:15px;border-left:1px solid var(--line);padding-left:8px}
.tfile{display:flex;gap:10px;align-items:baseline;padding:3px 6px 3px 20px;border-radius:7px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tfile:hover{background:var(--panel-2)}
.tnote{padding:3px 6px 3px 20px;color:var(--muted);font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:640px){.author{display:none}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:35;top:var(--top-h);left:0;bottom:0;width:min(86vw,320px);height:auto;transform:translateX(-102%);
    transition:transform .18s;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:var(--top-h) 0 0 0;background:rgba(0,0,0,.35);z-index:30}
  #menuBtn{display:inline-flex}
  .main{padding:22px 16px 60px}
  .search{width:auto;flex:1}
  .brand small{display:none}
  .author span{display:none}
  .author{padding:5px 9px;font-size:12px}
  .codegrid{grid-template-columns:minmax(0,1fr)}
  .files{position:static;max-height:190px}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script id="site-data" type="application/json">{"chapters":[{"id":"chapter_01_reliable-scalable-maintainable","num":1,"title":"Reliable, Scalable, and Maintainable Applications","part":"Part I · Foundations of Data Systems","tagline":"What good looks like: tolerate faults, cope with load, and stay easy to operate and change.","notes":"---\ntags:\n  - ddia/chapter-01\n  - system-design/fundamentals\ndate: 2026-11-21\n---\n\n# Chapter 1: Reliable, Scalable, and Maintainable Applications\n\nReader: a backend engineer who knows databases basics and wants a fast refresher.\n\n**Summary.** Modern applications are *data-intensive* (limited by data volume, complexity and rate of change, not CPU). They are built by stitching together standard data systems (databases, caches, search indexes, queues, batch jobs). Whoever combines them becomes a data-system designer. The chapter fixes the vocabulary for the whole book around three concerns: **reliability** (keep working correctly despite faults), **scalability** (cope with growth in load) and **maintainability** (stay workable for many people over time).\n\n## 1. Thinking about data systems\n\n- Data-intensive vs compute-intensive: the hard part is data, not raw CPU.\n- Typical building blocks: databases, caches, search indexes, stream processing (async messaging), batch processing.\n- Category boundaries blur: Redis is a datastore also used as a queue; Kafka is a queue with database-like durability.\n- One tool rarely meets all needs, so application code stitches tools together and must keep caches and indexes in sync with the primary database.\n- The composite service hides this behind an API and may promise guarantees (for example \"cache is correctly invalidated on writes\"). Open design questions: correctness under internal failure, performance when parts are degraded, scaling, and API shape.\n- Other forces: team skills, legacy systems, delivery time, risk tolerance, regulation.\n\n```mermaid\nflowchart LR\n    U((\"Client\")) --> API[\"API\"]\n    API --> App[\"Application code\"]\n    App -->|\"read, check first\"| Cache[(\"In-memory cache\")]\n    App -->|\"cache misses and writes\"| DB[(\"Primary database\")]\n    App -->|\"search requests\"| Idx[(\"Full-text index\")]\n    App -->|\"async tasks\"| MQ[\"Message queue\"]\n    DB -->|\"capture changes\"| Sync[\"Application code\"]\n    Sync -->|\"update index\"| Idx\n    Sync -->|\"invalidate or update\"| Cache\n    MQ --> Worker[\"Application code\"] -->|\"e.g. send email\"| Out[\"Outside world\"]\n```\n\nNotice that the application code, not any single tool, owns consistency between the cache, the index and the database (Figure 1-1).\n\n## 2. Reliability\n\n**Definition.** Continue to work *correctly* (right function, adequate performance, tolerates user mistakes, prevents unauthorized access) even when things go wrong.\n\n| Term | Meaning |\n|---|---|\n| Fault | One component deviates from its spec |\n| Failure | The system as a whole stops providing the service |\n| Fault-tolerant / resilient | Copes with *certain types* of faults (never all of them) |\n\nGoal: stop faults from becoming failures. You cannot reduce fault probability to zero.\n\n- **Chaos engineering**: deliberately inducing faults (Netflix Chaos Monkey, killing random processes) exercises the error-handling code, since many critical bugs come from poor error handling.\n- Prevention beats cure only where no cure exists, e.g. security breaches. The book mostly covers curable faults.\n\n### Hardware faults\n\n- Disks: MTTF about 10 to 50 years, so a 10,000-disk cluster loses about one disk per day.\n- Classic answer: hardware redundancy (RAID, dual power supplies, hot-swap CPUs, backup generators). Good for years of uptime on one machine but not complete.\n- Trend: more machines raise the fault rate, and clouds (e.g. AWS) prioritize elasticity over single-machine reliability, so VMs can vanish without warning. Hence **software fault tolerance** that survives whole-machine loss.\n- Bonus: **rolling upgrades**, patching one node at a time with no system downtime.\n\n### Software errors\n\nSystematic, so **correlated across nodes** and more damaging than independent hardware faults. Examples:\n\n- A bug crashing every server on a particular bad input (leap second, 30 June 2012, Linux kernel bug hung many apps).\n- A runaway process eating shared CPU, memory, disk or bandwidth.\n- A dependency that slows, stalls or returns corrupt data.\n- Cascading failures.\n\nBugs lie dormant until an environment assumption stops holding. No quick fix; helpers: think through assumptions, thorough testing, process isolation, let processes crash and restart, production monitoring, and runtime self-checks (e.g. messages in equals messages out, alert on mismatch).\n\n### Human errors\n\nAn operator-configuration study found config errors were the leading cause of outages, while hardware faults were only 10-25%. Mitigations, combined:\n\n1. Well-designed abstractions, APIs and admin UIs (but not so restrictive that people work around them).\n2. Sandbox environments with real data, decoupled from production.\n3. Testing at all levels (unit to integration to manual), automation for corner cases.\n4. Fast recovery: quick config rollback, gradual code rollout, tools to recompute data.\n5. Monitoring/telemetry (performance metrics, error rates).\n6. Good management and training.\n\n**How important?** Even \"boring\" apps matter: lost revenue, legal risk, a parent's lost family photos. Sacrificing reliability (prototypes, razor-thin margins) is acceptable only consciously.\n\n## 3. Scalability\n\nScalability is the ability to cope with increased load. It is not a one-dimensional label: \"X is scalable\" is meaningless; ask \"if load grows in this way, what are our options?\"\n\n### Describing load\n\nUse **load parameters**: requests per second, read/write ratio, concurrent users, cache hit rate, and so on. Pick the one your bottleneck depends on (average case or extremes).\n\n**Twitter example (Nov 2012 data).**\n\n| Operation | Rate |\n|---|---|\n| Post tweet | 4.6k req/s average, over 12k/s peak |\n| Home timeline read | 300k req/s |\n\nThe challenge is **fan-out** (requests triggered per incoming request): each user follows many and is followed by many.\n\n| Approach | Write | Read | Verdict |\n|---|---|---|---|\n| 1. Global tweet table, join at read time (`follows` JOIN `tweets`) | cheap insert | expensive query: look up followees, merge by time | First version; could not keep up with timeline reads |\n| 2. Per-user home-timeline cache (\"mailbox\"), fan-out on write | one tweet written to each follower's cache | cheap, precomputed | Better, since reads are about 2 orders of magnitude more frequent than writes |\n\nCost of approach 2: average about 75 followers, so 4.6k tweets/s become **345k cache writes/s**. Some users have over 30 million followers, so one tweet can mean 30M+ writes; Twitter aims to deliver within 5 seconds. The **distribution of followers per user** is therefore the key load parameter.\n\nFinal twist: a **hybrid**. Most users fan out on write; celebrities are excepted and their tweets are fetched at read time and merged in (like approach 1).\n\n```mermaid\nflowchart TD\n    P[\"User posts tweet\"] --> Q{\"Many followers?\"}\n    Q -->|\"No, most users\"| F[\"Fan-out on write: insert into each follower timeline cache\"]\n    Q -->|\"Yes, celebrity\"| S[\"Store only in tweets table\"]\n    R[\"Follower reads home timeline\"] --> C[\"Read precomputed cache\"]\n    R --> M[\"Fetch followed celebrities tweets and merge\"]\n    F --> C\n    S --> M\n```\n\n### Describing performance\n\nTwo questions: (a) raise a load parameter, resources fixed, what happens to performance? (b) how many more resources to keep performance constant?\n\n- Batch systems (Hadoop): **throughput** (records per second, or job time). Real runtime exceeds size/throughput due to skew and waiting for the slowest task.\n- Online systems: **response time**.\n\n| Term | Meaning |\n|---|---|\n| Response time | What the client sees: service time + network delays + queueing delays |\n| Latency | Time a request waits to be handled (is \"latent\") |\n| Service time | Actual processing time |\n\nResponse time is a **distribution**, not a number: outliers come from context switches, packet loss and TCP retransmit, GC pauses, page faults, even rack vibration.\n\n**Mean vs percentiles.** The mean hides how many users suffered. Sort the times:\n\n| Metric | Meaning |\n|---|---|\n| p50 (median) | Half faster, half slower; \"typical\" wait for one request |\n| p95, p99, p999 | Threshold below which 95%, 99%, 99.9% of requests fall |\n| Tail latency | High percentiles; they drive user experience |\n\n- If p50 is 200 ms, a user making many requests in a session is much more than 50% likely to hit at least one slower one.\n- Amazon sets internal targets at p99.9 (the slowest customers are often the most valuable, with the most data). A 100 ms slowdown cuts sales by 1%; another report: 1 s slowdown cuts a satisfaction metric by 16%. p99.99 was judged too costly for the benefit.\n- **SLO/SLA**: contracts on performance and availability, e.g. median under 200 ms and p99 under 1 s, up 99.9% of the time, with refunds if violated.\n- **Head-of-line blocking**: a few slow requests hold up fast ones queued behind them. Measure response time **on the client side**. Load-test clients must send requests independently of responses, otherwise queues are artificially short.\n- **Tail latency amplification**: one end-user request fanning out to several backends waits for the slowest call, so slow user requests are a larger share than slow backend calls (Figure 1-5 example: backends at 76 to 143 ms plus one at 487 ms makes the whole request slow).\n- Computing percentiles: rolling window (e.g. last 10 minutes), naive sorting each minute, or approximate algorithms (forward decay, t-digest, HdrHistogram). **Never average percentiles**; merge histograms instead.\n\n### Approaches for coping with load\n\n- Each 10x of load probably needs an architecture rethink.\n- **Scaling up** (vertical, bigger machine) vs **scaling out** (horizontal, shared-nothing). A single machine is simpler but high-end ones get expensive; a pragmatic mix is usual.\n- **Elastic** (auto-add resources) suits unpredictable load; manual scaling is simpler with fewer surprises.\n- Stateless services distribute easily; stateful data systems get much more complex. Old wisdom: keep the database on one node until cost or availability forces distribution. Better tooling may change this.\n- No \"magic scaling sauce\": design depends on read volume, write volume, data size, complexity, response-time needs and access patterns. Example: 100,000 req/s of 1 kB differs greatly from 3 req/min of 2 GB, though throughput is equal.\n- Scaling assumes which operations are common vs rare; wrong guesses are wasted effort. For early startups, product iteration beats hypothetical scale.\n\n## 4. Maintainability\n\nMost cost of software is ongoing maintenance (bugs, operations, failures, new platforms, new use cases, tech debt, features). Design to avoid becoming a painful legacy system.\n\n| Principle | Goal |\n|---|---|\n| Operability | Make it easy for operations to keep it running |\n| Simplicity | Make it easy for new engineers to understand (not UI simplicity) |\n| Evolvability | Make change easy (aka extensibility, modifiability, plasticity) |\n\n### Operability\n\n\"Good operations can often work around bad software, but good software cannot run reliably with bad operations.\" Ops duties include monitoring and restoring service, root-causing, patching, capacity planning, deployment and config tooling, migrations, security, predictable processes and preserving knowledge.\n\nA data system helps by: exposing runtime visibility and monitoring; supporting automation and standard tools; not depending on single machines; clear documentation and an \"if I do X, Y happens\" model; good defaults with override freedom; self-healing plus manual control; predictable behaviour.\n\n### Simplicity\n\n- Complexity symptoms: state-space explosion, tight coupling, tangled dependencies, inconsistent naming, performance hacks, special cases. Result: \"big ball of mud\", overruns, more bugs.\n- Simpler does not mean fewer features; remove **accidental complexity** (arises from implementation, not the problem; Moseley and Marks).\n- Best tool: **abstraction**. High-level languages hide machine code; SQL hides on-disk structures, concurrency and crash inconsistencies. Good abstractions are hard to find, especially for distributed systems.\n\n### Evolvability\n\nRequirements keep changing (new facts, use cases, priorities, platforms, regulation, growth).\n\n- Agile, TDD and refactoring work at code-file scale.\n- This book looks for agility at the whole-data-system scale, e.g. \"refactoring\" Twitter from approach 1 to approach 2. \n- Evolvability is tied to simplicity and good abstractions.\n\n## 5. Summary\n\n- **Functional requirements**: what it does. **Nonfunctional**: security, reliability, compliance, scalability, compatibility, maintainability.\n- Reliability: hardware faults are random and uncorrelated; software bugs systematic; humans err.\n- Scalability: quantify load and performance (load parameters, percentiles).\n- Maintainability: operability, simplicity, evolvability.\n- No easy fix, but recurring patterns follow in later chapters.\n\n## Quick recall\n\n- Data-intensive: bottleneck is data volume, complexity, change rate.\n- Fault is a component deviating; failure is the system stopping. Tolerate faults to prevent failures.\n- Hardware faults are independent; software faults are correlated and dangerous; human config errors cause most outages.\n- Describe load with load parameters; for Twitter it is the follower distribution (fan-out).\n- Twitter: join on read, then fan-out on write (345k writes/s), then hybrid for celebrities.\n- Use percentiles (p50, p95, p99, p999), not the mean; tail latency matters and amplifies across fan-out calls.\n- Measure on the client; never average percentiles.\n- Scale up vs out vs elastic; no one-size-fits-all architecture.\n- Maintainability = operability + simplicity + evolvability; abstraction removes accidental complexity.\n"},{"id":"chapter_02_data-models-query-languages","num":2,"title":"Data Models and Query Languages","part":"Part I · Foundations of Data Systems","tagline":"Relational, document and graph models, and the query languages that go with them.","notes":"---\ntags:\n  - ddia/chapter-02\n  - databases/data-models\ndate: 2026-11-21\n---\n\n# Chapter 2: Data Models and Query Languages\n\nReader: a backend engineer who has used SQL and knows JSON, wanting a quick comparison of relational, document and graph models.\n\n**Summary.** The data model shapes both the software and how you think about the problem. This chapter compares the **relational**, **document** and **graph** models and the query languages that go with them (SQL, MapReduce, MongoDB aggregation pipeline, Cypher, SPARQL, Datalog). Documents suit self-contained, tree-shaped data with few cross-references; graphs suit data where anything may relate to anything; relational sits in the middle, with strong joins. Declarative query languages beat imperative access because the optimizer owns the \"how\".\n\n## 1. Why data models matter\n\nApplications are layers of models, each hiding the layer below:\n\n1. Real world to application objects and APIs.\n2. Objects to a general-purpose model (JSON/XML, relational tables, graph). **This chapter.**\n3. Database engineers map that model to bytes in memory, disk, network (Chapter 3).\n4. Hardware maps bytes to electrical signals and so on.\n\nEvery data model embodies assumptions: some operations are easy or fast, others awkward or unsupported. Choose one that fits the application.\n\n## 2. Relational vs document model\n\n### Background\n\n- Relational model (Codd, 1970): data in *relations* (tables) of unordered *tuples* (rows). Originated in business data processing (transactions, batch jobs such as invoicing and payroll) and dominated for 25-30 years, beating the network and hierarchical models, object databases and XML databases.\n- It generalized far beyond its origins: most of the web still runs on it.\n\n### The birth of NoSQL\n\n\"NoSQL\" began as a 2009 meetup hashtag, later read as \"Not Only SQL\". Drivers:\n\n- Scalability beyond what relational easily achieves (huge data, very high write throughput).\n- Preference for free, open source software.\n- Specialized query operations the relational model supports poorly.\n- Frustration with rigid schemas; wish for a more dynamic model.\n\nThe likely future is **polyglot persistence**: relational alongside several nonrelational stores.\n\n### The object-relational mismatch\n\nApplication code is object-oriented; tables/rows/columns need an awkward translation layer (**impedance mismatch**). ORMs (ActiveRecord, Hibernate) cut boilerplate but do not hide the difference.\n\nExample: a LinkedIn-style résumé (Figure 2-1, Example 2-1). `first_name` appears once per user (a column), but positions, education and contact info are one-to-many. Options:\n\n| Option | Notes |\n|---|---|\n| Normalized: separate tables with `user_id` foreign keys | Traditional (pre SQL:1999) |\n| Structured types, XML or JSON column inside the row | Supported to varying degrees by Oracle, DB2, SQL Server, PostgreSQL, MySQL; can query and index inside |\n| JSON/XML in a text column | App interprets; DB cannot query inside |\n\nA JSON document has better **locality**: one query fetches the whole profile, versus several queries or a messy multi-way join. The one-to-many relationships form a **tree** that JSON makes explicit (Figure 2-2).\n\n### Many-to-one and many-to-many\n\nWhy store `region_id` / `industry_id` instead of strings?\n\n- Consistent spelling, no ambiguity, easy updates (name stored once), localization, better search (Seattle is in Washington).\n- IDs have no human meaning so never need to change; duplicating human-meaningful text means write overhead and inconsistency risk. Removing that duplication is **normalization** (rule of thumb: duplicated values that could live in one place means not normalized).\n\nProblem: many-to-one needs joins, which document databases handle weakly (at the time: RethinkDB supports joins, MongoDB not, CouchDB only in predeclared views). Joins then move into application code (several queries). Data also becomes more interconnected as features are added:\n\n- Organizations and schools become entities with their own pages.\n- Recommendations reference the author's profile (so photo updates propagate).\n\nThese need many-to-many references (Figure 2-4).\n\n### Are document databases repeating history?\n\nIBM **IMS** (1968, Apollo stock-keeping) used the **hierarchical model**: a tree of nested records, like JSON. Good for one-to-many, poor for many-to-many, no joins, so developers denormalized or resolved references by hand. Two answers competed through the 1970s:\n\n| Aspect | Network model (CODASYL) | Relational model |\n|---|---|---|\n| Structure | Records can have multiple parents; links are pointer-like | Plain tables of rows |\n| Access | Follow an **access path** from a root record, moving a cursor | Query any row by condition or key |\n| Choosing the path | Programmer, by hand, by imperative code | **Query optimizer**, automatically |\n| Schema change | Painful, rewrite query code | Add an index, queries unchanged |\n\nThe key relational insight: build the optimizer once and every application benefits. Today, document databases revert to the hierarchical idea for nested one-to-many data, but for many-to-one and many-to-many they work like relational ones: a *document reference* (like a foreign key) resolved at read time with a join or follow-up query. They have not followed CODASYL.\n\n### Relational vs document today\n\n| Consideration | Document | Relational |\n|---|---|---|\n| Schema | Flexible, schema-on-read | Explicit, schema-on-write |\n| Locality | Whole document in one place | Multiple lookups across tables |\n| Fit to app objects | Close for tree-like data | Needs shredding into tables |\n| Joins, many-to-one, many-to-many | Weak, emulated in app | Strong |\n\n- Use documents when data is a tree loaded as a whole. Limits: you cannot reference a nested item directly (\"second item in positions of user 251\"); deep nesting is awkward.\n- If many-to-many is needed, denormalizing shifts consistency work to the app, and emulated joins are slower. For highly interconnected data: documents awkward, relational acceptable, graph most natural.\n- **Schemaless is misleading**: there is an implicit schema enforced by reading code. Better terms: **schema-on-read** (like dynamic typing) vs **schema-on-write** (like static typing).\n- Changing format example (full name to first and last): document DB writes new fields and handles old docs on read (`if user.name and not user.first_name ...`); relational runs `ALTER TABLE ... ADD COLUMN` plus an `UPDATE`. `ALTER TABLE` is usually milliseconds; MySQL copies the whole table (minutes to hours on big tables). `UPDATE` on a big table is slow anywhere, so a NULL default filled at read time is the alternative.\n- Schema-on-read wins for heterogeneous data (many object types, or structure set by external systems). Schemas win when all records share a structure.\n- **Locality**: documents are stored as one continuous string (JSON, XML, BSON). It helps only when you need large parts at once; the whole document is loaded and generally rewritten on updates, so keep documents small and avoid growing writes. Locality is not exclusive to documents: Spanner (interleaved tables), Oracle (multi-table index cluster tables), Bigtable column families (Cassandra, HBase).\n\n### Convergence\n\nRelational systems added XML (mid-2000s) and JSON (PostgreSQL 9.3, MySQL 5.7, DB2 10.5) support; RethinkDB has joins and some MongoDB drivers resolve references client-side (slower, extra round trips). The models are converging and a hybrid is a good future route.\n\n## 3. Query languages\n\n### Declarative vs imperative\n\n```text\nImperative:   for each animal -> if family == \"Sharks\" -> push\nRelational:   sharks = sigma[family = \"Sharks\"](animals)\nSQL:          SELECT * FROM animals WHERE family = 'Sharks';\n```\n\n| | Imperative | Declarative (SQL) |\n|---|---|---|\n| You specify | Steps and order | The pattern of the result |\n| Who picks the algorithm | You | Query optimizer (indexes, join methods, order) |\n| Engine freedom | Little: it cannot know if you rely on ordering | Can reorganize storage, add optimizations without breaking queries |\n| Parallelism | Hard (ordered instructions) | Natural, since only the result is specified |\n\nIMS and CODASYL used imperative APIs (COBOL loops over records).\n\n### Declarative queries on the web\n\nCSS `li.selected > p { background-color: blue; }` (or XSL/XPath `li[@class='selected']/p`) states the pattern. The imperative JavaScript DOM version is long and has real problems: the blue is not removed when the class changes (CSS removes it automatically), and adopting a faster API means rewriting the code, whereas browser vendors can speed up CSS without breaking anything. Same lesson as SQL.\n\n### MapReduce querying\n\nA model for bulk processing across many machines (Google), partly supported in MongoDB and CouchDB for read-only queries. It sits **between declarative and imperative**: logic is code snippets (`map` emits key-value pairs, `reduce` combines values per key) called by the framework. Both must be **pure functions** (no extra queries, no side effects) so the DB can run them anywhere, in any order, and rerun on failure.\n\nBook example, sharks per month:\n\n```mermaid\nflowchart LR\n    D1[\"doc: 1995-12-25, Sharks, 3\"] --> M[\"map(): emit year-month, numAnimals\"]\n    D2[\"doc: 1995-12-12, Sharks, 4\"] --> M\n    M --> E1[\"emit 1995-12 , 3\"]\n    M --> E2[\"emit 1995-12 , 4\"]\n    E1 --> R[\"reduce(1995-12, [3,4])\"]\n    E2 --> R\n    R --> O[\"7 -> monthlySharkReport\"]\n```\n\nSame query in PostgreSQL: `SELECT date_trunc('month', observation_timestamp) AS observation_month, sum(num_animals) FROM observations WHERE family = 'Sharks' GROUP BY observation_month;`.\n\nTwo coordinated JS functions are harder than one query and give the optimizer less to work with, so MongoDB 2.2 added the declarative **aggregation pipeline** (`$match`, `$group`, ...), roughly a JSON-syntax subset of SQL. Moral: NoSQL may reinvent SQL in disguise. SQL itself is not limited to one machine, and MapReduce has no monopoly on distributed queries.\n\n## 4. Graph-like data models\n\nUse when many-to-many relationships are common.\n\nA graph has **vertices** (nodes, entities) and **edges** (relationships). \nExamples: social graphs, web graph (PageRank), road/rail networks (shortest path).\n \nGraphs can be heterogeneous: Facebook keeps one graph with people, locations, events, checkins and comments as vertices; friendship, attendance, etc. as edges.\n\nRunning example (Figure 2-5): Lucy (born in Idaho) and Alain (born in Beaune, France) are married and live in London. Location hierarchies differ by country (US states within country within continent; France has département and région), and granularity varies (residence as city, birthplace as state). This is hard to model relationally.\n\nTwo related models: **property graph** (Neo4j, Titan, InfiniteGraph) and **triple-store** (Datomic, AllegroGraph). Declarative languages: Cypher, SPARQL, Datalog. Imperative: Gremlin, plus processing frameworks like Pregel.\n\n### Property graphs\n\n| Vertex has | Edge has |\n|---|---|\n| Unique ID | Unique ID |\n| Outgoing and incoming edges | Tail vertex (start) and head vertex (end) |\n| Properties (key-value) | Label (relationship type) and properties |\n\nIt can be stored as two relational tables (`vertices`, `edges`, with JSON properties and indexes on `tail_vertex` and `head_vertex`).\n\nKey traits: no schema limits which vertices connect; efficient traversal in both directions; labels hold different relationship kinds in one clean model. Good for evolvability (e.g. add allergens and foods to find what is safe to eat).\n\n### Cypher\n\nNeo4j's declarative language. Arrow notation creates edges: `(Idaho) -[:WITHIN]-> (USA)`. Query for people who emigrated from the US to Europe:\n\n```text\nMATCH\n  (person) -[:BORN_IN]-> () -[:WITHIN*0..]-> (us:Location {name:'United States'}),\n  (person) -[:LIVES_IN]-> () -[:WITHIN*0..]-> (eu:Location {name:'Europe'})\nRETURN person.name\n```\n\n`:WITHIN*0..` means follow WITHIN zero or more times (like regex `*`). Execution is the optimizer's choice: scan all people, or start from the two named locations (via an index) and work backward.\n\n### Graph queries in SQL\n\nPossible but clumsy: the number of joins is not fixed in advance. Use `WITH RECURSIVE` (recursive CTEs, SQL:1999; PostgreSQL, DB2, Oracle, SQL Server). The same query needs about 29 lines of SQL versus 4 of Cypher: different models suit different use cases.\n\n### Triple-stores and SPARQL\n\nEverything is a `(subject, predicate, object)` triple, equivalent to the property graph:\n\n- Object is a primitive value: predicate/object is a property, e.g. `(lucy, age, 33)`.\n- Object is another vertex: predicate is an edge, e.g. `(lucy, marriedTo, alain)`.\n\nWritten in Turtle/N3 (`_:lucy :bornIn _:idaho.`; semicolons repeat a subject). The **semantic web** (RDF to publish machine-readable data across sites) was overhyped and not realized, but triples remain a fine internal model (Datomic is a triple-store, actually 5-tuples, with no semantic-web claims). RDF predicates are often URIs to avoid naming clashes when combining datasets; namespaces need not resolve.\n\nSPARQL (borrowed by Cypher's pattern matching), variables start with `?`:\n\n```text\nSELECT ?personName WHERE {\n  ?person :name ?personName.\n  ?person :bornIn / :within* / :name \"United States\".\n  ?person :livesIn / :within* / :name \"Europe\".\n}\n```\n\n### Graph databases vs the network model\n\n| | CODASYL | Graph database |\n|---|---|---|\n| Schema | Fixed nesting of record types | Any vertex can link to any other |\n| Reaching a record | Only via access paths | By ID or index |\n| Ordering of children | Ordered set maintained by DB | Unordered; sort in queries |\n| Queries | Imperative, brittle | Imperative possible, usually declarative (Cypher, SPARQL) |\n\n### Datalog\n\n- Older (1980s academic), a Prolog subset; foundation for later languages.\n- Used by Datomic and Cascalog (Hadoop).\n- Facts are `predicate(subject, object)`, e.g. `within(idaho, usa)`. \n- Queries are built from **rules** (`head :- body`) that derive new predicates from data or other rules; rules may be recursive. Uppercase words are variables.\n\n```text\nwithin_recursive(Location, Name) :- name(Location, Name).               /* Rule 1 */\nwithin_recursive(Location, Name) :- within(Location, Via),\n                                    within_recursive(Via, Name).        /* Rule 2 */\nmigrated(Name, BornIn, LivingIn) :- name(Person, Name), born_in(Person, BornLoc),\n                                    within_recursive(BornLoc, BornIn),\n                                    lives_in(Person, LivingLoc),\n                                    within_recursive(LivingLoc, LivingIn).   /* Rule 3 */\n?- migrated(Who, 'United States', 'Europe').     /* Who = 'Lucy'. */\n```\n\nRules apply repeatedly: from `name(namerica, ...)` rule 1 yields `within_recursive(namerica, 'North America')`; rule 2 then yields `usa`, then `idaho` (Figure 2-6). Less convenient for one-off queries, but rules are reusable and cope well with complex data.\n\n```mermaid\nflowchart TD\n    A[\"Fact: name(namerica, North America)\"] -->|\"rule 1\"| B[\"within_recursive(namerica, North America)\"]\n    B -->|\"rule 2 + within(usa, namerica)\"| C[\"within_recursive(usa, North America)\"]\n    C -->|\"rule 2 + within(idaho, usa)\"| D[\"within_recursive(idaho, North America)\"]\n```\n\n## 5. Summary\n\n- History: hierarchical (one big tree) to relational (fixes many-to-many) to NoSQL splitting two ways: **document** (self-contained docs, rare cross-links) and **graph** (everything may relate to everything).\n- All three are widely used; one can emulate another, awkwardly.\n- Document and graph stores usually do not enforce a schema, but the app still assumes structure: explicit (write) vs implicit (read).\n- Other models exist: genome sequence-similarity search (GenBank), LHC-scale physics data (custom solutions), full-text search (alongside databases).\n\n## Quick recall\n\n- Data model choice shapes both code and thinking; every model makes some operations easy and others hard.\n- Relational: tables, strong joins, many-to-one and many-to-many, optimizer picks access paths.\n- Document: JSON trees, locality, flexible schema (schema-on-read), weak joins; keep documents small.\n- Normalization means storing human-meaningful data once and referencing it by ID.\n- Hierarchical (IMS) and network (CODASYL) models explain the history; relational won through declarative access and the optimizer.\n- Declarative beats imperative: optimizer freedom and parallelism; MapReduce is in between, and MongoDB added the aggregation pipeline.\n- Graphs: property graph (vertices and edges with labels and properties) or triples; query with Cypher, SPARQL, Datalog; `*` path patterns replace a variable number of joins.\n- Relational and document models are converging via JSON/XML support and joins.\n"},{"id":"chapter_03_storage-and-retrieval","num":3,"title":"Storage and Retrieval","part":"Part I · Foundations of Data Systems","tagline":"How databases lay data out on disk: LSM-trees, B-trees, and column stores for analytics.","notes":"---\ntags:\n  - ddia/chapter-3\n  - databases/storage-engines\ndate: 2026-11-21\n---\n\n# Chapter 3: Storage and Retrieval\n\n> [!abstract] Summary\n> **A database must store data and give it back, and how it lays data out on disk decides what it is fast at.** The chapter compares two families of OLTP storage engines: log-structured (Bitcask, SSTables, LSM-trees) and update-in-place (B-trees). It then covers other index types (secondary, clustered, multi-column, full-text, in-memory) and contrasts OLTP with analytics (OLAP). Analytics systems use star schemas and column-oriented storage with compression, sorting and materialized aggregates. Source: pages 69-104.\n\nReader assumed: an engineer who knows SQL, indexes and basic backend work, but not how engines work inside.\n\n## 1. Why care about internals\n\n- You rarely write a storage engine, but you must **choose** one and **tune** it for your workload.\n- Big split: engines tuned for transactions (OLTP) versus analytics (OLAP).\n- OLTP engines come in two families: **log-structured** and **page-oriented** (B-trees).\n\n## 2. The simplest database: an append-only log\n\nThe book's two-line Bash database: `db_set` appends `key,value` to a file; `db_get` greps the file and takes the last match (`tail -n 1`).\n\n| Operation | Cost | Why |\n|---|---|---|\n| Write (`db_set`) | Very cheap | Appending to a file is the simplest write |\n| Read (`db_get`) | $O(n)$ | Scans the whole file; doubling records doubles lookup time |\n\n- A **log** here means any append-only sequence of records, not only human-readable application logs.\n- An **index** is extra structure derived from the primary data. It speeds reads but **slows writes**, because every write must update it.\n- So databases do not index everything by default. You pick indexes based on your query patterns.\n\n## 3. Hash indexes and Bitcask\n\nIdea: keep an **in-memory hash map** from each key to a **byte offset** in the data file. Write appends and updates the map. Read looks up the offset, seeks, reads (Figure 3-1).\n\n- This is essentially **Bitcask** (default engine in Riak). Reads and writes are fast, but **all keys must fit in RAM**. Values can exceed RAM (one disk seek, or none if cached).\n- Good fit: few distinct keys, many updates per key (e.g. play counter per cat-video URL).\n\n**Avoiding running out of disk**\n\n1. Split the log into **segments**; when one reaches a size limit, close it and start a new one.\n2. **Compaction**: drop duplicate keys, keep the most recent value (Figure 3-2).\n3. **Merge** several segments while compacting, in a background thread, into a new file (Figure 3-3). Reads keep using old segments until the switch, then old files are deleted.\n4. Each segment has its own hash map. Lookup checks the newest segment first, then older ones.\n\n**Real-world details**\n\n| Issue | Solution |\n|---|---|\n| File format | Binary: length of string, then raw bytes (no escaping) instead of CSV |\n| Deletes | Append a **tombstone**; merging discards earlier values for that key |\n| Crash recovery | In-memory maps are lost. Rebuilding means rereading segments, so Bitcask stores hash-map snapshots on disk |\n| Partial writes | Checksums detect and ignore corrupt record tails |\n| Concurrency | One writer thread; immutable segments can be read by many threads |\n\n**Why append-only beats update-in-place**\n\n- Sequential writes are much faster than random writes, especially on spinning disks (somewhat on SSDs).\n- Concurrency and crash recovery are simpler (no half-old, half-new values).\n- Merging avoids fragmentation.\n\n**Limits of hash indexes**\n\n- The hash table must fit in memory. An on-disk hash map performs badly (random I/O, costly growth, collisions).\n- **Range queries are inefficient**: you cannot scan `kitty00000` to `kitty99999`; each key needs its own lookup.\n\n## 4. SSTables and LSM-trees\n\n**SSTable** (Sorted String Table): a segment whose key-value pairs are **sorted by key**, with each key appearing once per segment.\n\nAdvantages over hash-indexed log segments:\n\n1. **Merging is mergesort-like.** Read files side by side, copy the lowest key. Works even if files exceed memory. When a key appears in several segments, keep the newest segment's value (Figure 3-4).\n2. **Sparse in-memory index.** You need not index every key. To find `handiwork`, jump to the offset of `handbag` and scan forward until you hit it or pass it (Figure 3-5). One key per few KB is enough.\n3. **Block compression.** Scanned ranges can be grouped into a block and compressed. Each sparse-index entry points at a block start. This saves space and I/O bandwidth.\n\n### Building and maintaining SSTables\n\n```mermaid\nflowchart TD\n    W[\"Write\"] --> WAL[\"Append to on-disk log\"]\n    W --> M[\"Memtable (in-memory sorted tree)\"]\n    M -->|\"size over a few MB\"| S[\"Write out as new SSTable segment\"]\n    R[\"Read\"] --> M\n    M -->|\"miss\"| S1[\"Newest SSTable\"]\n    S1 -->|\"miss\"| S2[\"Older SSTables\"]\n    S --> C[\"Background merge and compaction\"]\n```\n\n- Sorted order is easy to maintain **in memory** with a red-black or AVL tree. This tree is the **memtable**.\n- When the memtable passes a threshold (typically a few MB), flush it as an SSTable. Writes continue into a new memtable meanwhile.\n- Reads check memtable, then newest segment, then older ones.\n- Crash risk: the memtable is lost. Fix: append every write to a separate **unsorted log** whose only job is to rebuild the memtable. Discard it after each flush.\n\n### The LSM-tree\n\n- This design is the **Log-Structured Merge-Tree** (O'Neil et al.). It is used in **LevelDB** and **RocksDB**, and in Cassandra and HBase (inspired by Google's Bigtable paper, which coined *SSTable* and *memtable*).\n- **Lucene** (Elasticsearch, Solr) keeps its term dictionary (term to postings list of document IDs) in SSTable-like files merged in the background.\n\n**Optimizations**\n\n| Problem | Remedy |\n|---|---|\n| Lookup of a key that does not exist must check everything | **Bloom filter**: memory-efficient set approximation that can say \"definitely not present\" |\n| When and how to compact | **Size-tiered** (newer small tables merged into older larger ones; HBase, Cassandra) versus **leveled** (key range split into small tables, data moved through levels; LevelDB, RocksDB, Cassandra) |\n\nSummary: sorted data allows range queries, and sequential writes give very high write throughput, even when data exceeds memory.\n\n## 5. B-trees\n\nIntroduced in 1970 and still the standard index in almost all relational databases. Like SSTables they keep keys sorted, but the design differs.\n\n| | Log-structured (LSM) | B-tree |\n|---|---|---|\n| Unit | Variable-size **segments** (MB+), written sequentially | Fixed-size **pages** (traditionally 4 KB), read/written one at a time |\n| Writes | Append, never modify files | **Overwrite pages in place** |\n| Matches hardware | Sequential I/O | Disk's fixed-size blocks |\n\n**Structure (Figure 3-6)**: a root page holds keys and references to child pages. Each child covers a continuous key range between the boundary keys. Following references down (e.g. looking up 251 between boundaries 200 and 300) reaches a **leaf page** holding values inline or references to them.\n\n- **Branching factor**: number of child references per page. The example has 6; in practice it is several hundred.\n- **Update**: find the leaf, change the value, write the page back.\n- **Insert**: find the page whose range covers the key. If it is full, **split** into two half-full pages and update the parent (Figure 3-7).\n- The tree stays balanced, depth $O(\\log n)$. A four-level tree of 4 KB pages with branching factor 500 stores up to **256 TB**.\n\n### Making B-trees reliable\n\n- A page split overwrites several pages. A crash midway can leave an **orphan page** and a corrupt index.\n- Solution: a **write-ahead log (WAL, redo log)**, an append-only file where every change is written before the tree pages. It restores consistency after a crash.\n- Concurrent access needs **latches** (lightweight locks). Log-structured designs are simpler: they merge in the background and atomically swap segments.\n\n**Optimizations**\n\n- **Copy-on-write** (e.g. LMDB): write modified pages to a new location and create new parent pages. No WAL needed, and helps concurrency control.\n- **Abbreviated keys** in interior pages give a higher branching factor and fewer levels (sometimes called a B+ tree).\n- Lay out leaf pages sequentially on disk for range scans (hard to maintain as the tree grows; LSM merges make this easier).\n- **Sibling pointers** on leaves allow ordered scans without going back to the parent.\n- Variants such as **fractal trees** borrow log-structured ideas.\n\n## 6. Comparing B-trees and LSM-trees\n\nRule of thumb: **LSM-trees are faster for writes, B-trees for reads** (LSM reads check several structures). Benchmarks are workload-sensitive, so test your own workload.\n\n| Aspect | LSM-tree | B-tree |\n|---|---|---|\n| Write amplification | Repeated compaction rewrites data, but often lower overall | Every write goes to WAL and page (maybe again on split), whole page even for a few bytes |\n| Write throughput | Typically higher; sequential compact files | Lower; random page overwrites |\n| Space | Better compression, less fragmentation | Unused space in split or partly filled pages |\n| Latency predictability | Compaction can stall requests; **high percentiles** can be bad | More predictable |\n| Compaction vs. incoming writes | Share finite disk bandwidth; if compaction cannot keep up, segments pile up, disk fills and reads slow. Usually no write throttling, so monitor | Not applicable |\n| Key location | Same key may exist in several segments | Each key in exactly one place |\n| Transactions | Harder | Range locks attach directly to the tree (useful for strong transaction semantics) |\n\n- **Write amplification**: one logical write causing several physical writes over time. It matters on SSDs, which wear out after limited overwrites, and when disk bandwidth is the bottleneck.\n- Many SSD firmwares use log-structured algorithms internally, so write-pattern impact is smaller, but compactness still helps.\n- Verdict: B-trees are deeply ingrained and consistently good. Log-structured indexes are increasingly popular in new datastores. No quick rule; test empirically.\n\n## 7. Other indexing structures\n\n### Secondary indexes\n\n- A **primary key** index identifies one row/document/vertex. **Secondary indexes** (`CREATE INDEX`) are crucial for joins.\n- Keys are not unique, so either store a **list of row IDs** as the value or make keys unique by appending the row ID. Works with B-trees and LSM-trees.\n\n### Where the value lives\n\n| Approach | What the index stores | Notes |\n|---|---|---|\n| **Heap file** (nonclustered) | Reference to row in an unordered heap | No data duplication across indexes. In-place update works if new value fits, else move row and update indexes or leave a forwarding pointer |\n| **Clustered index** | The row itself | Avoids extra hop on reads. InnoDB primary key is clustered and secondary indexes point to the primary key. SQL Server: one clustered index per table |\n| **Covering index** (included columns) | Some columns | Answers some queries from the index alone |\n\nClustered and covering indexes speed reads but cost extra storage and write overhead, and need care to stay consistent.\n\n### Multi-column indexes\n\n- **Concatenated index**: columns appended into one key, like a phone book on (lastname, firstname). Useful for last name or both. **Useless for first name only.**\n- **Multi-dimensional indexes** answer queries such as a latitude and longitude rectangle. A B-tree or LSM index gives one range, not both at once. Options: a **space-filling curve** to one number plus a B-tree, or **R-trees** (PostGIS).\n- Also useful beyond geography: (red, green, blue) colour ranges, or (date, temperature) for 2013 observations between 25 and 30 degrees C (HyperDex).\n\n### Full-text and fuzzy search\n\n- Lucene supports synonyms, grammatical variations, nearby words, and typos via **edit distance** (distance 1 = one letter added, removed or replaced).\n- Its in-memory term index is a **finite state automaton** (trie-like) that can become a **Levenshtein automaton**. LevelDB instead uses a sparse key index.\n\n### In-memory databases\n\n- RAM is getting cheaper and many datasets fit in memory (possibly across machines). Disks stay because they are durable and cheaper per GB.\n- Durability options: battery-powered RAM, change log on disk, periodic snapshots, replication. Memcached is cache-only (loss acceptable). Redis and Couchbase write to disk asynchronously (weak durability).\n- Products: VoltDB, MemSQL, Oracle TimesTen (relational); RAMCloud (log-structured KV).\n- **Surprise**: the speed gain is not from avoiding disk reads (the OS cache already helps). It comes from avoiding the overhead of **encoding data structures for disk**.\n- Easier rich structures: Redis offers priority queues and sets.\n- **Anti-caching**: evict least recently used records to disk, at record granularity (better than OS paging). Indexes must still fit in memory. Non-volatile memory may force further design changes.\n\n## 8. Transaction processing vs. analytics\n\n- **Transaction** here means a group of reads and writes forming a logical unit. It need not be ACID. OLTP means low-latency reads and writes, as opposed to periodic batch jobs.\n\n| Property | OLTP | OLAP |\n|---|---|---|\n| Read pattern | Few records by key | Aggregate over many records |\n| Write pattern | Random-access, low latency from user input | Bulk import (ETL) or event stream |\n| Used by | End users via web app | Internal analysts |\n| Data represents | Latest state | History of events |\n| Size | GB to TB | TB to PB |\n\nExample analytic queries: revenue per store in January; extra bananas sold during a promotion; brand of baby food most bought with brand X diapers.\n\n## 9. Data warehousing\n\n- OLTP databases are guarded: they must be highly available and low-latency, and ad hoc analytic scans can harm them.\n- A **data warehouse** is a separate read-only copy for analysts, fed by **ETL** (Extract-Transform-Load) from periodic dumps or a continuous stream of updates (Figure 3-8).\n\n```mermaid\nflowchart LR\n    A[\"Ecommerce site: Sales DB\"] -->|extract| T[\"Transform and clean\"]\n    B[\"Stock app: Inventory DB\"] -->|extract| T\n    C[\"Route planner: Geo DB\"] -->|extract| T\n    T -->|load| DW[(\"Data warehouse\")]\n    AN[\"Business analyst\"] -->|query| DW\n```\n\n- Common in large enterprises, rare in small companies (few systems, small data).\n- Main benefit: the warehouse can be **optimized for analytic access**, which OLTP indexes handle poorly.\n- Data model is usually relational (SQL), with drill-down and slicing and dicing tools. Internals diverge from OLTP. SQL Server and SAP HANA host both but are becoming two separate engines behind one SQL interface.\n- Vendors: Teradata, Vertica, ParAccel (hosted as Amazon Redshift). Open source SQL-on-Hadoop: Hive, Spark SQL, Impala, Presto, Tajo, Drill (some based on Google's Dremel).\n\n## 10. Stars and snowflakes\n\n- **Star schema** (dimensional modeling): a central **fact table** (each row an event, e.g. one product purchase in `fact_sales`) with foreign keys to **dimension tables** (who, what, where, when, how, why).\n- Figure 3-9 dimensions: `dim_product`, `dim_store`, `dim_date`, `dim_customer`, `dim_promotion`.\n- Facts are stored as individual events for maximum flexibility, so fact tables can be huge (tens of PB at Apple, Walmart, eBay).\n- Dates are dimension tables too, so you can encode holidays.\n- **Snowflake schema**: dimensions broken into sub-dimensions (brand, category tables). More normalized, but stars are often preferred as simpler.\n- Tables are **wide**: fact tables often 100+ columns, sometimes hundreds.\n\n## 11. Column-oriented storage\n\n**Motivation**: a fact table has over 100 columns, but a typical query touches 4 or 5. Example 3-1 (fruit vs candy sales by weekday in 2013) reads only `date_key`, `product_sk`, `quantity`. Row storage must load and parse every full row.\n\n**Idea**: store each **column** together (e.g. one file per column), with rows in the **same order** in every file. The k-th entry of each file rebuilds row k (Figure 3-10). Parquet is a columnar format (based on Dremel) that also supports documents.\n\n> [!warning] Column families are not columnar\n> Cassandra and HBase \"column families\" (from Bigtable) store all columns of a row together and do not use column compression. The Bigtable model is still mostly row-oriented.\n\n### Compression\n\n**Bitmap encoding** (Figure 3-11): when a column has few distinct values $n$ compared with the row count (e.g. 100,000 products across billions of sales), make one bitmap per value with one bit per row.\n\n- Few distinct values (e.g. about 200 countries): plain bitmaps.\n- Many distinct values: bitmaps are sparse, so add **run-length encoding**. Example for `product_sk = 31`: 5 zeros, 4 ones, 3 zeros, 3 ones.\n- Queries become bit operations:\n  - `product_sk IN (30, 68, 69)` is a bitwise **OR** of three bitmaps.\n  - `product_sk = 31 AND store_sk = 3` is a bitwise **AND** (works because row order is identical across columns).\n\n### CPU efficiency\n\n- Disk-to-memory bandwidth is not the only bottleneck. Memory-to-CPU-cache bandwidth, branch mispredictions and SIMD use also matter.\n- Compressed column chunks fit in L1 cache and are processed in tight loops with no function calls. Bitwise AND/OR operate directly on chunks. This is **vectorized processing**.\n\n### Sort order\n\n- Rows are sorted **a whole row at a time**, never each column independently (that would lose row identity).\n- Admin chooses sort keys from common queries, e.g. `date_key` first for date-range scans, `product_sk` second to group same-product sales per day.\n- Sorting helps compression: the first sort key has long repeated runs (run-length encoding can shrink it to a few KB even for billions of rows). Later keys compress less.\n- **Several sort orders** (C-Store, Vertica): store replicas sorted differently and use the best fit. Similar to multiple secondary indexes, except a column store has no pointers back to a single row location, only columns of values.\n\n### Writing to a column store\n\n- Reads dominate, but writes are hard: in-place insert into compressed, sorted columns would rewrite every column file.\n- Solution: the **LSM approach**. Writes go to an in-memory sorted store (row or column based), then merge into column files in bulk (Vertica). Queries combine disk data and recent in-memory writes, and the optimizer hides this.\n\n## 12. Aggregation: materialized views and data cubes\n\n| Concept | Meaning | Trade-off |\n|---|---|---|\n| Virtual view | Shortcut that is expanded into its query on read | No stored data |\n| **Materialized view** | Actual copy of query results on disk | Must be updated when data changes, so writes cost more. Rare in OLTP, reasonable in read-heavy warehouses |\n| **Data cube (OLAP cube)** | Grid of aggregates (e.g. SUM of `net_price`) by dimensions | Fast precomputed answers, but less flexible than raw data |\n\n- Figure 3-12: a date by product grid. Each cell is a SUM. Row and column totals give per-date and per-product sums (examples in the figure: 149.60 for one date and product, 40710.53 per date, 14967.09 per product).\n- With five dimensions (date, product, store, promotion, customer) it is a hypercube, still summarized along each dimension.\n- Limit: you cannot compute \"share of sales from items over 100 dollars\" if price is not a dimension. So warehouses keep raw data and use cubes only as a speed-up.\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Index every column | Every write updates every index | Choose indexes from real query patterns |\n| Assume LSM is always faster | Reads and tail latency can suffer, compaction can fall behind | Benchmark your workload and monitor compaction |\n| Use a concatenated index to search the second column alone | Index is useless | Order columns by query need, or add another index |\n| Call Cassandra column families columnar | Expect compression benefits that do not exist | Treat them as row-oriented |\n| Sort each column of a column store independently | Rows cannot be rebuilt | Sort whole rows by chosen keys |\n\n## Quick recall\n\n- Append-only log: fast writes, $O(n)$ reads; an index trades write speed for read speed.\n- Bitcask: in-memory hash map to byte offsets. Needs all keys in RAM, no range queries.\n- SSTable: sorted segment, mergesort merge, sparse index, block compression.\n- LSM-tree: memtable plus WAL, flush to SSTables, background compaction (size-tiered or leveled), Bloom filters for missing keys.\n- B-tree: 4 KB pages, branching factor of hundreds, depth about $\\log n$, updates in place, WAL for crash safety, latches for concurrency.\n- LSM: better write throughput and compression, but compaction interference and tail latency. B-tree: predictable, one copy per key, easy range locks.\n- Secondary indexes: row-ID lists or unique keys; heap file vs clustered vs covering index.\n- Multi-dimensional needs (R-trees); full-text uses edit-distance automata.\n- In-memory databases win by skipping disk encoding overhead, not only disk reads.\n- OLTP = small key lookups; OLAP = big scans and aggregates, served by a warehouse fed by ETL.\n- Star schema: fact table plus dimensions. Columnar storage reads only needed columns, compresses with bitmaps and run-length encoding, uses sorted rows, and writes via LSM-style buffering.\n- Materialized views and data cubes precompute aggregates at the cost of flexibility.\n"},{"id":"chapter_04_encoding-and-evolution","num":4,"title":"Encoding and Evolution","part":"Part I · Foundations of Data Systems","tagline":"Turning data into bytes, and keeping old and new code and data compatible.","notes":"---\ntags:\n  - ddia/chapter-4\n  - databases/encoding\n  - databases/schema-evolution\ndate: 2026-11-21\n---\n\n# Chapter 4: Encoding and Evolution\n\n> [!abstract] Summary\n> **Applications change, so old and new code and old and new data formats must coexist, which needs backward and forward compatibility.** The chapter compares ways to turn in-memory data into bytes: language-specific formats, JSON/XML/CSV, and schema-driven binary formats (Thrift, Protocol Buffers, Avro). It shows how each one handles schema evolution. It then walks through three dataflow modes where encoding matters: databases, services (REST and RPC), and asynchronous message passing. Source: pages 111-140.\n\nReader assumed: an engineer who has used JSON APIs and databases and has heard of protobuf or Avro, but wants the compatibility rules clear.\n\n## 1. Why this chapter exists\n\n- Features change, so the stored data format changes (new field, new record type).\n- Relational databases keep **one schema** at a time (changed through `ALTER` migrations). Schema-on-read (\"schemaless\") databases can hold a mix of old and new formats.\n- Code cannot change everywhere at once:\n  - Server side: **rolling upgrade** (staged rollout) to a few nodes at a time, with no downtime.\n  - Client side: the user decides when to update.\n- So old and new code and data coexist. You need both:\n\n| Property | Meaning | Difficulty |\n|---|---|---|\n| **Backward compatibility** | Newer code can read data written by older code | Easy: you know the old format |\n| **Forward compatibility** | Older code can read data written by newer code | Harder: old code must ignore additions it does not understand |\n\n## 2. Formats for encoding data\n\n- In memory: objects, lists, hash tables, pointers. On disk or network: a self-contained byte sequence.\n- **Encoding** (serialization, marshalling) is in-memory to bytes. **Decoding** (parsing, deserialization, unmarshalling) is the reverse.\n- \"Serialization\" also means something unrelated in transactions (Chapter 7), so the book says *encoding*. Encoding has nothing to do with encryption.\n\n### Language-specific formats\n\nExamples: Java `Serializable`, Ruby `Marshal`, Python `pickle`, Kryo.\n\n| Problem | Why it hurts |\n|---|---|\n| Tied to one language | Locks you in and blocks integration with other organizations |\n| Needs to instantiate arbitrary classes | Security hole: attacker-controlled bytes can lead to remote code execution |\n| Versioning is an afterthought | Poor forward and backward compatibility |\n| Efficiency is an afterthought | Java serialization is slow and bloated |\n\nVerdict: avoid except for very transient purposes.\n\n### JSON, XML, CSV and binary variants\n\nTextual, human-readable, language-independent, and likely to stay popular for **data interchange between organizations**, because agreeing on anything across organizations is the hard part.\n\n| Issue | Detail |\n|---|---|\n| Numbers | XML and CSV cannot tell a number from a digit string. JSON has no int/float distinction and no precision |\n| Large integers | Above $2^{53}$ they lose precision as IEEE 754 doubles (e.g. JavaScript). Twitter returns tweet IDs twice, as a number and as a decimal string |\n| Binary data | No binary string support, so people use **Base64**, which adds 33% size |\n| Schemas | Optional and complex (XML Schema, JSON Schema). Many JSON tools skip them, so interpretation is hardcoded |\n| CSV | No schema, vague escaping rules (commas and newlines in values); parsers differ |\n\n**Binary JSON/XML variants** (MessagePack, BSON, BJSON, UBJSON, BISON, Smile; WBXML, Fast Infoset) keep the data model, so they must still store field names.\n\n- Example record (Example 4-1): `{\"userName\": \"Martin\", \"favoriteNumber\": 1337, \"interests\": [\"daydreaming\", \"hacking\"]}`.\n- MessagePack encoding (Figure 4-1): first byte `0x83` = object (top 4 bits `0x8`) with 3 fields (bottom 4 bits). Then `0xa8` = string of 8 bytes, followed by `userName` and so on. Length prefixes mean no end markers or escaping.\n- Result: **66 bytes versus 81 bytes** for compact textual JSON. A small gain that costs human readability.\n\n## 3. Schema-driven binary formats\n\n### Thrift and Protocol Buffers\n\n- Protocol Buffers (Google) and Thrift (Facebook), both open sourced in 2007-08. Both **require a schema** and provide **code generation** for many languages.\n\n```text\nThrift IDL                               Protocol Buffers\nstruct Person {                          message Person {\n  1: required string userName,             required string user_name = 1;\n  2: optional i64 favoriteNumber,          optional int64 favorite_number = 2;\n  3: optional list<string> interests     repeated string interests = 3;\n}                                        }\n```\n\n- Encoded fields carry a **field tag** (number 1, 2, 3 from the schema) plus a type annotation, instead of field names.\n- Thrift has two main binary encodings (plus a C++-only third one and JSON ones).\n\n| Encoding | Size for Example 4-1 | How |\n|---|---|---|\n| Textual JSON (no whitespace) | 81 bytes | Field names spelled out |\n| MessagePack | 66 bytes | Field names still included |\n| Thrift BinaryProtocol | 59 bytes | Field tags and types, lengths |\n| Thrift CompactProtocol | 34 bytes | Type and tag packed in one byte, **variable-length integers** (1337 in two bytes; -64 to 63 in one byte; -8192 to 8191 in two) |\n| Protocol Buffers | 33 bytes | Similar to Compact, packed slightly differently |\n| Avro | 32 bytes | No tags or types at all (see below) |\n\n- `required` versus `optional` does not change the encoding. `required` only enables a runtime check that fails when the field is not set.\n\n**Schema evolution with tags**\n\n- An encoded record is the concatenation of its fields. Unset fields ar
