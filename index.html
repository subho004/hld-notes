me systems (airbags, flight control) have deadlines and need an RTOS, documented worst-case times, limited dynamic memory, and heavy testing. This is expensive and lowers throughput, so it is not suitable for most servers. Real-time is not the same as high-performance.\n\n**Limiting GC impact.** Treat a GC like a planned brief outage: the runtime warns, the node stops taking new requests and drains, then collects (used in some trading systems). Or restart processes periodically so only short-lived objects are collected, shifting traffic like a rolling upgrade.\n\n## 4. Knowledge, truth and lies\n\nA node cannot know anything for sure; it only guesses from messages. We state assumptions as a **system model** and design to meet them.\n\n### 4.1 The truth is defined by the majority\n\nScenarios where a healthy node is wrongly declared dead: asymmetric network fault (it receives but its replies are dropped), or a long GC pause after which it wakes up unaware. A node cannot trust its own judgment, so use a **quorum**: usually more than half the nodes. Three nodes tolerate 1 failure, five tolerate 2, and there can only be one majority, so no conflicting decisions. A node declared dead by a quorum must step down.\n\n### 4.2 Leader, lock and fencing tokens\n\nOnly-one-of-something needs: one leader per partition (avoid split brain), one lock holder, one user per username. A node that believes it is the leader may be wrong.\n\nFigure 8-4 (a real HBase bug): client 1 gets a lease, has a GC pause, the lease expires, client 2 gets the lease and writes, then client 1 wakes up and also writes, corrupting the file.\n\n**Fencing token**: a number that increases every time a lock or lease is granted. Each write to storage carries its token, and storage rejects any token lower than the highest already seen.\n\n```mermaid\nsequenceDiagram\n    participant L as Lock service\n    participant C1 as Client 1\n    participant C2 as Client 2\n    participant S as Storage\n    L-->>C1: lease, token 33\n    Note over C1: stop-the-world GC pause\n    L-->>C2: lease, token 34\n    C2->>S: write, token 34\n    S-->>C2: ok\n    C1->>S: write, token 33\n    S-->>C1: rejected, token 33 older than 34\n```\n\n- With ZooKeeper, `zxid` or `cversion` can serve as the token (monotonic).\n- The **resource** must check tokens; clients checking their own lock status is not enough. For resources without support, you might put the token in a filename.\n- Servers should protect themselves from clients that misbehave by accident.\n\n### 4.3 Byzantine faults\n\nFencing stops nodes that err **inadvertently**, not ones that lie. The book assumes nodes are unreliable but honest. A **Byzantine fault** means a node may send arbitrary or false messages. The Byzantine Generals Problem generalizes the Two Generals Problem (consensus over unreliable messengers). A system is **Byzantine fault-tolerant** if it works despite malfunctioning or malicious nodes.\n\n- Relevant for: aerospace (radiation-corrupted memory), multi-organization systems such as Bitcoin and blockchains.\n- Usually not relevant in your own datacenter: the protocols are complicated and costly. Typically needs more than two-thirds of nodes correct (4 nodes, at most 1 faulty). It does not protect against a bug present in every node, or an attacker who compromises one node and so likely all of them; use authentication, access control, encryption and firewalls instead.\n- Web servers treat clients as untrusted via validation, sanitization and output escaping, not BFT protocols.\n\n**Weak forms of lying** worth guarding against: application-level checksums for corrupted packets that slip past TCP/UDP checksums; sanitizing user input (ranges, string sizes); NTP clients using multiple servers and a majority agreement.\n\n## 5. System model and reality\n\nA **system model** abstracts the faults an algorithm may assume.\n\n| Timing model | Assumption |\n|---|---|\n| Synchronous | Bounded network delay, pauses, and clock error. Unrealistic |\n| Partially synchronous | Behaves synchronously most of the time, sometimes exceeds bounds. Realistic |\n| Asynchronous | No timing assumptions, no clock, no timeouts. Very restrictive |\n\n| Node failure model | Assumption |\n|---|---|\n| Crash-stop | A node fails only by crashing and never returns |\n| Crash-recovery | A node may crash and return; disk survives, memory is lost |\n| Byzantine | Anything, including deceit |\n\nThe most useful combination: **partially synchronous with crash-recovery**.\n\n**Correctness via properties.** Example for fencing tokens: *uniqueness* (no two requests return the same token), *monotonic sequence* (if x finished before y began, then $t_x < t_y$), *availability* (a non-crashed requester eventually gets a response).\n\n| | Safety | Liveness |\n|---|---|---|\n| Informal | Nothing bad happens | Something good eventually happens |\n| Examples above | Uniqueness, monotonic sequence | Availability |\n| If violated | Can point to the moment; cannot be undone | May not hold now, but can still be satisfied later |\n| Requirement | Must **always** hold, even if all nodes crash | May carry caveats (majority alive, network recovers) |\n\nEventual consistency is a liveness property. Reality bites: disk data may be corrupted or lost (amnesia breaks quorum algorithms), firmware may not see the drives. Real implementations must handle \"impossible\" cases, even if only by alerting a human. Theory and testing are equally important: a proof does not guarantee a correct implementation, but it finds problems that might otherwise stay hidden.\n\n## 6. Summary\n\n- Packets can be lost or delayed, and replies too; no reply means no knowledge.\n- Clocks can be far off, jump, and have an unknown error interval.\n- Processes can pause at any time and come back unaware.\n- Timeouts are the main failure detector but cannot tell network from node failure, and a \"limping\" degraded node (e.g. a Gigabit NIC dropping to 1 Kb/s) is harder than a dead one.\n- No shared state, so important decisions need quorums.\n- If everything fits on one machine, keep it there; but fault tolerance and low latency need distribution.\n- Hard real-time and bounded networks exist but are expensive. Supercomputers stop and restart on failure; distributed services can run forever, though a bad config rolled to all nodes can still sink them.\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Treating \"no response\" as \"node dead\" | Duplicate actions, cascading failover | Timeouts tuned and adaptive; idempotence or dedup |\n| Using time-of-day for elapsed time | Jumps break timeouts | Monotonic clock |\n| Ordering events by wall-clock timestamps (LWW) | Silent data loss | Logical clocks or version vectors |\n| Trusting a lease without checking time of use | Zombie leader writes | Fencing tokens checked by the resource |\n| Assuming clock reading is exact | Wrong ordering decisions | Treat as a confidence interval (TrueTime style) |\n| Mixing up node failure with lying | Overspending on BFT, or none where needed | Honest-but-faulty is the default; BFT only for untrusted parties |\n\n> [!question] Q1 · A client's write is rejected by storage even though it believes it holds the lock. Which mechanism caused this?\n>\n> > [!success] Answer\n> > A fencing token. Its lease expired during a pause, a newer token was granted to another client, and storage rejects the lower token (33 after 34 in Figure 8-5).\n\n> [!question] Q2 · Why can Spanner use clock timestamps as transaction IDs when NTP timestamps cannot be trusted?\n>\n> > [!success] Answer\n> > TrueTime exposes the uncertainty interval, and Spanner waits out the interval before committing, so non-overlapping intervals guarantee ordering. GPS or atomic clocks keep the wait short (about 7 ms).\n\n## Quick recall\n\n- Partial failure plus nondeterminism is what defines distributed systems.\n- Async networks: no bound on delay; no reply is ambiguous; timeouts are tuned experimentally or adaptively (Phi Accrual).\n- Delay variance comes from queueing, a utilization trade-off, not a law of nature.\n- Time-of-day clocks jump; monotonic clocks measure durations; neither can order events across machines reliably.\n- Process pauses (GC, VM, swapping) mean a node can act on stale beliefs.\n- Truth is decided by a majority quorum; use fencing tokens to stop zombies.\n- Assume honest-but-faulty nodes (non-Byzantine) in a datacenter.\n- Use system models (partially synchronous plus crash-recovery) and safety/liveness properties to reason about algorithms.\n"},{"id":"chapter_09_consistency-and-consensus","num":9,"title":"Consistency and Consensus","part":"Part II · Distributed Data","tagline":"Linearizability, ordering and causality, atomic commit, and fault-tolerant consensus.","notes":"---\ntags:\n  - ddia/chapter-9\n  - distributed-systems/consistency\n  - distributed-systems/consensus\ndate: 2026-11-21\n---\n\n# Chapter 9: Consistency and Consensus\n\n**Summary.** Distributed systems fail in many ways (Chapter 8), so the best approach is to build a few general-purpose abstractions with strong guarantees and let applications rely on them, as transactions do. This chapter covers three such ideas. **Linearizability** makes replicated data look like a single copy, at the cost of speed and availability. **Ordering** (causality, Lamport timestamps, total order broadcast) captures \"what happened before what\". **Consensus** gets nodes to agree irrevocably, and turns out to be equivalent to atomic commit, total order broadcast, linearizable compare-and-set, locks, and uniqueness constraints. ZooKeeper and etcd package consensus as a service.\n\n> [!info] Reader assumed\n> You know replication (single-leader, multi-leader, leaderless), transactions and isolation levels, and the Chapter 8 faults (delays, clock skew, pauses). This note is for fast revision.\n\n## 1. Consistency guarantees\n\n- Replicas differ at any instant because writes arrive at different times. This holds for every replication method.\n- **Eventual consistency** (better name: *convergence*): if writes stop, all replicas eventually return the same value. It says nothing about *when*; until then reads can return anything, even your own write is not guaranteed to be visible.\n- It is hard to program against: a database looks like a variable but does not behave like one. Bugs show up only under faults or high concurrency.\n- Stronger models cost performance or fault tolerance, but are easier to use correctly.\n- Consistency models vs isolation levels: mostly independent. Isolation is about concurrent *transactions*; distributed consistency is about coordinating *replica state* under delays and faults.\n\nRoadmap: linearizability, then ordering (causality, total order), then atomic commit and consensus.\n\n## 2. Linearizability\n\n**Idea:** make the system behave as if there were one copy of the data and every operation were atomic. Also called atomic, strong, immediate, or external consistency. It is a **recency guarantee**: once a write completes, all later reads see it.\n\nFootball example (Fig 9-1): Alice reloads and sees the final score, tells Bob, Bob reloads and hits a lagging replica and sees the game still running. Bob started his read *after* Alice's finished, so seeing older data violates linearizability.\n\n### What makes a system linearizable\n\nModel a key as a **register**. Operations are `read(x)`, `write(x, v)`, and `cas(x, old, new)` (compare-and-set). Each operation is a bar from request sent to response received; it took effect atomically at some point inside the bar.\n\nRules (Fig 9-2, 9-3, 9-4):\n\n1. A read that finishes before the write starts returns the old value.\n2. A read that starts after the write finishes returns the new value.\n3. Reads overlapping the write may return either...\n4. ...but once any read returns the new value, **all later reads must too**, even before the write completes.\n\nEquivalent picture: join the points at which operations took effect into a line; the line must only move forward in time and each read must return the latest write.\n\n```mermaid\nsequenceDiagram\n    participant C as Client C\n    participant DB as Register x\n    participant A as Client A\n    participant B as Client B\n    C->>DB: write(x, 1) starts\n    A->>DB: read(x)\n    DB-->>A: 1 (new value seen)\n    B->>DB: read(x) starts after A returned\n    DB-->>B: must be 1, not 0\n    DB-->>C: write ok (later)\n```\n\nNotice that B's read must return 1 even though C's write has not yet been acknowledged.\n\nFig 9-4 details worth remembering:\n\n- Requests can be processed in an order different from the order sent, as long as they were concurrent.\n- A read can return a value before the writer gets its `ok`; the ack was just delayed.\n- No isolation is assumed: C reads 1 then 2 because B changed it. `cas` detects that: B and C's `cas` succeed, D's `cas(x,0,3)` fails.\n- B's final read returning 2 is **not** linearizable: A had already read 4 before B's read started.\n- Testing linearizability is possible but expensive (record all timings, check for a valid sequential order).\n\n### Linearizability vs serializability\n\n| | Serializability | Linearizability |\n|---|---|---|\n| Scope | Transactions over multiple objects | Single object (register) |\n| Guarantee | Behaves as if run in *some* serial order | Recency of reads and writes |\n| Prevents write skew? | Yes | No, unless extra measures |\n| Order must match real time? | No | Yes |\n\n- Both together = **strict serializability** (strong-1SR). 2PL and actual serial execution are typically linearizable.\n- **SSI is not linearizable**: it reads from a consistent snapshot, which by design excludes newer writes.\n\n### When you need linearizability\n\n| Use case | Why |\n|---|---|\n| Locking and leader election | All nodes must agree who holds the lock, else split brain. ZooKeeper and etcd build this on consensus. Oracle RAC uses a lock per disk page. |\n| Uniqueness constraints | Username, file path, seat booking, non-negative balance, stock level: a single up-to-date value everyone agrees on. A username claim is like a `cas` from null to user ID. |\n| Cross-channel timing | Two channels carry related info, e.g. photo in file storage plus resize job on a message queue (Fig 9-5). If storage is stale when the job arrives, the resizer reads an old or missing image and sizes become permanently inconsistent. |\n\n- Hard uniqueness needs linearizability; foreign key and attribute constraints do not. Loosely interpreted constraints (overbooking with compensation) may not need it (see Chapter 12, \"Timeliness and Integrity\").\n- ZooKeeper/etcd: writes are linearizable, reads may be stale by default. etcd has *quorum reads*; ZooKeeper needs `sync()` first.\n\n### Implementing linearizable systems\n\n| Replication | Linearizable? | Why |\n|---|---|---|\n| Single-leader | Potentially | Reads from leader or sync followers. Breaks with snapshot isolation, bugs, a \"delusional\" old leader, or async failover losing writes. |\n| Consensus (ZooKeeper, etcd) | Yes | Built-in protection against split brain and stale replicas. |\n| Multi-leader | No | Concurrent writes on several nodes, async replication, conflicts. |\n| Leaderless (Dynamo-style) | Probably not | LWW with clocks, sloppy quorums, and even strict quorums can fail. |\n\n**Quorums are not enough (Fig 9-6).** With n=3, w=3, r=2: the write reaches replica 2 first. Reader A queries a quorum that includes replica 2 and gets 1. Reader B starts after A finished, queries two other replicas, and gets 0. w+r>n holds but linearizability is violated. You can fix this with synchronous read repair plus a writer that first reads the latest state from a quorum, at a performance cost. Riak skips synchronous read repair; Cassandra does it but loses linearizability through last-write-wins. Even then, a linearizable `cas` still needs consensus. Safest assumption: leaderless systems are not linearizable.\n\n### The cost of linearizability\n\nTwo datacenters with a network partition between them (Fig 9-7):\n\n- **Multi-leader:** each datacenter keeps working, writes queue and sync later. Not linearizable, but available.\n- **Single-leader:** clients in the follower datacenter cannot reach the leader, so no writes and no linearizable reads (stale follower reads are still possible). They are unavailable.\n\n```mermaid\nflowchart TD\n    P[\"Network partition occurs\"] --> Q{\"Need linearizability?\"}\n    Q -->|Yes| U[\"Disconnected replicas wait or error: unavailable\"]\n    Q -->|No| A[\"Each replica serves requests independently: available, not linearizable\"]\n```\n\n**CAP theorem.** Read it as \"either consistent or available *when partitioned*\". Partitions are faults, not a choice, so \"pick 2 of 3\" is misleading. When the network works you can have both. The theorem's formal \"availability\" does not match the usual meaning, and it covers only one model (linearizability) and one fault (partitions), so it has little practical value and is mostly historical. It did push the field toward shared-nothing designs (NoSQL).\n\n**Performance is the real cost.**\n\n- Even RAM on a multi-core CPU is not linearizable (per-core caches and store buffers; memory barriers are needed). That choice is made for speed, not fault tolerance.\n- Many distributed databases drop linearizability for the same reason.\n- Attiya and Welch: linearizable read and write response time is at least proportional to network delay uncertainty. No faster algorithm exists, so latency-sensitive systems need weaker models.\n\n## 3. Ordering guarantees\n\nOrdering recurs everywhere: the leader orders the replication log, serializability gives a serial order, timestamps try to order events.\n\n### Ordering and causality\n\n- **Causality**: cause before effect. Examples from earlier chapters: a question before its answer (consistent prefix reads), a row created before updated, A happened-before B, snapshots consistent with causality, write skew as a causal dependency, Alice and Bob.\n- A system that obeys causal order is **causally consistent**. Snapshot isolation is causally consistent.\n\n| | Order type | Concurrency |\n|---|---|---|\n| Linearizability | **Total** order: any two operations comparable | None: one timeline |\n| Causality | **Partial** order: related operations ordered, concurrent ones incomparable | Branches and merges, like a Git history |\n\n- **Linearizability implies causality** (that is why it is simple), but is not required for it.\n- **Causal consistency is the strongest model that does not slow down from network delays and stays available under network failures.** CAP does not apply. Many systems that seem to need linearizability only need causal consistency. Research systems exist but production adoption is limited.\n- To capture causality, track what a node had \"seen\" when it wrote. Version vectors can be generalized across the whole database. A replica must delay an operation until all its causal predecessors are processed.\n\n### Sequence number ordering\n\nTracking all causal dependencies is impractical (clients read lots before writing). Instead use **sequence numbers or logical clocks**: small, totally ordered, and consistent with causality (if A happened before B, A gets a lower number; concurrent operations ordered arbitrarily).\n\n- Single-leader: the replication log counter gives such an order for free.\n- Without a single leader, common generators are **not** causality-consistent:\n\n| Generator | Problem |\n|---|---|\n| Odd/even (or node-ID bits) per node | Nodes progress at different rates |\n| Physical timestamps | Clock skew |\n| Pre-allocated blocks (node A 1-1000, B 1001-2000) | Later operation may get a lower block |\n\n**Lamport timestamps** (1978): a pair `(counter, node ID)`. Compare by counter, then node ID. Every node and client tracks the **maximum counter seen** and sends it with each request; a node that sees a larger max bumps its own counter to it (Fig 9-8: node 1 at counter 1 receives max 5 from client A, then its next op is 6). Every causal dependency increases the timestamp.\n\n- Lamport timestamps vs version vectors: version vectors detect concurrency; Lamport timestamps always give a total order and cannot tell concurrent from causal, but are more compact.\n\n> [!warning] Timestamp order is not enough\n> To enforce unique usernames, comparing Lamport timestamps works only *after* collecting all claims. A node deciding *right now* cannot know whether another node is creating the same name with a lower timestamp. Asking every node halts the system if one is unreachable. You need to know when the order is **finalized**. That is total order broadcast.\n\n### Total order broadcast\n\nAlso called atomic broadcast (unrelated to ACID atomicity). Two safety properties, always satisfied even under faults (delivery may wait for the network to heal):\n\n- **Reliable delivery**: if one node gets a message, all do.\n- **Totally ordered delivery**: all nodes get messages in the same order.\n\nUses and facts:\n\n- ZooKeeper and etcd implement it; it is the basis of **state machine replication**, serializable transactions via deterministic stored procedures, and fencing tokens (ZooKeeper `zxid`).\n- It behaves like an append-only **log**. The order is fixed at delivery time: you cannot insert into an earlier position, which makes it stronger than timestamp ordering.\n- It is asynchronous (no guarantee on *when*), while linearizability is a recency guarantee.\n\n**Linearizable `cas` from total order broadcast** (username claim):\n\n1. Append a tentative claim message to the log.\n2. Read the log until your message is delivered back.\n3. If the first claim for that name is yours, you win; otherwise abort.\n\nAll nodes agree who was first. This gives linearizable **writes** but reads from an async replica may be stale (this is really sequential or timeline consistency). Options for linearizable reads: sequence the read through the log (etcd quorum reads), fetch the latest log position and wait for it (ZooKeeper `sync()`), or read from a synchronously updated replica (chain replication).\n\n**Total order broadcast from a linearizable register**: use an atomic increment-and-get register; stamp each message with its number; recipients deliver consecutively. Unlike Lamport timestamps these numbers have **no gaps**, so a node that has delivered 4 and receives 6 knows to wait for 5. That is the key difference. Building a fault-tolerant linearizable counter leads inevitably to consensus.\n\n**Result:** linearizable cas/increment registers and total order broadcast are each equivalent to consensus.\n\n## 4. Distributed transactions and consensus\n\nConsensus = getting nodes to agree. Needed for **leader election** (avoid split brain) and **atomic commit** (all nodes commit or all abort).\n\n**FLP result.** No algorithm can always reach consensus if a node may crash, but only in the asynchronous model with no clocks or timeouts. With timeouts, failure suspicion, or randomness, consensus is solvable. In practice it works.\n\n### Atomic commit and two-phase commit\n\nOn one node, commit is decided by a single event: the commit record reaching the log on disk (data first, then the commit record). Across nodes, sending \"commit\" to each independently can leave some committed and others aborted (constraint violations, lost requests, crashes). A commit is **irrevocable**; only a separate compensating transaction can undo its effects, and that is the application's problem.\n\n**2PC** uses a **coordinator** (transaction manager) and **participants**:\n\n```mermaid\nsequenceDiagram\n    participant App as Application\n    participant Co as Coordinator\n    participant D1 as Database 1\n    participant D2 as Database 2\n    App->>Co: begin, get global transaction ID\n    App->>D1: reads and writes (tx ID)\n    App->>D2: reads and writes (tx ID)\n    Co->>D1: phase 1 prepare\n    Co->>D2: phase 1 prepare\n    D1-->>Co: yes\n    D2-->>Co: yes\n    Note over Co: commit point, decision logged to disk\n    Co->>D1: phase 2 commit\n    Co->>D2: phase 2 commit\n```\n\nWhy it works: **two points of no return**.\n\n1. A participant that votes \"yes\" promises it can commit under all circumstances (data durably written, conflicts checked). It gives up the right to abort.\n2. When the coordinator has all votes it writes its decision to its log (the **commit point**), then retries commit/abort forever until delivered. Any \"no\" or timeout in phase 1 means abort.\n\n> [!warning] 2PC is not 2PL\n> Two-phase commit gives atomic commit across nodes. Two-phase locking gives serializable isolation. Unrelated.\n\n**Coordinator failure.** If it crashes after participants voted yes (Fig 9-10), they are **in doubt**: they cannot commit or abort unilaterally and must wait. The coordinator recovers from its log and aborts any transaction with no commit record. That is why 2PC is a **blocking** protocol.\n\n**3PC** is nonblocking in theory, but assumes bounded delays and response times. Nonblocking atomic commit needs a perfect failure detector, which timeouts are not in real networks. So 2PC stays in use.\n\n### Distributed transactions in practice\n\n- Reputation is mixed. Cost comes from extra fsyncs and round trips; MySQL distributed transactions were reported over 10 times slower than single-node ones. Many cloud services avoid them.\n- Two kinds:\n\n| Kind | Example | Notes |\n|---|---|---|\n| Database-internal | VoltDB, MySQL Cluster (NDB) | Same software on all nodes, can optimize; often works well |\n| Heterogeneous | Two vendors' databases, or a database plus message broker | Much harder |\n\n- **Exactly-once processing**: atomically commit the message acknowledgement and the database writes. On abort the broker redelivers and the side effects are rolled back, so processing is effectively exactly once. All systems involved must support the same commit protocol (an email server that does not will send duplicates).\n- **XA** (1991): a C API to a transaction coordinator, not a network protocol. Used via JTA/JDBC/JMS. Supported by PostgreSQL, MySQL, DB2, SQL Server, Oracle, ActiveMQ, IBM MQ, and others. The coordinator is usually a library in the application process with a log on local disk.\n- **Locks held while in doubt**: participants keep their row locks until the outcome is known. A coordinator down for 20 minutes means 20 minutes of blocked rows; a lost log means locks held forever. **Orphaned in-doubt transactions** survive reboots (they must, for atomicity) and need an administrator to resolve manually. XA's escape hatch, **heuristic decisions**, lets a participant decide alone and *probably breaks atomicity*.\n\nLimitations:\n\n- The coordinator is a database of outcomes; unreplicated, it is a single point of failure.\n- A coordinator in the app server makes the app **stateful**; its log becomes critical durable state.\n- XA is a lowest common denominator: no cross-system deadlock detection, no SSI.\n- All participants must respond, so distributed transactions **amplify failures**.\n- Alternatives are in Chapters 11 and 12.\n\n### Fault-tolerant consensus\n\nFormal definition: nodes **propose** values, the algorithm **decides** one. Four properties:\n\n| Property | Meaning | Kind |\n|---|---|---|\n| Uniform agreement | No two nodes decide differently | Safety |\n| Integrity | No node decides twice | Safety |\n| Validity | Decided value was proposed by someone (rules out \"always decide null\") | Safety |\n| Termination | Every non-crashed node eventually decides | Liveness |\n\n- Without fault tolerance a \"dictator\" node satisfies the first three. Termination is what demands fault tolerance, and 2PC fails it (it waits for the coordinator to recover).\n- The model assumes a crashed node never returns. Termination needs a **majority** of nodes working; safety holds even if a majority fails. Most algorithms assume no Byzantine faults (tolerating them needs fewer than one third faulty).\n- Main algorithms: Viewstamped Replication, Paxos, Raft, Zab. Most decide a *sequence* of values, so they are really **total order broadcast**: repeated consensus rounds (Multi-Paxos in Paxos). Agreement gives same order, integrity no duplicates, validity no fabricated messages, termination no loss.\n- **Leader election paradox**: electing a leader needs consensus, which needs a leader. The way out is **epoch numbers** (Paxos ballot, VSR view, Raft term): monotonically increasing, and each epoch has at most one leader; the higher epoch wins.\n- Before deciding, a leader needs a **quorum** vote, and the quorums for \"elect leader\" and \"accept proposal\" overlap, so a leader learns if a higher epoch exists. Compared to 2PC: the coordinator is elected, only a majority must vote (not all), and there is a recovery process.\n\nLimits of consensus:\n\n- Voting is synchronous replication, so costlier than async.\n- Needs a strict majority: 3 nodes tolerate 1 failure, 5 tolerate 2. The minority side of a partition blocks.\n- Fixed membership is assumed; dynamic membership is less well understood.\n- Timeout-based failure detection causes needless elections on flaky networks (safety kept, performance hurt).\n- Raft has edge cases with one unreliable link, where leadership keeps bouncing.\n\n### Membership and coordination services\n\nZooKeeper, etcd (and Consul) look like key-value stores but hold **small, in-memory, slow-changing** data, replicated by total order broadcast. You mostly use them indirectly (HBase, YARN, OpenStack Nova, and Kafka rely on ZooKeeper). It is modeled on Google Chubby.\n\n| Feature | Purpose |\n|---|---|\n| Linearizable atomic ops (cas) | Locks, usually as **leases** with expiry |\n| Total ordering | `zxid` as fencing token |\n| Failure detection | Heartbeat sessions; ephemeral nodes released on timeout |\n| Change notifications | Watch instead of poll |\n\nOnly the atomic operations truly need consensus.\n\n- Use cases: leader election and failover, assigning partitions to nodes and rebalancing. Libraries like Curator help; implementing consensus yourself has a poor success record.\n- Runs on a fixed small cluster (3 or 5) while serving many clients, \"outsourcing\" coordination. Fast-changing application state needs other tools such as BookKeeper.\n- **Service discovery** (registering endpoints) does not really need consensus: DNS is not linearizable and stale answers are tolerable. Read-only caching replicas can serve non-linearizable reads.\n- **Membership services** agree on which nodes are alive. A node may be wrongly declared dead, but agreement still matters, e.g. for choosing the lowest-numbered live member as leader.\n\n## 5. Summary: everything reduces to consensus\n\nEquivalent problems: linearizable cas register, atomic commit, total order broadcast, locks and leases, membership/coordination, uniqueness constraints.\n\nSingle-leader gets these trivially, but if the leader fails there are three options:\n\n1. Wait for recovery (XA coordinators): blocks, violates termination.\n2. Manual failover by humans (\"consensus by act of God\"): slow.\n3. Automatic election with a proven consensus algorithm.\n\nA leader only \"kicks the can down the road\": consensus is still needed for leadership changes. Multi-leader and leaderless systems avoid global consensus and cope with branching and merging histories instead.\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Assuming w+r>n gives linearizability | Stale reads (Fig 9-6) | Treat Dynamo-style as non-linearizable |\n| Treating CAP as \"pick 2 of 3\" | Misleading, partitions are not optional | \"Consistent or available when partitioned\"; think latency too |\n| Confusing serializability with linearizability | Wrong guarantee assumed | Multi-object isolation vs single-object recency |\n| Confusing 2PC with 2PL | Wrong concept | Atomic commit vs isolation |\n| Thinking timestamps solve uniqueness | Cannot decide now | Total order broadcast or consensus |\n| Reading from any ZooKeeper replica | Stale value | `sync()` or quorum read |\n\n## Quick recall\n\n- Eventual consistency is weak; linearizability = single-copy illusion, a recency guarantee on one object.\n- Linearizability is needed for locks, leader election, uniqueness constraints, cross-channel races. It costs latency (always) and availability (under partition).\n- Single-leader may be linearizable; consensus is; multi-leader and leaderless are not.\n- CAP: when partitioned, choose consistency or availability. Narrow, mostly historical.\n- Causality is a partial order; linearizability is a total order and implies causality. Causal consistency is the strongest model with no delay penalty.\n- Lamport timestamps `(counter, node ID)` give total order consistent with causality but cannot enforce constraints in real time.\n- Total order broadcast = reliable plus same-order delivery = a log. It is equivalent to consensus.\n- 2PC: prepare then commit, with two points of no return. The coordinator is a single point of blocking; in-doubt transactions hold locks.\n- Consensus: uniform agreement, integrity, validity, termination. It needs a majority, uses epochs and overlapping quorums, and algorithms are VSR, Paxos, Raft, Zab.\n- ZooKeeper/etcd outsource consensus, leases with fencing tokens, failure detection, and notifications.\n"},{"id":"chapter_10_batch-processing","num":10,"title":"Batch Processing","part":"Part III · Derived Data","tagline":"Unix tools, MapReduce, joins, and dataflow engines for bulk derived data.","notes":"---\ntags:\n  - ddia/chapter-10\n  - data-processing/batch\n  - mapreduce\ndate: 2026-11-21\n---\n\n# Chapter 10: Batch Processing\n\n**Summary.** Batch processing takes a large, bounded input, runs a job, and produces derived output, with throughput (not response time) as the main metric. The chapter starts with Unix pipelines and their philosophy (small tools, uniform interface, immutable inputs, logic separated from wiring), then shows MapReduce on a distributed filesystem (HDFS) as the same ideas at cluster scale. It covers how joins and grouping work by partitioning, sorting, and brings related data together (reduce-side and map-side joins), what batch jobs output, how Hadoop compares with MPP databases, and how dataflow engines (Spark, Tez, Flink) and Pregel-style graph processing improve on MapReduce.\n\n> [!info] Reader assumed\n> You know partitioning, replication, joins, indexes, and the OLTP vs analytics split from earlier chapters. This note is for fast revision.\n\n## 1. Three kinds of systems\n\n| Type | Input | Main metric | Example |\n|---|---|---|---|\n| Services (online) | A request from a waiting client | Response time, availability | Web server, database |\n| Batch (offline) | Large bounded dataset, run on a schedule (minutes to days) | Throughput | MapReduce, log analysis |\n| Stream (near-real-time) | Events shortly after they happen | Latency | Chapter 11 |\n\nMapReduce (published 2004) was implemented in Hadoop, CouchDB, MongoDB. Its importance is declining, but it clearly shows why and how batch processing works. Batch computing is old: Hollerith punch-card machines in the 1890 US Census.\n\n## 2. Batch processing with Unix tools\n\n**Example: five most popular URLs from an nginx access log.**\n\n```text\ncat access.log | awk '{print $7}' | sort | uniq -c | sort -r -n | head -n 5\n```\n\n| Step | Does |\n|---|---|\n| `awk '{print $7}'` | Extracts the request URL (7th field) |\n| `sort` | Puts identical URLs next to each other |\n| `uniq -c` | Counts adjacent duplicates |\n| `sort -r -n` | Sorts by count, largest first |\n| `head -n 5` | Keeps top five |\n\nOutput looked like `4189 /favicon.ico`, `3631 /2013/05/24/improving-security-of-ssh-private-keys.html`, and so on. It processes gigabytes in seconds and is easy to adapt (change `$7` to `$1` for client IPs).\n\n**Sorting vs in-memory aggregation.** A Ruby script with a hash table of counters works when the **working set** (distinct URLs plus counters, say under 1 GB) fits in memory. The `sort` pipeline wins when the working set exceeds memory: GNU `sort` spills to disk, merges sorted chunks (same idea as SSTables and LSM-trees, sequential I/O), and parallelizes across cores.\n\n### The Unix philosophy\n\n1. Make each program do one thing well.\n2. Expect its output to become another program's input (no clutter, no interactive input).\n3. Build and try early; throw away clumsy parts.\n4. Prefer tools over unskilled help for lightening a task.\n\nWhat makes composition work:\n\n| Principle | Meaning in Unix | Caveat |\n|---|---|---|\n| Uniform interface | A file (byte sequence, usually newline-separated text) covers files, pipes, devices, sockets | Parsing fields is vague (`{print $7}` is unreadable); few other systems compose this well |\n| Separation of logic and wiring | Programs use `stdin`/`stdout`; the shell wires them (loose coupling, late binding, inversion of control) | Multiple inputs/outputs and network connections are awkward |\n| Transparency | Inputs are immutable; you can inspect any stage with `less` or save intermediate files and restart later stages | |\n\nBiggest limit: Unix tools run on a single machine, which is where Hadoop comes in.\n\n## 3. MapReduce and distributed filesystems\n\nA MapReduce job is like a Unix process: reads inputs, writes outputs, does not modify input, and has no side effects besides output (written sequentially once).\n\n**HDFS** (open source GFS clone; similar services: GlusterFS, QFS, S3, Azure Blob Storage, Swift):\n\n- **Shared-nothing**: ordinary machines on an ordinary network, unlike shared-disk NAS/SAN appliances.\n- A daemon on each machine serves its blocks; a central **NameNode** tracks which blocks live where.\n- Blocks are replicated, or erasure coded (Reed-Solomon, lower overhead, like RAID over the network).\n- Scale: tens of thousands of machines, hundreds of petabytes, at lower cost than dedicated appliances.\n\n### How a job executes\n\nMatching the log example:\n\n1. Read input files and split into **records**.\n2. **Mapper** called once per record, emits any number of key-value pairs, keeps no state between records.\n3. Framework **sorts** all pairs by key (implicit).\n4. **Reducer** called once per key with an iterator over all its values; emits output records.\n\nA second sort (for example ranking by count) needs a **second job**: the mapper prepares data for sorting, the reducer processes sorted data.\n\n```mermaid\nflowchart LR\n    I[\"HDFS input blocks\"] --> M1[\"Map task 1\"]\n    I --> M2[\"Map task 2\"]\n    I --> M3[\"Map task 3\"]\n    M1 -->|\"shuffle: partition by hash of key, sorted\"| R1[\"Reduce task 1\"]\n    M1 --> R2[\"Reduce task 2\"]\n    M2 --> R1\n    M2 --> R2\n    M3 --> R1\n    M3 --> R2\n    R1 --> O[\"HDFS output files\"]\n    R2 --> O\n```\n\nNotice that every mapper sends a sorted partition to every reducer.\n\n- One map task per input file block; the scheduler runs it on a machine holding a replica (\"put the computation near the data\"). Code (e.g. JARs) is copied to the machine.\n- Number of reducers is chosen by the job author; a **hash of the key** decides which reducer gets a pair, so equal keys meet.\n- Each mapper writes sorted, partitioned files on local disk; reducers fetch their partition from every mapper and merge them preserving order. This partition, sort, copy step is the **shuffle** (no randomness involved).\n- Reducer output is written to the distributed filesystem (one local replica plus others).\n\n### Workflows\n\n- One job is limited (page views per URL, but not the top URLs). Jobs are chained by **directory name**: output dir of job 1 is input dir of job 2. This is like Unix commands writing temp files, not pipes.\n- A job's output is valid only if it completes; a downstream job starts only after upstream jobs succeed. Schedulers: Oozie, Azkaban, Luigi, Airflow, Pinball. Recommendation workflows often have 50-100 jobs.\n- Higher-level tools build such workflows automatically: Pig, Hive, Cascading, Crunch, FlumeJava.\n\n## 4. Reduce-side joins and grouping\n\nMapReduce has no indexes; it reads whole input (a full table scan). That is fine for analytics over many records. \"Join\" in batch means resolving **all** associations in the dataset, not looking up one user.\n\n**Example (Fig 10-2):** join user activity events (fact table, only user IDs) with a user database (date of birth). Querying a remote database per event is too slow, nondeterministic, and can overload it. Instead, copy the user DB into HDFS (ETL) and join in the cluster.\n\n**Sort-merge join (Fig 10-3):**\n\n1. One set of mappers reads activity events and emits `user_id -> event`; another reads the user DB and emits `user_id -> date_of_birth`.\n2. Partitioning and sorting by key puts the user record and that user's events together in one reducer call.\n3. A **secondary sort** puts the user record first, then events by timestamp.\n4. Reducer keeps the birth date in a local variable and outputs (URL, viewer age) for each event. Only one user record is in memory at a time; no network requests.\n\nKey idea: the key is like a **destination address**. Mappers \"send messages\" to reducers, separating physical network communication from application logic, and the framework retries failed tasks transparently.\n\n**GROUP BY** is the same pattern: mappers emit the grouping key, reducers aggregate (COUNT, SUM, top-k). **Sessionization** groups all of a user's events (by session cookie or user ID) from many server logs, e.g. for A/B tests.\n\n**Handling skew.** A hot key (linchpin object, such as a celebrity with millions of followers) overloads one reducer, and the whole job waits for the slowest reducer.\n\n| Technique | How |\n|---|---|\n| Pig skewed join | Sampling job finds hot keys; hot-key records go to random reducers, the other join side is replicated to all of them |\n| Crunch sharded join | Same, but you list hot keys explicitly |\n| Hive skewed join | Hot keys in table metadata, stored in separate files, joined map-side |\n| Two-stage grouping | Stage 1 groups on random reducers into partial aggregates; stage 2 combines them |\n\n## 5. Map-side joins\n\nReduce-side joins make no assumptions about the data but pay for sorting, copying, and merging. **Map-side joins** use map-only jobs (no reducers, no sorting) when you can assume something about the inputs:\n\n| Variant | Requirement | How |\n|---|---|---|\n| Broadcast hash join | One input small enough for memory | Each mapper loads the small input into a hash table (or a read-only local-disk index cached by the OS), scans its block of the large input. Pig \"replicated join\", Hive \"MapJoin\", Impala |\n| Partitioned hash join | Both inputs partitioned identically (same key, hash function, partition count) | Each mapper loads only the matching partition. Hive \"bucketed map join\" |\n| Map-side merge join | Same partitioning **and sorted** by the key | Mapper merges both inputs incrementally; no memory limit |\n\n- Output layout differs: reduce-side output is partitioned and sorted by join key; map-side output follows the large input's partitioning.\n- Optimizing joins requires knowing physical layout (partition count, keys, sort order), tracked in HCatalog or the Hive metastore.\n\n## 6. The output of batch workflows\n\nBatch is neither OLTP nor plain analytics; the output is often some other data structure.\n\n| Output | Notes |\n|---|---|\n| Search indexes | Google's original use (5-10 jobs). Mappers partition documents, reducers build each partition's index, files are immutable. Rebuild fully (simple, \"documents in, indexes out\") or build incrementally (Lucene segments; Chapter 11) |\n| Key-value stores for ML and recommendations | Build the database files **inside** the job, then bulk-load into read-only servers (Voldemort, Terrapin, ElephantDB, HBase bulk load) |\n\n**Do not write to a production database from tasks.** Reasons: a network round trip per record is far slower than batch throughput; parallel tasks can overwhelm the database; and external writes are visible side effects that break the all-or-nothing guarantee (partial jobs, retries, speculative execution). With bulk loading, Voldemort keeps serving old files, copies new ones, atomically switches, and can switch back.\n\n**Philosophy: treat inputs as immutable and avoid side effects.**\n\n- Bad code? Roll back and rerun, or keep old output in another directory and switch back (\"human fault tolerance\"). A read-write database cannot do this.\n- Fast feature development (minimizing irreversibility).\n- Failed tasks are retried safely because inputs are immutable and failed output is discarded.\n- Same files feed multiple jobs, including monitoring jobs that compare outputs.\n- Logic separated from wiring, so teams can reuse jobs.\n- Unlike Unix text, Hadoop uses structured, schema-based formats (Avro, Parquet).\n\n## 7. Hadoop vs distributed (MPP) databases\n\nMPP databases (Gamma, Teradata, Tandem NonStop SQL) had the same parallel join algorithms a decade earlier. MPP focuses on parallel analytic SQL; MapReduce plus a DFS is closer to a general-purpose operating system.\n\n| Aspect | MPP database | Hadoop (HDFS plus MapReduce and others) |\n|---|---|---|\n| Storage | Model data up front, import into proprietary format | Any bytes, dump first and interpret later (schema-on-read, data lake, \"sushi principle\": raw data is better) |\n| Processing | Monolithic, tuned, SQL for analysts | Arbitrary code: ML, search indexes with ranking, image analysis; SQL is possible (Hive) |\n| Mixing workloads | One model | Many engines on one cluster and shared files (HBase, Impala use HDFS without MapReduce) |\n| Faults | Abort and rerun whole query (short queries, memory-heavy, hash joins) | Retry individual tasks, write to disk eagerly |\n\n- Typical use: dump raw OLTP data to HDFS, clean it with jobs, load it into an MPP warehouse. Modeling still happens, but decoupled from collection.\n- **Why MapReduce tolerates frequent task kills:** at Google, low-priority batch tasks share machines with production services and are preempted when higher-priority tasks need resources. A task running one hour has about 5% risk of termination (over an order of magnitude more than hardware failures); 100 tasks of 10 minutes each have over 50% chance that at least one is killed. Overcommitting resources improves utilization. YARN, Mesos, and Kubernetes did not support general priority preemption at the time, so the design makes less sense there.\n\n## 8. Beyond MapReduce\n\nRaw MapReduce is robust but laborious (you write joins yourself) and can be orders of magnitude slower than alternatives for some work. Pig, Hive, Cascading, and Crunch help but do not fix the execution model.\n\n### Materialization of intermediate state\n\nMapReduce **materializes** every job's output in the DFS. That suits data you publish for other teams, but is wasteful for intermediates:\n\n- A job waits for **all** tasks of the previous job (stragglers), whereas Unix pipe stages run concurrently.\n- Mappers are often redundant (re-read what a reducer just wrote).\n- Intermediate files are replicated needlessly.\n\n### Dataflow engines\n\nSpark, Tez, Flink treat the whole workflow as one job with flexible **operators** (not strictly map and reduce). Connections between operators: repartition and sort (shuffle), repartition without sort (for hash joins), or broadcast.\n\nAdvantages over MapReduce:\n\n- Sort only where needed.\n- No redundant mappers.\n- Scheduler sees all dependencies, so locality optimizations are possible.\n- Intermediate state in memory or local disk, not HDFS.\n- Operators start as soon as input is ready.\n- JVM reuse reduces startup.\n\nPig, Hive, and Cascading workflows can switch to Tez or Spark by configuration. Tez is a thin library over the YARN shuffle service; Spark and Flink are full frameworks.\n\n**Fault tolerance without durable intermediates:** recompute lost data from earlier stages or original input. Spark tracks ancestry with **RDDs**; Flink checkpoints operator state. Operators should be **deterministic**, or downstream operators must be killed and rerun. Hidden nondeterminism: hash-table iteration order, random numbers (use fixed seeds), system clock, external data. Recompute is not always best: materialize if intermediates are much smaller than the source or computation is CPU-heavy.\n\n**Pipelining:** Flink is built around pipelined execution, closer to Unix pipes. Sorting must consume all input before output, but other stages can stream. Final output still goes to HDFS.\n\n### Graphs and iterative processing\n\n- Offline graph analysis, e.g. **PageRank**, repeatedly follows edges until a condition is met. Plain MapReduce is a single pass, so iterating needs an external scheduler looping jobs, and each iteration rereads the whole graph and rewrites a new dataset (inefficient).\n- Dataflow engines' DAGs are not \"graph processing\": the DAG is the flow of operators, not the data.\n- **Pregel / bulk synchronous parallel (BSP)** (Giraph, Spark GraphX, Flink Gelly): per iteration, a function runs for each vertex with its incoming messages; vertices keep state in memory between iterations and send messages along edges (like MapReduce's key-as-address, or actors but with durable, round-based delivery). Messages are delivered exactly once in the next iteration, with a barrier between iterations.\n- Fault tolerance: checkpoint all vertex state each iteration and roll back to it (or recover just the lost partition if deterministic and messages are logged).\n- Parallel execution: vertices are partitioned (often arbitrarily by vertex ID), so there is much cross-machine messaging and intermediate state can exceed the graph size. If the graph fits on one machine (memory, or disk with GraphChi), single-machine algorithms are likely faster.\n\n### High-level APIs and languages\n\n- Relational-style dataflow APIs (join, group, filter, aggregate) in Hive, Pig, Spark, Flink, with interactive shell use.\n- **Declarative** joins let cost-based optimizers (Hive, Spark, Flink) pick the join algorithm and reorder joins.\n- Unlike SQL, callbacks allow arbitrary code and libraries, which is what distinguishes these systems from MPP databases (whose UDFs are awkward).\n- Adding declarative parts enables column-oriented reads and **vectorized execution** (Spark generates JVM bytecode, Impala uses LLVM), making batch frameworks resemble MPP databases while keeping flexibility.\n- Domain-specific building blocks: ML (Mahout, MADlib), k-nearest neighbors and similarity search (also approximate search for genomics).\n\n## 9. Summary\n\nTwo core problems frameworks solve:\n\n| Problem | MapReduce | Dataflow engines |\n|---|---|---|\n| Partitioning | Mappers by input block; shuffle brings related keys together | Similar, but avoid sorting unless needed |\n| Fault tolerance | Disk writes, restart single tasks; slower when no failures | More in memory, more recomputation; determinism helps |\n\nJoin algorithms recap: **sort-merge** (all inputs shuffled by key), **broadcast hash** (one small input), **partitioned hash** (same partitioning on both).\n\nThe restricted model (stateless callbacks, no side effects except the designated output) lets the framework retry safely and discard failed output, so the result is the same as if no faults occurred. That is much stronger than online services that write to databases as a side effect. A batch job's input is **bounded** (known size, so the job completes); Chapter 11 turns to unbounded streams.\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Writing job output row by row to a live database | Slow, overloads the database, partial results visible | Build files in the job, bulk-load, switch atomically |\n| Joining by querying a remote DB per record | Throughput limited by round trips, nondeterministic | Copy the data into the DFS, use a sort-merge or hash join |\n| Ignoring hot keys | One reducer is slow, the job waits | Skewed or sharded join, two-stage aggregation |\n| Nondeterministic operators in Spark or Flink | Recovery gives different data, cascading reruns | Seed randomness, avoid clocks and unordered iteration |\n| Assuming a map-side join works on any data | Wrong or failing join | Check size, partitioning, and sort order first |\n| Confusing a dataflow DAG with graph processing | Wrong tool | DAG describes operators; graph processing has a graph as data |\n\n## Quick recall\n\n- Batch: bounded input, derived output, throughput focus; inputs immutable, output replaces old.\n- Unix philosophy (do one thing, uniform interface, logic separated from wiring) carries into MapReduce, with HDFS as the \"file\" interface.\n- MapReduce: map, shuffle (hash partition and sort), reduce; chain jobs through directories; one map task per block, computation near data.\n- Reduce-side joins: key is the destination address; secondary sort puts the user record first; sort-merge needs no assumptions but is costly.\n- Map-side joins (broadcast hash, partitioned hash, merge) skip shuffle but need assumptions about size, partitioning, sort.\n- Skew: sample hot keys, spread across reducers, replicate the other side.\n- Output: search indexes and read-only key-value files built inside the job; never write remotely from tasks.\n- Hadoop vs MPP: schema-on-read, arbitrary code, multiple engines, task-level fault tolerance driven by preemption.\n- Dataflow engines avoid materialization, recompute lost data (RDD lineage, checkpoints), need determinism.\n- Pregel/BSP: vertex messages in rounds with checkpointing; use a single machine if the graph fits.\n- Declarative APIs plus optimizers make batch frameworks converge toward MPP databases.\n"},{"id":"chapter_11_stream-processing","num":11,"title":"Stream Processing","part":"Part III · Derived Data","tagline":"Event logs, change data capture, stream joins, and fault tolerance for unbounded data.","notes":"---\ntags:\n  - ddia/chapter-11\n  - stream-processing\n  - data-systems\ndate: 2026-11-21\n---\n\n# Chapter 11: Stream Processing\n\n> [!abstract] Summary\n> Batch jobs (Ch. 10) need bounded input. Real data is **unbounded**: it keeps arriving, so waiting for \"all of it\" never ends. **Stream processing** handles each event as it happens. The chapter covers how events are transported (message brokers vs log-based brokers), how database changes become streams (CDC, event sourcing), and how streams are processed (windows, joins, fault tolerance, exactly-once effects). Core theme: a durable, ordered **log** is the common thread between databases, replication, and messaging.\n\n**Reader:** a backend engineer who knows queues, replication and batch basics.\n\n## 1. Why streams\n\n- Batch input is bounded; sorting (MapReduce) must read everything before producing output.\n- Real data is unbounded. Batch gets around it by cutting artificial chunks (a day, an hour), so output lags by up to the chunk size.\n- Stream processing removes the chunk: process every event as it happens. \"Stream\" = data made available incrementally over time (Unix `stdin/stdout`, lazy lists, TCP, video).\n\n## 2. Transmitting event streams\n\n| Batch world | Stream world |\n|---|---|\n| record in a file | **event**: small, self-contained, immutable record with a (time-of-day) timestamp |\n| writer / reader job | **producer** (publisher) / **consumer** (subscriber) |\n| file name groups records | **topic** (stream) groups related events |\n\n- Polling a datastore for new events gets expensive at low latency (most polls return nothing). Better: notify consumers.\n- Relational **triggers** exist but are limited, an afterthought. Hence dedicated messaging tools.\n\n## 3. Messaging systems\n\nTwo questions distinguish systems:\n\n1. **Producers faster than consumers?** Drop, buffer in a queue, or **backpressure** (block the producer; Unix pipes and TCP do this). If queueing: does it spill to disk, and what does that do to speed?\n2. **Do crashes lose messages?** Durability costs disk writes/replication. Occasional lost sensor readings may be fine; lost counter events are not.\n\n### Direct messaging (no broker)\n\nUDP multicast (stock feeds, low latency), ZeroMQ/nanomsg, StatsD/Brubeck (UDP metrics, approximate), webhooks (HTTP callback). Fast, but the app must handle loss and consumers must be online. A crashed producer loses its retry buffer.\n\n### Message brokers (message queues)\n\nA server (essentially a database tuned for message streams) between producers and consumers. Durability moves to the broker; consumers are **asynchronous** (producer waits only for \"buffered\").\n\n| Aspect | Database | Traditional message broker |\n|---|---|---|\n| Retention | until deleted | deleted after delivery and ack |\n| Working set | any size | assumed small (short queues) |\n| Finding data | secondary indexes, queries | subscribe to topic patterns |\n| Change awareness | snapshot, must re-poll | **notifies** on new messages |\n\nStandards/products: JMS, AMQP; RabbitMQ, ActiveMQ, IBM MQ, Azure Service Bus, Google Cloud Pub/Sub.\n\n### Multiple consumers\n\n```mermaid\nflowchart LR\n    P[\"Producers\"] --> B[\"Broker topic\"]\n    B -->|\"load balancing: each message to ONE consumer\"| C1[\"Consumer 1\"]\n    B --> C2[\"Consumer 2\"]\n    B -->|\"fan-out: each message to ALL\"| C3[\"Group B consumer\"]\n```\n\n- **Load balancing**: share work on expensive messages (AMQP: many clients on one queue; JMS: shared subscription).\n- **Fan-out**: independent consumers each see everything (JMS topic subscription, AMQP exchange bindings). Can be combined via consumer groups.\n\n### Acks and redelivery\n\nConsumer must **ack**; no ack (closed connection or timeout) means redelivery to another consumer. An ack lost in the network means a duplicate (fixing that needs atomic commit).\n\n> [!warning] Load balancing plus redelivery reorders messages\n> Book example (Fig. 11-2): consumer 2 crashes on m3 while consumer 1 handles m4. m3 is redelivered, so consumer 1 sees m4, m3, m5. Fix: one queue per consumer (no load balancing). It matters only if messages are causally dependent.\n\n## 4. Partitioned logs\n\n**Problem:** AMQP/JMS receipt is destructive; a new consumer sees only future messages; you cannot rerun a consumer for the same result. **Idea:** combine database-style durable storage with messaging-style notification = **log-based message broker**.\n\n- A **log** is an append-only record sequence. Producer appends; consumer reads sequentially and waits at the end (like `tail -f`).\n- To scale, **partition** the log across machines. A topic = group of partitions. Each message gets a monotonically increasing **offset** per partition; ordering holds **within** a partition only.\n- Examples: Apache Kafka, Amazon Kinesis Streams, Twitter DistributedLog. Millions of msgs/sec through partitioning and replication, even though everything is written to disk. Google Pub/Sub is architecturally similar but with a JMS-style API.\n\n```mermaid\nflowchart LR\n    Prod[\"Producer\"] -->|append| P0[\"Partition 0: offsets 0..n\"]\n    Prod -->|append| P1[\"Partition 1: offsets 0..m\"]\n    P0 --> CG1[\"Consumer 1 (owns P0)\"]\n    P1 --> CG2[\"Consumer 2 (owns P1)\"]\n    CG1 -.->|\"periodically records offset\"| Off[(\"Consumer offsets\")]\n```\n\n### Logs vs traditional messaging\n\n| | JMS/AMQP style | Log-based |\n|---|---|---|\n| Fan-out | exchange/topic bindings | free: reading does not delete |\n| Load balancing | per message | per **partition** to a consumer |\n| Max parallelism | add consumers freely | at most number of partitions |\n| Slow message | delays only that consumer | blocks the rest of its partition (head-of-line blocking) |\n| Ordering | can be reordered on redelivery | preserved per partition |\n| Best for | expensive messages, order unimportant | high throughput, fast messages, order matters |\n\n### Consumer offsets\n\n- Everything below the offset is processed, above is not. Broker records only offsets, not per-message acks: less bookkeeping, more batching.\n- Offset resembles the **log sequence number** in leader-follower replication: the broker is the leader, the consumer the follower.\n- Consumer failure: another node takes over its partitions from the last recorded offset. Messages processed after that offset get **processed twice**.\n\n### Disk space and slow consumers\n\n- Segments are deleted/archived, so the log is a large on-disk **ring buffer**.\n- Book math: 6 TB disk at 150 MB/s sequential write fills in about **11 hours** at full speed; realistic loads give days or weeks of retention.\n- Throughput stays roughly constant regardless of retention (always written to disk), unlike in-memory brokers that slow when spilling.\n- A slow consumer falling off the end of the log loses messages, but only **that consumer** is affected. Monitor consumer lag and alert.\n- Operational bonus: you can consume production logs for testing/debugging safely; a dead consumer leaves only an offset behind.\n\n### Replaying\n\nConsuming is **read-only**; only the offset moves, and you control it. Start a copy with yesterday's offsets, write output elsewhere, vary the code, repeat. This makes log-based messaging like batch: repeatable transformations and easy recovery from bugs.\n\n## 5. Databases and streams\n\nA replication log **is** a stream of write events. State machine replication: same deterministic events in the same order give the same state.\n\n### 5.1 Keeping systems in sync\n\nReal apps use an OLTP DB, cache, search index, warehouse: several copies of the same data. Options:\n\n- **ETL / batch dumps**: slow.\n- **Dual writes**: app writes each system itself. Two problems:\n  - **Race**: client 1 sets X=A, client 2 sets X=B; the DB sees A then B, the search index sees B then A. They stay inconsistent forever with no error (Fig. 11-4).\n  - **Partial failure**: one write succeeds, the other fails; fixing needs atomic commit (2PC, expensive).\n\nRoot cause: no single leader decides the order. Want one leader (the DB) and the others as followers.\n\n### 5.2 Change data capture (CDC)\n\nCDC observes all writes to a database and exposes them as a stream so derived systems (search index, warehouse, cache) consume it in the same order.\n\n```mermaid\nflowchart LR\n    C1[\"Client 1: set X = A\"] --> DB[(\"System of record DB\")]\n    C2[\"Client 2: set X = B\"] --> DB\n    DB -->|\"CDC\"| Log[\"Log of changes: X=A, X=B\"]\n    Log --> SI[(\"Search index\")]\n    Log --> DW[(\"Data warehouse\")]\n```\n\n- Make one DB the leader, others followers. A log-based broker transports changes while **preserving order**.\n- Implementation: **triggers** (fragile, overhead) or parsing the **replication log** (more robust; schema changes are hard).\n- Tools named: LinkedIn Databus, Facebook Wormhole, Yahoo Sherpa, Bottled Water (Postgres WAL), Maxwell and Debezium (MySQL binlog), Mongoriver (MongoDB oplog), GoldenGate (Oracle).\n- Usually **asynchronous**: slow consumers do not slow the source, but replication-lag issues apply.\n- **Initial snapshot**: a full log history is rarely kept, so new derived systems need a consistent snapshot tied to a known log offset.\n- **Log compaction**: keep only the latest value per key (tombstone = delete). Storage depends on current data size, not write count. A new consumer reads the compacted topic from offset 0 and gets a full copy. Kafka supports it, so the broker can serve as durable storage.\n- **API support**: RethinkDB subscriptions, Firebase/CouchDB change feeds, Meteor (oplog), VoltDB export streams, Kafka Connect.\n\n### 5.3 Event sourcing\n\nSame \"log of changes\" idea at a different abstraction level.\n\n| | CDC | Event sourcing |\n|---|---|---|\n| App uses DB | mutably (update/delete) | event log is append-only, no updates/deletes |\n| Log captures | low-level row changes | application-level events (intent) |\n| App aware? | no | yes, built on events |\n| Log compaction | works: latest event per key replaces earlier | **not possible**: later events do not override earlier ones |\n\n- Example: \"student cancelled enrollment\" is neutral and lets you chain a new feature (\"offer place to next on waiting list\").\n- Current state is derived from events by a **deterministic** transform; snapshots are only a performance optimization.\n- **Commands vs events**: a command may still fail; once validated it becomes an immutable **fact** (event). Consumers cannot reject events, so validate synchronously (e.g., serializable transaction) or split into tentative reservation plus confirmation events.\n\n### 5.4 State, streams, immutability\n\n- Mutable state and an append-only changelog are two sides of the same coin: state = integral of the event stream; stream = derivative of state (Fig. 11-6). Pat Helland: \"The truth is the log. The database is a cache of a subset of the log.\"\n- **Advantages of immutable events**: accountants add compensating entries rather than erasing (auditability); easier diagnosis and recovery from buggy code; captures extra information (item added then removed from cart).\n- **Multiple views from one log**: build separate read-optimized views, run old and new side by side instead of schema migration. This is **CQRS** (separate write form from read forms); normalization vs denormalization debates matter less. Example: Twitter home timelines as a denormalized cache kept in sync by fan-out.\n- **Concurrency control**: consumers are asynchronous, so read-your-writes can fail. Fixes: update view synchronously in one transaction, or use total-order-broadcast ideas. Upside: one event = one atomic append; with same-partitioning of log and state, a single-threaded consumer needs no write concurrency control.\n- **Limits of immutability**: heavy update/delete churn on small data makes history grow and compaction/GC critical. Legal or privacy deletion needs real rewriting (Datomic *excision*, Fossil *shunning*); truly deleting is hard (SSDs, filesystems, backups). Deletion is \"making it harder to retrieve\" rather than impossible.\n\n## 6. Processing streams\n\nThree things to do with a stream: (1) write to a DB/cache/index, (2) push to humans (alerts, dashboards), (3) produce derived output streams via an **operator/job**. Read-only input, append-only output, like Unix/MapReduce. Key difference from batch: it **never ends**, so no sorting, no sort-merge joins, and fault tolerance cannot \"restart from the beginning\".\n\n### 6.1 Uses\n\n| Use | Idea | Notes |\n|---|---|---|\n| **Complex event processing (CEP)** | search for event **patterns**, like regex over events | queries stored long-term, events flow past them (reverse of a DB); Esper, IBM InfoSphere Streams |\n| **Stream analytics** | aggregates over **windows**: rates, rolling averages, trend comparisons | may use approximations (Bloom filter, HyperLogLog); approximation is an optimization, not inherent to streaming |\n| **Materialized views** | keep caches/indexes/state up to date | needs a window back to the beginning of time; Samza and Kafka Streams use compacted topics |\n| **Search on streams** | stored queries, documents flow past (Elasticsearch percolator) | index the queries to avoid testing every one |\n| **Message passing / RPC** | actors: ephemeral, one-to-one, cyclic; streams: durable, multi-subscriber, acyclic | Storm distributed RPC; actor frameworks often lack crash-safe delivery |\n\n### 6.2 Reasoning about time\n\n- Batch uses timestamps embedded in events (deterministic). Many stream frameworks use **processing time** (local clock): simple, but wrong under lag.\n- **Event time vs processing time** (Star Wars release order analogy). Delay causes reordering (events from server B can arrive before A's). Fig. 11-7: after a one-minute restart, a processing-time rate shows a dip then a spike (18 vs the real steady 10) while the true rate never changed.\n- **Knowing when a window is complete**: you cannot be sure. Stragglers can be (a) ignored with a dropped-event metric and alert, or (b) corrected by publishing an updated value (possibly retracting the old one). A special \"no more events before t\" message works but must be tracked per producer.\n- **Whose clock?** A mobile app buffers events offline for hours or days and its clock may be wrong. Log three timestamps: event time (device clock), send time (device clock), receive time (server clock). Receive minus send estimates the device-to-server offset; apply it to the event time.\n\n### 6.3 Window types\n\n| Window | Rule | Example |\n|---|---|---|\n| **Tumbling** | fixed length, no overlap, each event in exactly one | 1 min: round timestamp down to the minute |\n| **Hopping** | fixed length, overlapping | 5 min window, hop 1 min: 10:03:00-10:07:59, then 10:04:00-10:08:59 |\n| **Sliding** | all events within some interval of each other | events at 10:03:39 and 10:08:12 are under 5 min apart, so they share a window |\n| **Session** | no fixed length; ends after inactivity | no events for 30 min closes the user's session |\n\n### 6.4 Stream joins\n\n```mermaid\nflowchart TB\n    SS[\"Stream-stream (window join)\"] --> S1[\"state: recent events indexed by key, e.g. search + click by session ID within 1 hour\"]\n    ST[\"Stream-table (enrichment)\"] --> S2[\"state: local copy of table kept fresh via CDC changelog\"]\n    TT[\"Table-table (materialized view)\"] --> S3[\"state: both changelogs, e.g. tweets JOIN follows gives timelines\"]\n```\n\n- **Stream-stream**: click-through rate from search and click events with the same session ID. The click may never come, may take days, or may arrive before the search; hence a window (say 1 hour). Emit \"clicked\" on match, \"not clicked\" when the search expires. Embedding search details in click events is not equivalent (loses un-clicked searches).\n- **Stream-table**: enrich activity events with user profiles. A remote lookup per event is slow and risks overloading the DB; use a local copy (like a map-side hash join) kept current by the profile **changelog**. The table side is effectively an infinite window with newer versions overwriting older.\n- **Table-table**: Twitter timeline cache = materialized view of `tweets JOIN follows`. Maintained on tweet send/delete and follow/unfollow. Change of tweets joins current followers; change of followers joins current tweets (product rule).\n- **Time-dependence**: order across streams/partitions is not guaranteed, so joins can be **nondeterministic**. Example: tax rate valid at sale date. Data-warehouse fix: **slowly changing dimension** (version ID per record version). Cost: **log compaction no longer possible**.\n\n### 6.5 Fault tolerance\n\nBatch gets \"exactly-once\" (better: **effectively-once**) because tasks retry and failed output is discarded. Streams cannot wait for completion.\n\n| Technique | How | Limit |\n|---|---|---|\n| **Microbatching** (Spark Streaming) | tiny batches, about 1 s; trade scheduling overhead vs delay | implicit tumbling window by processing time |\n| **Checkpointing** (Flink) | rolling state snapshots to durable storage, barriers in the stream; restart from last checkpoint, drop output after it | same |\n| **Atomic commit** | outputs, state changes and ack/offset move all-or-nothing | internal to framework (Dataflow, VoltDB, planned Kafka); not XA across heterogeneous systems; amortize over many messages |\n| **Idempotence** | repeating gives same effect; make non-idempotent ops so by storing the message offset with the write | needs same-order replay, deterministic processing, no concurrent writers, possible fencing on failover |\n\n> [!warning] External side effects\n> Microbatching and checkpointing give exactly-once only **inside** the framework. Once output leaves (DB write, email, external broker), a retry repeats the side effect unless you use atomic commit or idempotence.\n\n**Rebuilding state after failure:** keep state in a remote DB (slow per message), or keep it local and replicate: Flink snapshots to HDFS; Samza and Kafka Streams write changes to a compacted Kafka topic; VoltDB processes each input redundantly on several nodes. Sometimes no replication is needed: replay a short window, or rebuild from a compacted CDC stream. No universal best trade-off.\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Window by processing time | artificial spikes after restart or lag | use event time, handle stragglers |\n| Dual writes to DB and index | permanent silent divergence | CDC from one source of truth |\n| Expect more consumers than partitions to help | extra consumers idle | add partitions |\n| Compact an event-sourced log like CDC | lose history needed for state | keep full events, snapshot instead |\n| Assume checkpoints make emails exactly-once | duplicate side effects | idempotence or atomic commit |\n| Load balance a queue and expect order | redelivery reorders | per-consumer queue or partitioned log |\n\n## Check yourself\n\n> [!question] Q1 · Why does a log-based broker allow replay but an AMQP broker does not?\n>\n> > [!success] Answer\n> > AMQP deletes a message once it is acked, so consuming is destructive. In a log, reading is read-only and the only state is the consumer's offset, which you can rewind.\n\n> [!question] Q2 · Why can't event-sourced logs use CDC-style compaction?\n>\n> > [!success] Answer\n> > A CDC event holds the full new record, so the latest event per key suffices. An event-sourced event records intent, and later events build on earlier ones, so the full history is needed.\n\n> [!question] Q3 · A stream-table join gives different results on rerun. Why, and what is the cost of fixing it?\n>\n> > [!success] Answer\n> > Event order across streams is not fixed, so some events join the old table version, others the new. Version-identifying the records (slowly changing dimension) makes it deterministic but prevents log compaction.\n\n## Quick recall\n\n- Stream = unbounded events; batch chunks, streams process continuously.\n- Brokers: AMQP/JMS (per-message ack, delete, may reorder) vs log-based (partitions, offsets, retained, replayable, order per partition).\n- Backpressure, buffer, or drop when consumers are slow; logs are a big fixed disk buffer (6 TB at 150 MB/s is about 11 h).\n- Dual writes cause races and partial failures; use CDC so one DB is leader.\n- Log compaction keeps the latest value per key; enables rebuilding derived systems from offset 0.\n- Event sourcing records intent as immutable facts; state is derived; CQRS separates write and read models.\n- Use event time, not processing time; stragglers are ignored or corrected.\n- Windows: tumbling, hopping, sliding, session.\n- Joins: stream-stream (windowed), stream-table (local table via CDC), table-table (materialized view); time-dependence makes them nondeterministic.\n- Fault tolerance: microbatching, checkpointing, atomic commit, idempotence; state rebuilt from replicated local state or replay.\n"},{"id":"chapter_12_future-of-data-systems","num":12,"title":"The Future of Data Systems","part":"Part III · Derived Data","tagline":"Integrating derived data, unbundled databases, correctness end to end, and ethics.","notes":"---\ntags:\n  - ddia/chapter-12\n  - data-integration\n  - correctness\n  - ethics\ndate: 2026-11-21\n---\n\n# Chapter 12: The Future of Data Systems\n\n> [!abstract] Summary\n> The last chapter is the author's opinionated look at how data systems *should* be built. Because no single tool fits every workload, real applications combine several, and the right glue is **derived data**: one system of record, with indexes, caches, views and models derived from an ordered log of changes by batch and stream jobs. Taking this further, a database can be **unbundled** into composable, loosely coupled parts; application code becomes a derivation function in a **dataflow**; and correctness comes from **end-to-end** measures (request IDs, idempotence, async constraint checking, auditing) instead of distributed transactions. The book ends with ethics: predictive analytics, surveillance, consent and privacy.\n\n**Reader:** backend engineer who has read (or knows) replication, transactions, batch and streams. Opinions here are the author's, flagged as such in the book.\n\n## 1. Data integration\n\n### Why combine tools\n\n- Each software picks one approach to storage/query; every \"general-purpose\" DB is designed for a particular usage pattern. Data is used in many ways, so you end up composing several tools.\n- Example: OLTP database plus full-text search index. PostgreSQL has basic full-text search; serious search needs specialist tools, but search indexes are poor systems of record.\n- More copies appear: warehouses, caches, denormalized views, ML/ranking systems, notifications. Claims like \"99% of people only need X\" reflect the speaker's experience, not reality.\n\n### Reasoning about dataflows\n\n- Be explicit: where is data written first, and which representations derive from which?\n- Best: write to a **system of record**, apply changes to the search index via CDC **in the same order**. If CDC is the only way into the index, it is consistent with the source (barring bugs).\n- Letting the app write to DB and index directly brings back the Fig. 11-4 race (no one \"in charge\" of order).\n- Principle: funnel all input through **one system that decides a total order**, then derive everything by processing writes in that order (state machine replication). CDC vs event sourcing matters less than choosing a total order.\n- Derivation from a log can be deterministic and idempotent, so recovery is easy.\n\n### Derived data vs distributed transactions\n\n| | Distributed transactions (XA, 2PC) | Log-based derived data |\n|---|---|---|\n| Ordering of writes | locks (2PL), mutual exclusion | the log |\n| Exactly-once effect | atomic commit | deterministic retry plus idempotence |\n| Guarantees | usually **linearizable** (read-your-writes) | async, no timing guarantees by default |\n| Fault behaviour | abort if any participant fails, amplifies failures | contains faults locally |\n\nAuthor's view: XA has poor fault tolerance and performance, and log-based derived data is the most promising integration approach. But saying \"eventual consistency is inevitable, deal with it\" is unhelpful; later sections look for a middle ground.\n\n### The limits of total ordering\n\nA total-order log works at small scale (single-leader DBs do it), but breaks down when:\n\n- throughput exceeds one machine (partitions have no order between them);\n- multiple geographic datacenters (leader per DC, ambiguous cross-DC order);\n- microservices with separate state (no defined order between services);\n- offline-capable clients with local state (client and server see different orders).\n\nTotal order broadcast is equivalent to consensus; scaling it beyond one node and across regions is an open research problem.\n\n**Capturing causality.** Example: a user unfriends someone, then posts a rude message to remaining friends. If friendships and messages live in different places, the notification service may process the message before the unfriend and notify the ex-partner (a join with timing issues). No simple answer; starting points: logical timestamps (still need out-of-order handling), logging the state the user saw before deciding and referencing that event ID (see \"Reads are events too\"), and conflict resolution (does not help external side effects like notifications).\n\n### Batch and stream processing together\n\n- Goal of integration: data in the right form in the right places. Batch and stream are the tools; the main difference is
