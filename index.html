e omitted.\n- **Rename** a field: fine (names are never encoded). **Change a tag**: never (invalidates existing data).\n- **Add a field**: give it a **new tag**.\n  - Forward compatible: old code skips unknown tags, using the type annotation to know how many bytes to skip.\n  - Backward compatible: new code reads old data, but the new field **cannot be `required`**. It must be optional or have a default.\n- **Remove a field**: only if optional, and **never reuse its tag number**.\n- **Change datatype**: risky. For example widening 32-bit to 64-bit: new code reads old data fine, but old code reading a large new value truncates it.\n- Protocol Buffers has no list type, only `repeated`, so the same tag appears multiple times. You can turn an optional field into repeated: new code reading old data sees 0 or 1 element; old code reading new data sees only the last element. Thrift has a real list type (supports nested lists, but not that single-to-multi evolution).\n\n### Avro\n\n- Started in 2009 as a Hadoop subproject because Thrift did not fit Hadoop well.\n- Two schema syntaxes: Avro IDL (human) and JSON (machine). **No tag numbers.**\n\n```text\nrecord Person {\n    string userName;\n    union { null, long } favoriteNumber = null;\n    array<string> interests;\n}\n```\n\n- The encoding is just **values concatenated** in schema order. Nothing identifies fields or types. 32 bytes, the smallest.\n- So decoding requires the **exact schema** used to write. Avro handles this with two schemas:\n  - **Writer's schema**: used when encoding.\n  - **Reader's schema**: what the decoding code expects.\n  - They need only be **compatible**; the library resolves differences by comparing them side by side (Figure 4-6).\n\n```mermaid\nflowchart LR\n    W[\"Writer's schema (app version N)\"] --> B[\"Encoded bytes\"]\n    B --> R[\"Avro resolution\"]\n    WS[\"Writer's schema\"] --> R\n    RS[\"Reader's schema (app version M)\"] --> R\n    R --> O[\"Data in reader's shape\"]\n```\n\n**Resolution rules**\n\n- Field order may differ: fields are matched **by name**.\n- Field in writer but not in reader: ignored.\n- Field in reader but not in writer: filled with the reader's **default value**.\n- Forward compatibility = new writer, old reader. Backward = new reader, old writer.\n- You may only **add or remove a field that has a default**. Adding without default breaks backward compatibility; removing without default breaks forward compatibility.\n- `null` is not a default for everything. A nullable field needs a **union type** such as `union { null, long }`, and null must be in the union (the default must match the union's first branch). Avro has no `optional`/`required` markers. This is more verbose but explicit and prevents bugs.\n- Datatype changes are allowed if Avro can convert the type.\n- Renaming uses **aliases** in the reader's schema: backward compatible, not forward compatible. Adding a union branch is backward compatible, not forward compatible.\n\n**How does the reader get the writer's schema?** Attaching the schema to every record would defeat the savings.\n\n| Context | Approach |\n|---|---|\n| Big file with millions of records | Schema once at the start of the file (object container file) |\n| Database with individually written records | Version number at the start of each record, plus a schema version list in the database (Espresso does this) |\n| Network connection | Negotiate schema version at connection setup (Avro RPC) |\n\nA schema registry also serves as documentation and lets you check compatibility. The version can be an incrementing integer or a schema hash.\n\n**Dynamically generated schemas**\n\n- No tag numbers makes Avro friendly to schemas generated automatically. Example: dump a relational database into an Avro container file by making one record schema per table and one field per column. If the table schema changes, just regenerate; name-based matching copes.\n- With Thrift or Protocol Buffers, tags would likely be assigned by hand, and a generator must never reuse an old tag. That was not their design goal.\n\n**Code generation vs. dynamic languages**\n\n- Thrift and Protocol Buffers rely on code generation, useful in statically typed languages (efficient structures, type checks, IDE help). Little point in dynamic languages.\n- Avro makes code generation optional. Container files are **self-describing**, so tools like Apache Pig can open and analyze them without thinking about schemas.\n\n## 4. The merits of schemas\n\n- Schema languages here are far simpler than XML Schema or JSON Schema, so they are easier to implement and support many languages.\n- The ideas are old: **ASN.1** (1984) uses tag numbers like protobuf and its DER encoding is still used for X.509 certificates. It is complex and badly documented, so a poor choice for new applications.\n- Databases often have proprietary wire protocols with vendor drivers (ODBC, JDBC).\n\nBenefits of binary schema formats:\n\n- More compact than binary JSON (no field names).\n- The schema is documentation that is guaranteed current (needed for decoding).\n- A schema database allows compatibility checks before deployment.\n- Code generation gives compile-time type checking.\n- Same flexibility as schema-on-read, with stronger guarantees and tooling.\n\n## 5. Modes of dataflow\n\nCompatibility is a relationship between the process that **encodes** and the process that **decodes**. Three common paths: databases, service calls, asynchronous message passing.\n\n### Dataflow through databases\n\n- Writing to a database is like **sending a message to your future self**, so backward compatibility is essential.\n- Multiple processes or rolling upgrades mean a newer writer and older reader, so **forward compatibility** is needed too.\n- **Snag (Figure 4-7)**: old code reads a record with a new field (`photoURL`), decodes into a model object, updates, and writes back. The new field is **silently lost**. The formats can preserve unknown fields, but application code that maps to model objects may drop them. Be aware.\n- **Data outlives code**: you can replace code in minutes, but five-year-old records remain in their old encoding unless migrated. Migration is expensive, so databases avoid it.\n  - Relational databases support adding a nullable column without rewriting data. Old rows get nulls filled in at read time. (MySQL often rewrites the whole table.)\n  - LinkedIn's Espresso stores data in Avro and uses its evolution rules.\n- **Archival storage**: backups and warehouse dumps are encoded consistently with the latest schema. Avro container files or a column-oriented format like Parquet fit well.\n\n### Dataflow through services: REST and RPC\n\n- Clients and servers: servers expose an API (a **service**), clients call it. Browsers, native apps and Ajax code all act as clients. A server can also be a client of another service.\n- **SOA / microservices** goal: services that are independently deployable and evolvable, each owned by one team. So old and new versions must interoperate.\n- Services differ from databases: they expose application-specific APIs with predetermined inputs and outputs, giving encapsulation.\n- **Web service** = service over HTTP, in three contexts: client to service over the internet; service to service in the same organization (middleware); service to another organization's service (payment APIs, OAuth).\n\n| | REST | SOAP |\n|---|---|---|\n| What it is | Design philosophy on HTTP (not a protocol) | XML-based protocol |\n| Style | Simple formats, URLs for resources, HTTP caching, auth, content negotiation | Avoids HTTP features; sprawling WS-* standards |\n| Description | OpenAPI (Swagger) optional | WSDL, not human-readable, heavy code generation and tooling |\n| Trend | Growing, esp. cross-organization and microservices | Used in large enterprises, out of favor elsewhere (interoperability problems) |\n\n### Problems with RPC\n\nRPC (since the 1970s) tries to make a remote call look like a local function call (**location transparency**). Older technologies: EJB and RMI (Java only), DCOM (Microsoft only), CORBA (complex, no compatibility). The approach is fundamentally flawed because a network request differs from a local call:\n\n| Local call | Network request |\n|---|---|\n| Predictable; outcome depends on your parameters | Request or response may be lost; remote may be slow or down |\n| Returns, throws, or never returns | May also **time out** with unknown outcome |\n| Retry is safe | Retry may repeat the action unless the protocol is **idempotent** (deduplicates) |\n| Similar execution time each call | Latency varies wildly, under 1 ms to many seconds |\n| Pass pointers to local memory | Parameters must be encoded to bytes (hard for large objects) |\n| Single language | Cross-language type translation (e.g. $2^{53}$ number issues) |\n\nPart of REST's appeal is that it does not hide being a network protocol.\n\n**Current RPC directions**: Thrift and Avro have RPC built in; gRPC uses Protocol Buffers; Finagle uses Thrift; Rest.li uses JSON over HTTP. Newer frameworks are explicit about remote calls: **futures/promises** for async failure and parallel calls (Finagle, Rest.li), **streams** (gRPC), and **service discovery**. Binary RPC can outperform JSON over REST, but REST is good for debugging (browser, `curl`), universally supported, and has a vast tool ecosystem. REST dominates public APIs; RPC suits internal services in the same datacenter.\n\n### Evolution of services\n\n- Reasonable assumption: **servers are updated before clients**. So you need **backward compatibility on requests** and **forward compatibility on responses**.\n- Compatibility is inherited from the encoding: Thrift, gRPC and Avro RPC follow their format's rules; SOAP uses XML schemas (subtle pitfalls); REST typically uses JSON, where adding optional request parameters and new response fields is considered compatible.\n- Across organizations you cannot force clients to upgrade, so compatibility may need to last indefinitely, or you run multiple API versions side by side.\n- No agreement on API versioning. Options: version in the URL, in the HTTP `Accept` header, or a client's requested version stored server-side per API key (Stripe style).\n\n### Message-passing dataflow\n\nBetween RPC and databases: low-latency delivery like RPC, but via an intermediary **message broker** (message queue) that stores the message temporarily.\n\n```mermaid\nflowchart LR\n    P[\"Producer\"] -->|\"publish\"| Q[\"Broker: queue or topic\"]\n    Q -->|\"deliver\"| C1[\"Consumer 1\"]\n    Q -->|\"deliver\"| C2[\"Consumer 2\"]\n    C1 -.->|\"optional reply queue\"| P\n```\n\nAdvantages over direct RPC:\n\n- Buffers if the recipient is down or overloaded.\n- Redelivers to a crashed process, avoiding lost messages.\n- Sender needs no IP address or port of the recipient (handy in the cloud).\n- One message can go to several recipients.\n- Decouples sender from recipient.\n\nIt is usually **one-way and asynchronous**: the sender does not wait for a reply.\n\nBrokers: RabbitMQ, ActiveMQ, HornetQ, NATS, Kafka (older: TIBCO, IBM WebSphere, webMethods). A consumer may republish to another topic or a reply queue. Messages are just bytes with metadata, so any encoding works.\n\nUse a compatible one so publishers and consumers deploy independently. Preserve unknown fields when republishing.\n\n**Distributed actor frameworks**\n\n- **Actor model**: concurrency without threads and locks. Each actor has private state, processes one message at a time, and talks through asynchronous messages. Delivery is not guaranteed.\n- Distributed actors use the same mechanism across nodes, encoding messages for the network. Location transparency works better here than in RPC, since actors already assume message loss.\n- Rolling upgrades still need compatibility:\n\n| Framework | Default encoding | Rolling upgrade |\n|---|---|---|\n| Akka | Java serialization (no compatibility); replaceable, e.g. with Protocol Buffers | Possible after replacing |\n| Orleans | Custom format | No; set up a new cluster, shift traffic, shut down the old one (plug-ins possible) |\n| Erlang OTP | Records | Hard to change record schemas; rolling upgrades need careful planning (new `maps` type may help) |\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Reuse or change a protobuf/Thrift tag | Old data decodes wrongly | Only add new tags; never reuse removed ones |\n| Add a `required` field after launch | New code fails reading old data | Make it optional or give it a default |\n| Add or remove an Avro field with no default | Backward or forward compatibility breaks | Always give defaults |\n| Parse 64-bit IDs as JSON numbers in JavaScript | Precision loss above $2^{53}$ | Send IDs as strings too |\n| Use Java `Serializable` or `pickle` for long-lived data | Lock-in, security risk, no versioning | Use a standard format |\n| Old code read-modify-write through model objects | New fields silently dropped | Preserve unknown fields |\n| Treat remote calls as local | Timeouts, duplicate retries, latency | Plan for failure and idempotence |\n\n## Quick recall\n\n- Backward = new code reads old data. Forward = old code reads new data. Rolling upgrades require both.\n- Avoid language-specific formats. JSON/XML/CSV are fine for interchange but vague on numbers and binary data.\n- Same record: JSON 81 bytes, MessagePack 66, Thrift Binary 59, Thrift Compact 34, Protocol Buffers 33, Avro 32.\n- Thrift/protobuf use field tags: rename freely, never change tags, new fields must be optional or defaulted, never reuse removed tags.\n- Avro has no tags: writer's schema and reader's schema are resolved by field name; add or remove only fields with defaults; nulls need unions.\n- Avro suits dynamically generated schemas and self-describing files; tags suit static code-generation workflows.\n- Databases: data outlives code; preserve unknown fields; archive in a consistent format.\n- Services: REST (simple, ubiquitous) versus SOAP (heavy); RPC hides the network, which is flawed (timeouts, retries, idempotence, latency). Assume servers upgrade first.\n- Message brokers decouple and buffer; actors bring the same idea into the programming model; compatibility still matters there.\n"},{"id":"chapter_05_replication","num":5,"title":"Replication","part":"Part II · Distributed Data","tagline":"Leaders, followers, multi-leader and leaderless designs, and the problems of replication lag.","notes":"---\ntags:\n  - ddia/chapter-5\n  - distributed-systems/replication\ndate: 2026-11-21\n---\n\n# Chapter 5: Replication\n\n> [!abstract] In a nutshell\n> **Replication keeps a copy of the same data on several machines, for availability, lower latency, read scalability and disconnected operation. The hard part is handling changes to the data.**\n>\n> | Approach | Who accepts writes | Main price |\n> |---|---|---|\n> | Single-leader | One leader | Stale reads from followers, failover pain |\n> | Multi-leader | Several leaders | Write conflicts must be resolved |\n> | Leaderless (Dynamo-style) | Any replica, via quorums | Weak guarantees, concurrent-write merging |\n>\n> Reader assumption: you know basic databases and backend work. This chapter assumes the whole dataset fits on one machine; partitioning is Chapter 6.\n\n## 1. Leaders and followers\n\n- Each node holding a copy is a **replica**. Every write must reach every replica.\n- **Leader-based replication** (active/passive, master-slave): clients write only to the **leader**, which stores the write locally and sends it to **followers** (read replicas, secondaries, hot standbys) as a **replication log / change stream**. Followers apply writes in the same order. Reads can go to the leader or any follower.\n- Used by PostgreSQL (9.0+), MySQL, Oracle Data Guard, SQL Server AlwaysOn, MongoDB, RethinkDB, Espresso, and also Kafka and RabbitMQ queues, DRBD.\n\n```mermaid\nflowchart LR\n    W[\"Client write\"] --> L[\"Leader\"]\n    L -->|\"replication stream\"| F1[\"Follower 1\"]\n    L -->|\"replication stream\"| F2[\"Follower 2\"]\n    R[\"Client read\"] --> F2\n    R2[\"Client read\"] --> L\n```\n\n### Synchronous vs asynchronous\n\n| | Synchronous follower | Asynchronous follower |\n|---|---|---|\n| Leader waits for follower ack? | Yes, before reporting success | No |\n| Up-to-date copy guaranteed? | Yes | No, may lag (usually under a second, but possibly minutes) |\n| If follower is down/slow | Writes block | Leader keeps going |\n\n- Making **all** followers synchronous is impractical: one outage halts writes.\n- **Semi-synchronous**: one follower is synchronous, the rest async; if the sync one is slow or dead, an async one is promoted to sync. You always have an up-to-date copy on at least two nodes.\n- **Fully asynchronous**: if the leader dies unrecoverably, unreplicated writes are lost, so a confirmed write is not durable. Still widely used, especially with many or geo-distributed followers.\n- Research: **chain replication** is a synchronous variant used in Microsoft Azure Storage. Replication consistency is tied to **consensus** (Chapter 9).\n\n## 2. Setting up a new follower\n\nA plain file copy is inconsistent because data keeps changing, and locking the DB hurts availability. Steps:\n\n1. Take a consistent snapshot of the leader without a full lock (same feature as backups; e.g. innobackupex for MySQL).\n2. Copy it to the new follower.\n3. Follower requests all changes since the snapshot. The snapshot must be tied to an exact log position: PostgreSQL **log sequence number**, MySQL **binlog coordinates**.\n4. When the backlog is processed it has **caught up**.\n\n## 3. Handling node outages\n\n**Follower failure, catch-up recovery.** The follower keeps a log of received changes on disk. After a crash or network blip it knows the last transaction processed, asks the leader for everything after that, and catches up.\n\n**Leader failure, failover.** Promote a follower, reconfigure clients, make other followers follow the new leader. Can be manual or automatic. Automatic steps:\n\n1. **Detect failure**: usually a timeout (e.g. 30 seconds) since there is no foolproof way.\n2. **Choose a new leader**: election by majority or appointed by a controller node; best candidate is the replica with the most up-to-date data. This is a consensus problem (Chapter 9).\n3. **Reconfigure**: route writes to the new leader; the old leader must become a follower if it returns.\n\n> [!warning] Failover pitfalls\n> - **Lost writes** with async replication: the new leader may lack the old leader's latest writes; the common fix is to discard them, violating durability expectations.\n> - **GitHub incident**: an out-of-date MySQL follower was promoted; its auto-increment counter lagged, so it reused primary keys already used in Redis, leaking some private data to the wrong users.\n> - **Split brain**: two nodes both believe they are leader. Mitigation is **fencing / STONITH** (shut one down), but a poorly designed mechanism can shut down both.\n> - **Timeout tuning**: too long means slow recovery; too short means unnecessary failovers, which make an overloaded system worse.\n>\n> Because of this, some teams prefer manual failover.\n\n## 4. Implementation of replication logs\n\n| Method | What is shipped | Pros | Cons / notes |\n|---|---|---|---|\n| Statement-based | The SQL statements (INSERT/UPDATE/DELETE) | Compact | Breaks with NOW(), RAND(), autoincrement/order-dependent updates, triggers and side effects. Old MySQL (before 5.1); VoltDB makes it safe by requiring deterministic transactions |\n| WAL shipping | The storage engine's append-only log (bytes changed in disk blocks) | Exact copy; used by PostgreSQL, Oracle | Tightly coupled to storage format, so leader and follower usually cannot run different versions, which blocks zero-downtime upgrades |\n| Logical (row-based) log | Row-level records: new values for inserts, row identity (primary key) for deletes, identity plus new values for updates, plus commit record | Decoupled from storage engine, backward compatible, easy for external systems to parse (change data capture, Chapter 11). MySQL row-based binlog | Needs row identity or all old values if no primary key |\n| Trigger-based | Application-level: triggers write changes to a table, an external process replicates them | Flexible: subset of data, different DB types, custom conflict logic (Oracle GoldenGate, Databus, Bucardo) | More overhead, more bugs |\n\n## 5. Problems with replication lag\n\nRead-scaling architecture: many followers, mostly reads (common on the web). It realistically works only with async replication, which means followers can serve **stale** data.\n\nThis is **eventual consistency**: if writes stop, followers eventually catch up. \"Eventually\" has no bound. Lag is normally a fraction of a second but can be seconds or minutes under load or network trouble.\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant L as Leader\n    participant F as Lagging follower\n    U->>L: write comment\n    L-->>U: ok\n    U->>F: read comments\n    F-->>U: no results (write not yet replicated)\n    L->>F: replicate comment (arrives late)\n```\n\n### The three anomalies and their guarantees\n\n| Anomaly | Symptom | Guarantee needed | Techniques |\n|---|---|---|---|\n| Read-your-writes (Fig 5-3) | User submits, reloads, data seems lost | **Read-after-write consistency**: you see your own updates (no promise about others) | Read user-modifiable data from the leader (e.g. own profile); read from leader for 1 minute after last update; block followers more than 1 minute behind; client remembers last-write timestamp (logical, like a log sequence number, or clock) and the replica must be at least that fresh |\n| Monotonic reads (Fig 5-4) | User sees a comment, refreshes, it disappears (time goes backward) | **Monotonic reads**: no older data after newer data; weaker than strong, stronger than eventual | Pin each user to one replica, e.g. by hash of user ID (reroute if it fails) |\n| Consistent prefix reads (Fig 5-5) | Observer sees the answer before the question (Mr. Poons and Mrs. Cake) | **Consistent prefix reads**: writes appear in the order they happened | Matters in partitioned DBs with no global write order; write causally related data to the same partition, or track causality explicitly |\n\nExtra complications for read-after-write: replicas in multiple datacenters (route to the leader's datacenter) and **cross-device** consistency (timestamp metadata must be centralized; devices may be routed to different datacenters).\n\n> [!tip] Design rule\n> Ask what happens if lag grows to minutes or hours. If that is a bad user experience, provide a stronger guarantee. Do not pretend async replication is synchronous. Handling this in application code is complex; **transactions** exist so the database can provide stronger guarantees (Chapters 7 and 9). Claims that transactions are inherently too expensive for scalable systems are \"overly simplistic\".\n\n## 6. Multi-leader replication\n\nMultiple nodes accept writes; each leader is also a follower of the others (master-master, active/active). It rarely makes sense within one datacenter.\n\n### Use cases\n\n- **Multi-datacenter**: a leader per datacenter, normal leader-follower inside it.\n- **Offline clients**: every device (calendar app) has a local DB acting as a leader with async sync; lag can be hours or days. CouchDB targets this.\n- **Collaborative editing** (Etherpad, Google Docs): small units of change with no locking need conflict resolution; with locking it is effectively single-leader.\n\n| Dimension | Single-leader | Multi-leader (multi-DC) |\n|---|---|---|\n| Write performance | Every write crosses the internet to the leader's DC | Writes processed locally, replicated async; inter-DC delay hidden |\n| Datacenter outage | Failover to another DC | Each DC keeps working; catches up later |\n| Network problems | Sensitive to inter-DC link | Async replication tolerates interruptions |\n| Downside | none for conflicts | Concurrent writes in different DCs conflict. Autoincrement keys, triggers and constraints behave oddly; often seen as \"dangerous territory\" |\n\nTools: Tungsten Replicator (MySQL), BDR (PostgreSQL), GoldenGate (Oracle).\n\n### Handling write conflicts\n\nExample (Fig 5-7): two users change a wiki title from A to B and A to C at different leaders. Both succeed locally; the conflict appears only asynchronously. Making detection synchronous defeats the purpose, so you might as well use single-leader.\n\n- **Avoid conflicts**: route all writes for a record through one leader (e.g. a user's \"home\" datacenter). Breaks when that DC fails or the user moves.\n- **Converge**: no write order exists, so all replicas must reach the same final value. Options:\n  - Highest unique ID wins (timestamp means **last write wins, LWW**): data loss.\n  - Higher replica ID wins: data loss.\n  - Merge values (e.g. concatenate \"B/C\").\n  - Record the conflict and resolve later in application code or by asking the user.\n- **Custom logic**: **on write** (handler runs in the background, e.g. Bucardo) or **on read** (all versions stored and returned, app resolves, e.g. CouchDB). Resolution is per row or document, not per transaction.\n- **Automatic resolution research**: **CRDTs** (Riak 2.0), **mergeable persistent data structures** (Git-like three-way merge), **operational transformation** (Etherpad, Google Docs). Amazon cart example: a handler kept added items but not removed ones, so removed items reappeared.\n- Subtle conflicts: a meeting room booked twice on two leaders even though each checked availability.\n\n### Topologies\n\n```mermaid\nflowchart LR\n    subgraph Circular\n      A1[\"N1\"] --> A2[\"N2\"] --> A3[\"N3\"] --> A1\n    end\n    subgraph Star\n      S0[\"Root\"] --- S1[\"N1\"]\n      S0 --- S2[\"N2\"]\n      S0 --- S3[\"N3\"]\n    end\n    subgraph AllToAll[\"All-to-all\"]\n      B1[\"N1\"] --- B2[\"N2\"]\n      B2 --- B3[\"N3\"]\n      B1 --- B3\n    end\n```\n\n- Circular (MySQL default) and star: writes pass through several nodes, so each write is tagged with the IDs of nodes it has passed through to prevent infinite loops. One failed node interrupts the flow; reconfiguration is usually manual.\n- All-to-all is more fault tolerant but messages can **overtake** each other (Fig 5-9): an update may reach a replica before the insert it depends on. A causality problem; timestamps are not enough because clocks are unreliable. Fix: **version vectors** (section 7). PostgreSQL BDR does not give causal ordering; Tungsten does not detect conflicts. Test your database carefully.\n\n## 7. Leaderless replication\n\nNo leader; any replica accepts writes.\n\nRevived by Amazon's **Dynamo** (not the same as DynamoDB, which is single-leader). Riak, Cassandra, Voldemort are **Dynamo-style**. \n\nThe client (or a coordinator that does not enforce ordering) sends writes to several replicas. There is **no failover**.\n\n### Writing when a node is down, repair\n\n- Write goes to all replicas; success after enough acks (e.g. 2 of 3). A returning node is stale, so **reads also go to several nodes** and use **version numbers** to pick the newest.\n- **Read repair**: the client sees a stale replica in a read and writes the new value back. Good for frequently read values.\n- **Anti-entropy process**: background process copies missing data between replicas, in no particular order. Voldemort lacks it; without it, rarely read values may have reduced durability.\n\n### Quorums\n\nWith **n** replicas, a write needs **w** acks and a read queries **r** nodes. If **w + r > n**, read and write sets overlap, so at least one node read is up to date.\n\n| Config | Tolerates |\n|---|---|\n| n=3, w=2, r=2 | 1 unavailable node |\n| n=5, w=3, r=3 (Fig 5-11) | 2 unavailable nodes |\n| w=n, r=1 | Fast reads, but one failed node blocks all writes |\n\n- Common choice: n odd (3 or 5), w = r = (n+1)/2 rounded up. Quorums need not be majorities; only overlap matters. There may be more than n nodes in the cluster; each value lives on only n (links to partitioning).\n- Smaller w and r (w + r <= n): lower latency and higher availability, but more stale reads.\n- If fewer than w or r nodes respond, the operation errors.\n\n> [!warning] Quorums are not an absolute guarantee\n> Stale reads can still occur with w + r > n when: a **sloppy quorum** is used; two writes are concurrent (LWW can lose writes via clock skew); a write races with a read; a write succeeds on fewer than w replicas and is not rolled back; a node with the new value is restored from an older replica; or because of timing edge cases (linearizability, Chapter 9). You usually do **not** get read-your-writes, monotonic reads or consistent prefix reads. Stronger guarantees need transactions or consensus.\n\n**Monitoring staleness**: with leaders you can compute lag as the leader's log position minus the follower's. Leaderless has no fixed order, and with read repair only there is no bound on staleness. Research (e.g. predicting stale-read percentage from n, w, r) is not yet common practice.\n\n### Sloppy quorums and hinted handoff\n\nDuring a network interruption a client may reach live nodes that are not among the value's n \"home\" nodes. A **sloppy quorum** accepts writes on any reachable nodes.\n\nWhen the home nodes return, the temporary holder forwards the data: **hinted handoff**. Raises write availability.\n\nBut it is \"not a quorum at all\" for reads until handoff completes, only a durability assurance. Optional: on by default in Riak, off in Cassandra and Voldemort.\n\n### Multi-datacenter\n\nCassandra and Voldemort: n includes nodes in all DCs, you configure replicas per DC, and clients wait for a quorum only in the local DC; other DCs are replicated asynchronously. Riak keeps client communication local to one DC and replicates between clusters asynchronously, like multi-leader.\n\n## 8. Detecting concurrent writes\n\nIn Dynamo-style stores, concurrent writes occur even with strict quorums, and also during read repair and hinted handoff. In Fig 5-12, nodes receive writes A and B in different orders; naive overwriting leaves replicas permanently inconsistent.\n\n**Last write wins (LWW)**: attach a timestamp, keep the biggest. Converges but sacrifices durability: concurrent writes reported successful are silently dropped, and even non-concurrent writes may be lost due to clock issues. Only option in Cassandra, optional in Riak. Acceptable for caching. Safe use: write each key once and treat it as immutable (e.g. UUID keys in Cassandra).\n\n**Happens-before and concurrency**: A happens before B if B knows about, depends on, or builds on A. Two operations are **concurrent** if neither happens before the other (neither knows of the other). Wall-clock overlap does not matter, only awareness. For any pair: A before B, B before A, or concurrent.\n\n### The shopping-cart algorithm (single replica, Fig 5-13/5-14)\n\n| Step | Client action | Server result |\n|---|---|---|\n| 1 | C1 adds milk | v1: [milk] |\n| 2 | C2 adds eggs (unaware of milk) | v2: [eggs]; also keeps [milk]; returns both |\n| 3 | C1 sends [milk, flour] with version 1 | v3: [milk, flour]; overwrites v1, keeps [eggs] |\n| 4 | C2 merges and sends [eggs, milk, ham] with version 2 | v4; keeps [milk, flour] as concurrent |\n| 5 | C1 merges and sends [milk, flour, eggs, bacon] with version 3 | Overwrites [milk, flour]; keeps [eggs, milk, ham] |\n\nRules:\n\n- Server keeps a version number per key, bumps it on each write, and returns all non-overwritten values plus the latest version.\n- A client must read before writing, send the version from the read, and merge all values it received.\n- On write, the server overwrites all values with that version or lower and keeps higher ones (they are concurrent). A write without a version is concurrent with everything.\n- The server never needs to interpret the value.\n\n**Merging siblings** (Riak's term for concurrent values): LWW loses data; a cart can take the union. But with removals the union resurrects deleted items, so use a **tombstone** (deletion marker with a version). CRDTs (Riak datatypes) merge automatically, preserving deletions.\n\n**Version vectors**: with several replicas, use one version number **per replica** per key. The collection is a **version vector** (Riak 2.0 uses **dotted version vectors**, encoded as the **causal context**). It is returned on reads and sent back on writes, so it is safe to read from one replica and write to another; siblings may result but no data is lost if merged correctly. Version vectors and vector clocks are subtly different; for comparing replica state, version vectors are the right structure.\n\n## Summary: choosing an approach\n\n| | Single-leader | Multi-leader | Leaderless |\n|---|---|---|---|\n| Write path | One node | Several leaders | Any replicas, quorum |\n| Conflicts | None | Yes | Yes |\n| Robustness to faults, network, latency spikes | Lower | Higher | Higher |\n| Reasoning difficulty | Easiest | Harder | Hardest, weakest guarantees |\n\nPurposes of replication: high availability, disconnected operation, latency, scalability.\n\n## Quick recall\n\n- Leader-based: writes to the leader, followers apply the log in order; semi-synchronous = one sync follower, rest async.\n- Async replication can lose confirmed writes on leader failure; failover pitfalls: lost writes, key reuse (GitHub), split brain, timeout tuning.\n- Log formats: statement (fragile), WAL (storage-coupled), logical row-based (decoupled, good for CDC), trigger-based (flexible, costly).\n- Lag anomalies and fixes: read-your-writes (read own data from leader or by timestamp), monotonic reads (sticky replica), consistent prefix reads (keep causally related writes together).\n- Multi-leader fits multi-DC, offline clients and collaborative editing, but needs conflict resolution: avoid, converge (LWW loses data), custom merge, CRDT/OT.\n- Leaderless: w + r > n gives overlap but not a hard guarantee; read repair, anti-entropy, sloppy quorum plus hinted handoff.\n- Concurrent means neither knew of the other; version numbers/vectors detect it, clients merge siblings, tombstones record deletes.\n"},{"id":"chapter_06_partitioning","num":6,"title":"Partitioning","part":"Part II · Distributed Data","tagline":"Splitting data across nodes: key-range and hash partitioning, indexes, and rebalancing.","notes":"---\ntags:\n  - ddia/chapter-6\n  - distributed-systems/partitioning\ndate: 2026-11-21\n---\n\n# Chapter 6: Partitioning\n\n> [!abstract] In a nutshell\n> **Partitioning (sharding) splits a dataset too big or too busy for one machine into pieces, each record belonging to exactly one partition, so storage and query load spread across many nodes.**\n>\n> | Question | Main options |\n> |---|---|\n> | How to assign keys? | Key range, or hash of key |\n> | How to index non-key fields? | Document-partitioned (local) or term-partitioned (global) secondary indexes |\n> | How to add or remove nodes? | Fixed partitions, dynamic splitting, partitions per node |\n> | How does a client find the node? | Any-node forwarding, routing tier, or partition-aware client |\n>\n> Goal throughout: spread data and load evenly and avoid **hot spots**. Reader assumption: you know replication basics from Chapter 5.\n\n## 1. Basics\n\n- Different names for the same idea: **shard** (MongoDB, Elasticsearch, SolrCloud), **region** (HBase), **tablet** (Bigtable), **vnode** (Cassandra, Riak), **vBucket** (Couchbase).\n- Each partition is effectively a small database; different partitions live on different nodes of a shared-nothing cluster. Single-partition queries scale by adding nodes; complex queries can be parallelised but that is harder.\n- Pioneered in the 1980s by Teradata and Tandem NonStop SQL; rediscovered by NoSQL and Hadoop-based warehouses. Applies to both transactional and analytic workloads.\n- Not the same as a **network partition** (a network fault, Chapter 8).\n\n**Partitioning plus replication**: each partition is replicated on several nodes. A node holds several partitions; it can be leader for some and follower for others (Fig 6-1). The partitioning scheme is mostly independent of the replication scheme, so the chapter ignores replication.\n\n```mermaid\nflowchart TB\n    subgraph N1[\"Node 1\"]\n      P1L[\"P1 leader\"]\n      P2F1[\"P2 follower\"]\n    end\n    subgraph N2[\"Node 2\"]\n      P2L[\"P2 leader\"]\n      P1F[\"P1 follower\"]\n    end\n    P1L -.->|\"replicates\"| P1F\n    P2L -.->|\"replicates\"| P2F1\n```\n\n## 2. Partitioning key-value data\n\n**Skew**: unfair partitioning, some partitions with more data or queries. A partition with disproportionate load is a **hot spot**; in the extreme, 9 of 10 nodes idle. Assigning records randomly avoids skew but forces querying all nodes to find a record.\n\n### Key range partitioning\n\nEach partition owns a continuous range of keys (like encyclopedia volumes, Fig 6-2). Boundaries adapt to the data (volume 1 covers A-B, volume 12 covers T-Z) and are chosen manually or automatically. Used by Bigtable, HBase, RethinkDB, MongoDB before 2.4.\n\n- Pro: keys sorted within a partition, so **range scans** are easy; the key can be a concatenated index (e.g. fetch all sensor readings for a month).\n- Con: some access patterns create hot spots. If the key is a timestamp (partition per day), all current writes hit today's partition.\n- Fix: put something else first, e.g. sensor name then timestamp; a multi-sensor time range then needs a separate range query per sensor.\n\n### Hash partitioning\n\nA hash function turns skewed keys into uniformly distributed numbers; each partition owns a range of **hash values** (Fig 6-3 uses the first 2 bytes of MD5, range 0 to 65,535).\n\n- The hash need not be cryptographically strong: Cassandra and MongoDB use MD5, Voldemort uses Fowler-Noll-Vo.\n- Do not use language built-ins like Java `Object.hashCode()` or Ruby `Object#hash`: the same key may hash differently across processes.\n- Boundaries can be evenly spaced or pseudorandom (sometimes called consistent hashing).\n\n> [!note] Consistent hashing is a confusing term\n> Karger et al.'s consistent hashing spreads load across caches/CDNs using random boundaries with no central control or consensus. It has nothing to do with replica or ACID consistency, and works poorly for databases, so the book suggests just saying \"hash partitioning\".\n\n| | Key range | Hash |\n|---|---|---|\n| Range queries | Efficient | Lost; keys scattered. MongoDB hash mode sends range queries to all partitions; Riak, Couchbase, Voldemort do not support primary-key range queries |\n| Load distribution | Risk of hot spots | Even |\n| Typical rebalancing | Dynamic splitting | Fixed number of partitions (or dynamic) |\n\n**Compound key compromise (Cassandra)**: only the first column is hashed to pick the partition; the other columns form a concatenated sorted index (in SSTables). With key (user_id, update_timestamp) you can scan one user's updates over a time interval efficiently, all on one partition, while users spread across partitions.\n\n### Skewed workloads and hot keys\n\nHashing cannot help when all requests hit one key, e.g. a celebrity user. \n\nMost systems do not compensate automatically, so the application must. Technique: append or prepend a random number (a two-digit number splits one key into 100). Trade-off: reads must fetch all 100 keys and combine them, and you must track which keys are split.\n\n## 3. Partitioning and secondary indexes\n\nA secondary index finds occurrences of a value (all red cars, all articles containing a word) and does not map neatly to partitions. It is the raison d'etre of Solr and Elasticsearch. Example: used cars, partitioned by document ID, with indexes on color and make.\n\n```mermaid\nflowchart LR\n    Q[\"Query: color is red\"] --> P0[\"Partition 0: red = 191, 306\"]\n    Q --> P1[\"Partition 1: red = 768\"]\n    P0 --> M[\"Merge results\"]\n    P1 --> M\n```\n\n| | Document-partitioned (local index) | Term-partitioned (global index) |\n|---|---|---|\n| Where index entries live | In the same partition as the documents; each partition indexes only its own documents (Fig 6-4) | Index covers all partitions but is itself partitioned by **term** (e.g. colors a-r in partition 0, s-z in partition 1) (Fig 6-5) |\n| Write | Touches one partition | May touch several index partitions; slower, more complex |\n| Read | **Scatter/gather** over all partitions; prone to tail latency amplification | One request to the partition holding the term |\n| Used by | MongoDB, Riak, Cassandra, Elasticsearch, SolrCloud, VoltDB | DynamoDB global secondary indexes, Riak search, Oracle warehouse (can choose local or global) |\n\n- Term-partitioned index can be partitioned by the term (good for range scans, e.g. asking price) or by hash of the term (more even load).\n- Keeping a global index in sync needs a distributed transaction, not supported everywhere, so updates are often **asynchronous**: a read just after a write may miss it. DynamoDB says global index updates take a fraction of a second normally, longer during faults.\n- Vendors advise structuring partitioning so index queries hit one partition, but that fails for multiple secondary indexes in one query.\n- Rolling your own index in a key-value store risks inconsistency from race conditions and partial failures.\n\n## 4. Rebalancing partitions\n\nRebalancing moves load between nodes when throughput grows, data grows, or a machine fails. Requirements: load shared fairly afterward; reads and writes continue during it; move no more data than necessary.\n\n### Strategies\n\n| Strategy | How it works | Pros / cons | Used by |\n|---|---|---|---|\n| **hash mod N** (do not do this) | partition = hash mod number of nodes | Changing N moves most keys: hash 123456 is on node 6 with 10 nodes, node 3 with 11, node 0 with 12 | - |\n| **Fixed number of partitions** | Create many more partitions than nodes (e.g. 1,000 over 10 nodes, ~100 each). A new node steals whole partitions from each existing node (Fig 6-6) | Only partition-to-node assignment changes, not key-to-partition. Big nodes can get more partitions. Partition count is fixed up front, so it caps node count; too large means overhead, too small or too big makes recovery and rebalancing costly, hard if dataset size varies | Riak, Elasticsearch, Couchbase, Voldemort |\n| **Dynamic partitioning** | Split a partition when it exceeds a size (HBase default 10 GB); merge when it shrinks, like B-tree splits. Halves can move to other nodes | Partition count adapts to data volume. An empty database starts with one partition, so one node takes all writes until the first split; fix with **pre-splitting** (needs known key distribution) | HBase, RethinkDB, MongoDB (key-range and hash, since 2.4) |\n| **Proportional to nodes** | Fixed number of partitions **per node** (Cassandra default 256). A new node randomly picks existing partitions to split and takes half of each | Partition size stays stable as data and nodes grow together. Random boundaries need hash partitioning; matches the original consistent hashing; Cassandra 3.0 added an algorithm avoiding unfair splits | Cassandra, Ketama |\n\nPartitions in the fixed scheme move only for the new node: in Fig 6-6, going from 4 nodes with 20 partitions to 5, only four partitions (p4, p9, p14, p19) move to the new node, one from each old node, and the rest stay put. Until the transfer finishes, the old assignment serves reads and writes.\n\n### Automatic or manual\n\nFully automatic rebalancing is convenient but unpredictable, since moving data is expensive and can overload the network and nodes. \n\nCombined with automatic failure detection it can cascade: an overloaded, slow node is declared dead, load is moved away, making things worse. Couchbase, Riak and Voldemort suggest an assignment and require an administrator to commit it. A human in the loop is slower but avoids surprises.\n\n## 5. Request routing\n\nHow does a client know which IP and port serves key \"foo\"? This is **service discovery**. Three approaches (Fig 6-7):\n\n```mermaid\nflowchart LR\n    C1[\"Client\"] -->|\"1. any node\"| N0[\"Node 0\"]\n    N0 -->|\"forwards\"| N2[\"Node 2 owns foo\"]\n    C2[\"Client\"] -->|\"2. routing tier\"| RT[\"Router\"]\n    RT --> N2\n    C3[\"Client\"] -->|\"3. partition-aware\"| N2\n```\n\n1. Contact any node (e.g. round-robin load balancer); it forwards to the right node.\n2. A **routing tier**, a partition-aware load balancer that handles no requests itself.\n3. Clients know the partition assignment and connect directly.\n\nKey problem: how does the deciding component learn about assignment changes? Everyone must agree, which is a consensus problem (Chapter 9).\n\n- **ZooKeeper** (coordination service): nodes register, it holds the authoritative partition-to-node map, and routers or clients subscribe for changes (Fig 6-8). Used by LinkedIn Espresso (via Helix), HBase, SolrCloud, Kafka.\n- **MongoDB**: own config servers plus **mongos** routers.\n- **Cassandra and Riak**: **gossip protocol** spreads cluster state; any node can take a request and forward it (approach 1). More complexity in nodes, no external dependency.\n- **Couchbase**: no automatic rebalancing; routing tier **moxi** learns changes from nodes.\n- Finding IPs for a router or random node changes slowly, so DNS is often enough.\n\n## 6. Parallel query execution\n\nMost NoSQL stores only support single-key reads/writes and scatter/gather. **Massively parallel processing (MPP)** relational warehouses support joins, filters, grouping and aggregation: the optimizer splits a query into stages and partitions executed in parallel across nodes, which benefits large scans. Details are in Chapter 10.\n\n## Summary\n\n- Partitioning is needed when data or load exceeds one machine; aim to avoid hot spots and rebalance as nodes change.\n- Two main schemes: **key range** (sorted, range queries, hot-spot risk, dynamic splitting) and **hash** (even load, no range queries, typically fixed partition count); hybrids use a compound key.\n- Secondary indexes: **local** (cheap writes, scatter/gather reads) versus **global** (single-partition reads, multi-partition writes).\n- Routing ranges from partition-aware load balancing to parallel query engines.\n- Each partition works mostly independently, but writes spanning several partitions raise the question of partial failure, addressed in later chapters.\n\n## Quick recall\n\n- Partition = shard/region/tablet/vnode/vBucket; each record in exactly one partition; usually combined with replication.\n- Key range gives range scans but timestamp keys cause hot spots; hash gives even spread but kills range queries; Cassandra's compound key is the middle ground.\n- Hot key (celebrity) is the application's problem: add a random suffix, pay with fan-out reads.\n- Local index: write to one partition, read scatter/gather. Global index: read from one partition, write to many, often async.\n- Never use hash mod N; use fixed partitions, dynamic splitting, or partitions per node.\n- Automatic rebalancing plus automatic failure detection can cascade; keep a human in the loop.\n- Routing: forward from any node, routing tier, or smart client; ZooKeeper or gossip keeps the map current.\n"},{"id":"chapter_07_transactions","num":7,"title":"Transactions","part":"Part II · Distributed Data","tagline":"ACID, isolation levels, and what each prevents, up to serializability.","notes":"---\ntags:\n  - ddia/chapter-07\n  - databases/transactions\ndate: 2026-11-21\n---\n\n# DDIA Chapter 7: Transactions\n\nReader: a backend engineer who knows SQL and basic database ideas and wants a fast revision.\n\n> [!abstract] Summary\n> A **transaction** groups several reads and writes into one unit that either commits or aborts, so the application can ignore partial failure and (to a degree) concurrency. The chapter unpacks ACID, shows that \"isolation\" is the slippery letter, and walks through the weak isolation levels used in practice (read committed, snapshot isolation) and the race conditions they allow (dirty writes, read skew, lost updates, write skew, phantoms). It ends with the three ways to get true serializability: actual serial execution, two-phase locking (2PL), and serializable snapshot isolation (SSI).\n\n## 1. Why transactions, and the slippery concept\n\nThings that go wrong: DB or app crashes mid-write, network cuts, concurrent clients overwriting each other, reads of half-updated data, races. Transactions simplify this: all-or-nothing, and on failure the app can **safely retry**.\n\n- Transactions are a programming-model simplification, not a law of nature. They give *safety guarantees*.\n- Style comes from IBM System R (1975); MySQL, PostgreSQL, Oracle, SQL Server are \"uncannily similar\".\n- NoSQL movement (late 2000s) dropped or weakened transactions. The belief \"transactions kill scalability\" and the vendor claim \"serious data needs ACID\" are both called hyperbole.\n- Not every app needs them; some safety can be had without. Decide by knowing the guarantees and their costs.\n\n## 2. The meaning of ACID\n\nACID (Haerder and Reuter, 1983) is now mostly a marketing term: \"ACID compliant\" says little about real guarantees, especially isolation. **BASE** just means \"not ACID\".\n\n| Letter | What it means here | Whose job |\n|---|---|---|\n| **A**tomicity | If a fault hits after some writes, abort and undo all of them. Not about concurrency. \"Abortability\" would be a better name | Database |\n| **C**onsistency | Application invariants (e.g. credits and debits balance) stay true | Mostly the application; DB checks only constraints like FK/uniqueness |\n| **I**solation | Concurrent transactions do not step on each other; formally serializability | Database |\n| **D**urability | Committed data is not forgotten after crash or hardware fault | Database |\n\n> [!warning] \"Consistency\" has four meanings\n> Replica consistency (ch. 5), consistent hashing (ch. 6), CAP-style linearizability (ch. 9), and ACID consistency (app invariants). The C \"was tossed in to make the acronym work\".\n\n**Atomicity** example: without it, a mid-way failure leaves unknown partial changes, and a retry may duplicate work. With it, an aborted transaction changed nothing, so retry is safe.\n\n**Isolation** example (Figure 7-1): two clients read counter 42, each writes 43. Should be 44.\n\n```mermaid\nsequenceDiagram\n    participant U1 as User 1\n    participant DB as Database\n    participant U2 as User 2\n    U1->>DB: get counter\n    DB-->>U1: 42\n    U2->>DB: get counter\n    DB-->>U2: 42\n    U1->>DB: set counter = 43\n    U2->>DB: set counter = 43\n    Note over DB: Should be 44, lost one increment\n```\n\nSerializable isolation is rarely used because of its cost. Oracle 11g's \"serializable\" is actually snapshot isolation (weaker).\n\n**Durability**: single node means data on SSD/disk plus a write-ahead log; replicated means copied to several nodes before reporting commit. No perfect durability exists. Risks listed by the book:\n\n- Disk-only: data inaccessible until machine is fixed; replication keeps availability.\n- Correlated faults (power loss, a crashing input) can take out all replicas, so in-memory data is lost.\n- Async replication can lose recent writes on leader failure.\n- SSDs may violate guarantees on power loss (even `fsync` may not work); firmware and filesystem bugs; silent corruption.\n- 30% to 80% of SSDs develop at least one bad block in 4 years; an unpowered SSD can lose data within weeks.\n\nTakeaway: combine disk, replication and backups; treat \"guarantees\" with a grain of salt.\n\n## 3. Single-object and multi-object operations\n\nMulti-object transactions keep several pieces of data in sync. Figure 7-2 (email app with a denormalized unread counter): user 2 sees the new email but the counter is still 0 (a **dirty read**). Figure 7-3: if the counter update fails, atomicity rolls back the inserted email.\n\n- Relational DBs group operations by the TCP connection: everything between `BEGIN` and `COMMIT`. If the connection drops after commit is requested but before the ack, the client does not know the outcome.\n- Many NoSQL \"multi-put\" calls are **not** transactions: they can succeed for some keys and fail for others.\n\n**Single-object writes** (e.g. a 20 KB JSON doc): storage engines almost always give atomicity (log for crash recovery) and isolation (per-object lock) on one object. Atomic increment and **compare-and-set** avoid read-modify-write races, but calling them \"light-weight transactions\" or \"ACID\" is misleading.\n\n**When you need multi-object transactions:**\n\n| Situation | Why |\n|---|---|\n| Foreign keys / graph edges | References must stay valid |\n| Denormalized document data | Several documents must update together |\n| Secondary indexes | Index and row must not diverge |\n\n**Handling aborts and retries**: ORMs (Rails ActiveRecord, Django) often do not retry. Retry is imperfect:\n\n- Commit succeeded but ack lost: retry runs it twice unless you deduplicate.\n- Overload: retries make it worse; use a retry cap and exponential backoff.\n- Only retry transient errors (deadlock, failover); a constraint violation is permanent.\n- Side effects outside the DB (e.g. sending email) are not undone; 2PC can coordinate them.\n- Client dies while retrying: the data is lost.\n\nLeaderless-replication stores work \"best effort\": they do not undo what they already did.\n\n## 4. Weak isolation levels\n\nRace conditions appear only on unlucky timing, so tests rarely find them. Serializable isolation hides all of them but costs performance, so many systems use weaker levels, which are hard to understand. Weak isolation has caused real money loss, auditor investigations and corrupted data. \"Use an ACID database for financial data\" misses the point, since many \"ACID\" databases default to weak isolation.\n\n### 4.1 Read committed\n\nTwo guarantees:\n\n1. **No dirty reads**: only see committed data. In Figure 7-4, user 1 sets x = 3 but user 2 still reads 2 until commit.\n2. **No dirty writes**: never overwrite uncommitted data. Figure 7-5: Alice and Bob buy the same car, listing goes to Bob but invoice to Alice.\n\nRead committed does **not** fix the Figure 7-1 counter race, because the second write comes after the first commit.\n\nImplementation:\n\n- Dirty writes: row-level locks held until commit/abort (automatic).\n- Dirty reads: read locks would let one long write block readers, so most DBs keep the old committed value and the new uncommitted value, and serve the old one to others.\n- Default in Oracle 11g, PostgreSQL, SQL Server 2012, MemSQL.\n- Only DB2 and SQL Server (with `read_committed_snapshot=off`) use locks for reads.\n\n### 4.2 Snapshot isolation and repeatable read\n\nRead committed allows **read skew (nonrepeatable read)** (Figure 7-6). Alice has $500 in each of two accounts. She reads account 1 ($500), then a $100 transfer commits, then she reads account 2 ($400). She sees $900 total.\n\nUsually harmless after a reload, but not for:\n\n- **Backups**: parts from different times become permanently inconsistent.\n- **Analytic queries and integrity checks**: nonsensical results.\n\n**Snapshot isolation**: each transaction reads from a consistent snapshot, everything committed at its start. Supported by PostgreSQL, MySQL/InnoDB, Oracle, SQL Server. Key principle: **readers never block writers, writers never block readers** (writes still use locks to prevent dirty writes).\n\n**MVCC (multi-version concurrency control)** keeps several committed versions per object. PostgreSQL-style (Figure 7-7):\n\n- Each transaction gets a unique, increasing `txid`.\n- Each row has `created_by` and `deleted_by`. An update is a delete plus a create (txn 13 changes account 2 from $500 to $400: two rows exist).\n- Garbage collection removes rows no transaction can see.\n\nVisibility rules: ignore writes from (1) transactions in progress when mine started, (2) aborted transactions, (3) transactions with a later txid. Everything else is visible. So txn 12 still sees $500 even though txn 13 changed it.\n\nRead committed in MVCC engines uses a new snapshot per query; snapshot isolation uses one snapshot per transaction.\n\nIndexes: either point to all versions and filter, or use **append-only / copy-on-write B-trees** (CouchDB, Datomic, LMDB) where each write creates a new root, and each root is a snapshot (needs background compaction).\n\n> [!warning] Naming mess\n> The SQL standard predates snapshot isolation, so it only defines \"repeatable read\". Oracle calls snapshot isolation \"serializable\"; PostgreSQL and MySQL call it \"repeatable read\"; DB2 uses \"repeatable read\" for real serializability. \"Nobody really knows what repeatable read means.\"\n\n### 4.3 Preventing lost updates\n\nLost update: a read-modify-write cycle where the later write **clobbers** the earlier one (counter increment, editing a JSON document, two users saving a wiki page).\n\n| Technique | How it works | Caveats |\n|---|---|---|\n| Atomic write ops | `UPDATE counters SET value = value + 1 WHERE key='foo'`; also MongoDB, Redis ops. Implemented with an exclusive lock (\"cursor stability\") or single thread | Best if expressible; ORMs make it easy to write unsafe cycles |\n| Explicit locking | `SELECT ... FOR UPDATE` (Example 7-1, multiplayer game move) | Easy to forget a lock somewhere |\n| Automatic detection | DB runs cycles in parallel, aborts on detected lost update | PostgreSQL repeatable read, Oracle serializable, SQL Server snapshot do this; **MySQL/InnoDB repeatable read does not** |\n| Compare-and-set | `UPDATE ... WHERE id=1234 AND content='old content'` | Unsafe if the WHERE reads an old snapshot; check your DB |\n\nReplicated databases (multi-leader, leaderless): locks and CAS assume a single up-to-date copy, so they do not apply. Instead keep conflicting versions (siblings) and merge, or use **commutative** operations (counter increment, set add; Riak 2.0 datatypes). **Last write wins** loses updates and is the default in many replicated DBs.\n\n### 4.4 Write skew and phantoms\n\n**Write skew** (Figure 7-8): a hospital needs at least one doctor on call. Alice and Bob both check \"count >= 2\" under snapshot isolation, both see 2, each takes themself off call, and the count becomes 0.\n\n```mermaid\nsequenceDiagram\n    participant A as Alice txn\n    participant DB as Database\n    participant B as Bob txn\n    A->>DB: count on-call doctors\n    DB-->>A: 2\n    B->>DB: count on-call doctors\n    DB-->>B: 2\n    A->>DB: set Alice off call\n    B->>DB: set Bob off call\n    A->>DB: commit\n    B->>DB: commit\n    Note over DB: 0 doctors on call, invariant broken\n```\n\nIt is neither a dirty write nor a lost update, because different objects are updated. It generalizes lost update: two transactions read the same objects, then update (possibly different) ones.\n\nOptions are limited:\n\n- Atomic single-object ops do not help; automatic lost-update detection does not catch it.\n- Only true serializable isolation prevents it automatically.\n- Multi-object constraints are rarely supported (triggers or materialized views maybe).\n- Second best: lock the rows the decision depends on (`SELECT ... FOR UPDATE`).\n\nMore examples (all unsafe under snapshot isolation): meeting room double booking (Example 7-2), multiplayer game moving two figures to one square, **claiming a username** (a unique constraint fixes this), **double-spending** (balance goes negative).\n\n**Phantoms**: common pattern is SELECT a condition, decide, write, and the write changes the SELECT result. When the check looks for the *absence* of rows, `FOR UPDATE` has nothing to lock. A write changing another transaction's search result is a **phantom**.\n\n**Materializing conflicts**: pre-create lock rows (e.g. a room x 15-minute slot table for six months) and lock those. It leaks concurrency control into the data model, so it is a last resort; prefer serializable.\n\n## 5. Serializability\n\nProblem with weak levels: hard to understand, inconsistently implemented, hard to tell if app code is safe, and no good tools to detect races. Researchers' answer since the 1970s: use serializable. It means the result equals some serial order, so it prevents **all** race conditions. Three implementation families:\n\n| | Actual serial execution | Two-phase locking (2PL) | SSI |\n|---|---|---|---|\n| Style | Pessimistic to the extreme | Pessimistic | Optimistic |\n| Reads block writes? | n/a, one thread | Yes, both ways | No |\n| Main limit | One CPU core; small, fast transactions; data in RAM | Poor, unstable latency; deadlocks | Abort rate under contention; short read-write txns |\n| Used by | VoltDB/H-Store, Redis, Datomic | MySQL InnoDB and SQL Server serializable; DB2 repeatable read | PostgreSQL 9.1+ serializable, FoundationDB (similar) |\n\n### 5.1 Actual serial execution\n\nRun one transaction at a time on a single thread. Became feasible around 2007 because (1) RAM is cheap enough for the active dataset, and (2) OLTP transactions are short; long read-only analytics run on a snapshot outside the loop.\n\n- **Stored procedures**: interactive multi-statement transactions waste time on network round-trips (Figure 7-9), so the whole transaction is submitted up front and runs without waiting on I/O. Needs data in memory.\n- Stored-procedure criticisms: vendor-specific languages (PL/SQL, T-SQL, PL/pgSQL), hard to debug/version/test/monitor, and a bad procedure hurts a shared database badly. Modern systems use general languages: VoltDB Java/Groovy, Datomic Java/Clojure, Redis Lua.\n- VoltDB replicates by running the same procedure on each replica, so procedures must be **deterministic** (use special APIs for time).\n- **Partitioning**: single-partition transactions scale roughly linearly with cores. Cross-partition transactions need lock-step coordination; VoltDB reported about 1,000 cross-partition writes/s, and adding machines does not help. Secondary indexes tend to force cross-partition work.\n\nConstraints: every transaction small and fast (one slow one stalls everything); active dataset fits in memory (or use **anti-caching**: abort, fetch data async, restart); write throughput within one core, or partitionable.\n\n### 5.2 Two-phase locking, 2PL\n\nFor about 30 years the only widely used serializability algorithm. Often called strong strict 2PL.\n\n> [!warning] 2PL is not 2PC\n> Two-phase *locking* is concurrency control. Two-phase *commit* is atomic commit across nodes (ch. 9).\n\nRules: many readers may share an object, but any writer needs exclusive access. Writers block readers and readers block writers. This is the opposite of snapshot isolation's mantra.\n\n- Read needs a **shared** lock; write needs an **exclusive** lock; read-then-write upgrades shared to exclusive.\n- Locks are held until commit or abort: phase 1 acquires (during execution), phase 2 releases (at end).\n- **Deadlock**: detected automatically, one transaction aborted and retried.\n\nPerformance: the big downside. Lock overhead, but mostly reduced concurrency. Latencies are unstable, high percentiles are very slow under contention, one slow transaction can stall everything. Deadlocks are far more frequent than under lock-based read committed, and retries waste work.\n\n**Predicate locks** stop phantoms: a lock belongs to all objects matching a search condition (including not-yet-existing ones). A reader takes a shared predicate lock; a writer checks if the old or new value matches an existing predicate lock. Too slow with many locks.\n\n**Index-range (next-key) locks** are the practical approximation: attach the lock to an index entry or range (e.g. `room_id = 123`, or a time range). It locks a superset, which is safe but less precise. With no usable index, fall back to a shared lock on the whole table.\n\n### 5.3 Serializable snapshot isolation, SSI\n\nFull serializability with only a small penalty versus snapshot isolation. First described in 2008 (Cahill); PostgreSQL since 9.1; FoundationDB uses a similar algorithm.\n\n**Pessimistic vs optimistic**: 2PL waits when something might go wrong. SSI proceeds, then checks at commit and aborts if isolation was violated. Optimistic does badly under high contention and near max throughput (retries add load), but is better with spare capacity and low contention. Commutative atomic operations reduce contention.\n\n**Core idea: decisions based on an outdated premise.** A transaction reads a premise (\"two doctors on call\"), then writes. The DB cannot know how the read is used, so it assumes any change to the read result may invalidate the writes. It detects two cases:\n\n1. **Stale MVCC read** (Figure 7-10): txn 43 ignores uncommitted txn 42's write to Alice. If 42 has committed by the time 43 commits, 43 aborts. The check waits until commit, because 43 may be read-only, and 42 may still abort.\n2. **Write affecting a prior read** (Figure 7-11): both txns read the `shift_id = 1234` index range; the DB records \"read by 42, read by 43\" in the index. A write looks up recent readers and notifies them. Unlike 2PL these are **tripwires, not blocking locks**. Txn 42 commits first and succeeds; when 43 tries to commit, 42's write has taken effect, so 43 aborts and retries.\n\nPerformance notes:\n\n- Tracking granularity trades bookkeeping cost against unnecessary aborts. PostgreSQL avoids some aborts by proving certain overwritten reads are still serializable.\n- No blocking: predictable latency, and read-only queries run lock-free on a snapshot.\n- Not limited to one core: FoundationDB distributes conflict detection across machines.\n- Abort rate matters: read-write transactions should be fairly short; long read-only ones are fine. SSI is less sensitive to slow transactions than 2PL or serial execution.\n\n## 6. Anomalies vs protection\n\n| Anomaly | Meaning | Prevented by |\n|---|---|---|\n| Dirty read | Read uncommitted data | Read committed and stronger |\n| Dirty write | Overwrite uncommitted data | Almost every implementation |\n| Read skew | Different parts seen at different times | Snapshot isolation (MVCC) |\n| Lost update | Concurrent read-modify-write clobbers | Auto-detect in some snapshot impls, else manual lock / atomic op |\n| Write skew | Decision based on stale premise | Only serializable |\n| Phantom | Write changes another's search result | Snapshot isolation for plain reads; index-range locks or serializable for write skew |\n\n> [!question] Q1 · Why does snapshot isolation not stop the on-call doctor bug?\n>\n> > [!success] Answer\n> > Each transaction reads a consistent snapshot showing 2 doctors on call, then updates a different row. No dirty write or lost update occurs, and no lock conflict arises. Only serializable isolation (2PL, SSI, serial) catches it.\n\n> [!question] Q2 · Why can `SELECT FOR UPDATE` not fix the room double booking?\n>\n> > [!success] Answer\n> > The query finds zero rows, so there is nothing to lock. This is a phantom. Fixes: index-range or predicate locks (2PL), SSI, or materializing conflicts as a last resort.\n\n## Common mistakes\n\n| Mistake | What happens | Fix |\n|---|---|---|\n| Assuming \"ACID database\" means serializable | Defaults are often read committed or snapshot isolation; write skew slips through | Check the actual isolation level and test (e.g. Hermitage-style) |\n| Assuming \"repeatable read\" is portable | Means different things in different DBs | Read the docs per database |\n| Retrying every error | Duplicates, overload, pointless retries on permanent errors | Retry only transient errors, with backoff and dedup |\n| Using read-modify-write in app code | Lost updates | Atomic ops, `FOR UPDATE`, or a DB that detects them |\n| Confusing 2PL with 2PC | Wrong mental model | 2PL = locking, 2PC = atomic commit |\n\n## Quick recall\n\n- Transaction = commit or abort as a unit; abort enables safe retry.\n- ACID: A (abort and undo), C (app's job), I (concurrency), D (never perfect: disk + replicas + backups).\n- Read committed = no dirty reads/writes; snapshot isolation = consistent snapshot via MVCC, readers and writers do not block.\n- Lost updates: atomic ops, explicit locks, auto-detection (not MySQL RR), compare-and-set (check safety).\n- Write skew and phantoms need serializability, or locks and materialized conflicts as a fallback.\n- Serial execution: single thread, in-memory, stored procedures, partition by key.\n- 2PL: shared/exclusive locks held to the end, predicate or index-range locks; slow and deadlock-prone.\n- SSI: optimistic, detect stale reads and writes affecting reads at commit; PostgreSQL and FoundationDB.\n"},{"id":"chapter_08_trouble-with-distributed-systems","num":8,"title":"The Trouble with Distributed Systems","part":"Part II · Distributed Data","tagline":"Partial failures, unreliable networks and clocks, and how little a node can know for sure.","notes":"---\ntags:\n  - ddia/chapter-08\n  - distributed-systems/faults\ndate: 2026-11-21\n---\n\n# DDIA Chapter 8: The Trouble with Distributed Systems\n\nReader: a backend engineer who has used replicated databases and message queues and wants a fast revision of why distributed systems are hard.\n\n> [!abstract] Summary\n> Assume anything that can go wrong will (except Byzantine lying). On a single computer, things either work or crash. Across a network you get **partial failures**, and they are nondeterministic. The chapter covers three sources of trouble: **unreliable networks** (loss, unbounded delay, no way to tell why a reply is missing), **unreliable clocks** (drift, jumps, no confidence interval, so timestamps cannot order events), and **process pauses** (GC, VM suspend, so a node can be declared dead and come back unaware). It then explains how to reason about truth by quorum, how fencing tokens protect against zombie leaders, what Byzantine faults are, and how system models and safety/liveness properties let algorithms (chapter 9) be proven correct.\n\n## 1. Faults and partial failures\n\n- A single computer is deterministic: it works or fails completely (kernel panic). Computers deliberately crash rather than return wrong results.\n- A multi-node system has **partial failure**: some parts broken in unpredictable ways while others work. It is **nondeterministic**: the same operation may sometimes work and sometimes fail, and you may not even know which.\n- Coda Hale's anecdote lists real faults: network partitions, PDU and switch failures, rack power cycles, whole-DC outages, and a truck hitting the HVAC system.\n\n**Cloud computing vs supercomputing**\n\n| | HPC / supercomputer | Cloud / internet services |\n|---|---|---|\n| Workload | Offline batch (weather, molecular dynamics) | Online, low latency, must stay up |\n| Fault handling | Checkpoint; stop the whole job on node failure, restart (partial failure becomes total) | Tolerate failed nodes; rolling upgrades; kill and replace slow VMs |\n| Hardware | Specialized, reliable nodes, RDMA, meshes/toruses | Commodity machines, higher failure rate, IP/Ethernet in Clos topologies |\n| Network | Nodes close together | Possibly geo-distributed over the internet |\n\nIn big systems something is always broken. We must build a reliable system from unreliable components, e.g. TCP over IP (retransmits, deduplicates, reorders) and error-correcting codes. There are limits: TCP cannot remove delays. Test with deliberately injected faults: \"suspicion, pessimism, and paranoia pay off\".\n\n## 2. Unreliable networks\n\nThe systems in this book are **shared-nothing**: machines communicate only over an **asynchronous packet network** (no guarantee on delivery or timing).\n\n**Why a missing reply is ambiguous** (Figure 8-1). The request may have been lost, queued, the node may be down or paused (GC), or it processed the request but the response was lost or delayed. You cannot tell which of these happened. The usual answer is a **timeout**, but it still does not tell you whether the request was processed.\n\n```mermaid\nsequenceDiagram\n    participant C as Client\n    participant S as Service\n    C->>S: request\n    Note over S: processed, but...\n    S--xC: response lost or delayed\n    Note over C: timeout, cannot tell if request was processed\n```\n\n**Network faults in practice**. One study of a medium datacenter found about 12 network faults per month (half disconnect one machine, half a whole rack). Redundant gear does not help much against human error such as misconfiguration. Other examples: a switch upgrade causing over a minute of delay, sharks biting undersea cables, a NIC that drops inbound but sends outbound. Untested fault handling can deadlock a cluster or even delete data (Chaos Monkey idea: trigger faults on purpose). Handling a fault need not mean tolerating it: showing an error may be fine.\n\n### 2.1 Detecting faults\n\nFeedback is possible only in special cases: OS sends RST/FIN if the process is dead but the host is up; a script can notify others (HBase does this); switch management interfaces; ICMP Destination Unreachable. You cannot count on these. Even a TCP ack does not mean the application processed the request; you need an application-level response. In general: retry, wait for a timeout, then declare the node dead.\n\n### 2.2 Timeouts and unbounded delays\n\n- Long timeout: slow detection. Short timeout: risk of false positives (action done twice; load moves to others, which can cause **cascading failure**).\n- If delays were bounded by $d$ and processing by $r$, a timeout of $2d + r$ would be correct. Real asynchronous networks and servers give no such bounds.\n\n**Why delays vary: queueing**\n\n| Source | Effect |\n|---|---|\n| Switch queue (Figure 8-2: ports 1, 2, 4 all send to port 3) | Wait, or dropped packet and resend |\n| Destination OS queue when all CPU cores are busy | Arbitrary wait |\n| Virtual machine paused for tens of ms | Incoming data buffered |\n| TCP flow control (backpressure) and retransmission timeouts | Queueing at sender, delay from retransmit |\n\n- **TCP vs UDP**: UDP has no flow control or retransmit, so it is used where late data is worthless (VoIP, video calls).\n- Queues are worst near capacity. Noisy neighbors in shared clouds (e.g. MapReduce saturating links) add variance.\n- Pick timeouts experimentally, or better, adapt them to observed response times and jitter with a **Phi Accrual failure detector** (Akka, Cassandra).\n\n### 2.3 Synchronous vs asynchronous networks\n\nTelephone networks use **circuits**: ISDN reserves 16 bits per frame, 4,000 frames per second, which is 16 bits every 250 microseconds. No queueing, so delay is **bounded**.\n\n| | Circuit-switched (phone) | Packet-switched (Ethernet/IP, TCP) |\n|---|---|---|\n| Bandwidth | Fixed reservation | Dynamic share |\n| Delay | Bounded | Unbounded (queues) |\n| Utilization | Wasted when idle, bad for bursty traffic | High, cheaper |\n\n- Datacenters and the internet use packet switching because traffic is **bursty**. Using circuits for file transfers wastes capacity and forces you to guess a bandwidth.\n- ATM and InfiniBand are partial hybrids. QoS and admission control can emulate circuits, but are not enabled in public clouds or the internet.\n- Variable delay is a **cost/benefit trade-off** (utilization vs latency guarantees), not a law of nature. So there is no \"correct\" timeout.\n\n## 3. Unreliable clocks\n\nClocks answer **duration** questions (timeouts, percentiles, throughput) and **point in time** questions (publish date, expiry, log timestamps). Each machine has its own quartz clock that drifts; NTP synchronizes them imperfectly.\n\n### 3.1 Two kinds of clock\n\n| | Time-of-day clock | Monotonic clock |\n|---|---|---|\n| Examples | `clock_gettime(CLOCK_REALTIME)`, `System.currentTimeMillis()` | `CLOCK_MONOTONIC`, `System.nanoTime()` |\n| Meaning | Wall-clock since the epoch (1970 UTC) | Arbitrary origin, only differences matter |\n| Can jump back? | Yes (NTP reset, leap seconds) | No; NTP may only slew rate by up to 0.05% |\n| Use for | Dates and timestamps | Timeouts, elapsed time |\n| Compare across machines? | Roughly, if synced | Never |\n\n### 3.2 Clock accuracy problems\n\n- Drift: Google assumes 200 ppm, i.e. 6 ms if synced every 30 s, 17 s if synced once a day.\n- Forced resets when too far off; NTP blocked by a firewall unnoticed.\n- NTP accuracy is bounded by network delay: about 35 ms best case over the internet, spikes to about 1 s.\n- Misconfigured NTP servers (hours off); clients query several and drop outliers.\n- Leap seconds (a minute of 59 or 61 seconds) have crashed systems; smearing spreads the adjustment over a day.\n- VMs: pauses look like the clock jumping. Mobile or embedded devices: the user may set a wrong clock.\n- High accuracy is possible, e.g. MiFID II requires high-frequency traders to sync within 100 microseconds of UTC, using GPS and PTP, but it takes effort.\n\n### 3.3 Relying on synchronized clocks\n\nBad clocks fail silently (data loss rather than a crash). So monitor clock offsets and evict nodes that drift.\n\n**Timestamps for ordering events** (Figure 8-3). With multi-leader replication, client A writes x=1 on node 1 with timestamp 42.004. Client B, causally later, increments x on node 3, giving x=2 with timestamp 42.003. Skew is under 3 ms. Node 2 sees 42.004 as newer and drops B's write.\n\n**Last write wins (LWW)** problems:\n\n- Writes silently disappear when a lagging node's write loses to a fast clock.\n- It cannot tell sequential writes from truly concurrent ones (needs version vectors).\n- Timestamp ties need a tiebreaker (e.g. random number), which can also violate causality.\n- Used in Cassandra and Riak.\n\nBetter: **logical clocks** (incrementing counters, ordering only) versus **physical clocks** (time-of-day and monotonic). More in chapter 9, \"Ordering Guarantees\".\n\n**Confidence intervals.** A reading is a range, not a point: ±100 ms makes microsecond digits meaningless. Most APIs hide the uncertainty. Google's **TrueTime** (Spanner) returns `[earliest, latest]`.\n\n**Global snapshots**. Snapshot isolation needs monotonically increasing transaction IDs, which need coordination across machines. Spanner uses timestamps from TrueTime: if two intervals do not overlap, order is certain. It **waits out the confidence interval** before committing a read-write transaction, so later readers' intervals do not overlap. Google puts a GPS receiver or atomic clock in each datacenter (about 7 ms uncertainty). Snowflake-style IDs are only approximately monotonic and not causal.\n\n### 3.4 Process pauses\n\nExample: a leader holds a **lease** (a lock with a timeout) and checks `lease.expiryTimeMillis - currentTimeMillis() < 10000` in a loop before processing each request.\n\n```mermaid\nflowchart TD\n    A[\"Get request\"] --> B[\"Check lease has 10 s left\"]\n    B --> C[\"Thread pauses 15 s\"]\n    C --> D[\"Lease expired, new leader elected\"]\n    D --> E[\"Paused node resumes and processes request\"]\n    E --> F[\"Unsafe: two leaders\"]\n```\n\nTwo flaws: it compares a remote expiry time to the local clock, and (even with a monotonic clock) it assumes little time passes between the check and `process(request)`.\n\nCauses of pauses: stop-the-world **GC** (sometimes minutes), VM suspend and live migration, laptop lid closed, context switches and VM **steal time**, synchronous disk I/O (including lazy class loading, EBS), swapping and thrashing, SIGSTOP (Ctrl-Z). A node must assume it can be paused at any point; mutexes and semaphores do not translate, since there is no shared memory.\n\n**Response time guarantees.** Hard real-ti
